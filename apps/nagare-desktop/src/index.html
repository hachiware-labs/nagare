<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nagare</title>
<style>
/* ============ Design tokens (hachiware-labs.com 準拠) ============ */
:root {
  --bg: #ffffff;
  --text: #020617;          /* slate-950 */
  --text-body: #334155;     /* slate-700 */
  --text-muted: #64748b;    /* slate-500 */
  --text-faint: #94a3b8;    /* slate-400 */
  --border: #e2e8f0;        /* slate-200 */
  --border-strong: #cbd5e1; /* slate-300 */
  --primary: #4338ca;       /* indigo-700 */
  --primary-hover: #3730a3; /* indigo-800 */
  --primary-soft: #eef2ff;  /* indigo-50 */
  --primary-line: #c7d2fe;  /* indigo-200 */
  --focus: #818cf8;         /* indigo-400 */
  --success: #15803d; --success-soft: #f0fdf4; --success-line: #bbf7d0;
  --warning: #b45309; --warning-soft: #fffbeb; --warning-line: #fde68a;
  --danger: #b91c1c;  --danger-soft: #fef2f2;  --danger-line: #fecaca;
  --radius: 8px;
  --font: "Geist", ui-sans-serif, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic UI", Meiryo, sans-serif;
  --mono: "Geist Mono", ui-monospace, "Cascadia Code", Consolas, monospace;
}
* { margin:0; padding:0; box-sizing:border-box; }
html,body { height:100%; min-height:0; overflow:hidden; }
body { font-family:var(--font); color:var(--text-body); background:var(--bg); font-size:14px; line-height:1.6; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility; }
h1,h2,h3,h4 { color:var(--text); line-height:1.4; }
button { font-family:inherit; font-size:inherit; cursor:pointer; }
input,textarea,select { font-family:inherit; font-size:inherit; color:var(--text); }

/* ============ App shell ============ */
.app { display:flex; height:100%; min-height:0; overflow:hidden; }
.sidebar { width:216px; height:100%; min-height:0; flex-shrink:0; border-right:1px solid var(--border); display:flex; flex-direction:column; overflow:hidden; background:#fff; }
.brand { display:flex; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--border); }
.brand img { width:56px; height:56px; border-radius:var(--radius); object-fit:contain; box-shadow:0 0 0 1px var(--border); background:#fff; }
.brand .name { font-size:17px; font-weight:700; letter-spacing:.16em; color:var(--text); }
.brand .org { display:block; font-size:9.5px; font-weight:600; letter-spacing:.2em; color:#4f46e5; text-transform:uppercase; margin-top:2px; }
.nav { padding:10px 8px; display:flex; flex-direction:column; gap:2px; min-height:0; overflow-y:auto; }
.nav-label { font-size:10px; font-weight:600; letter-spacing:.14em; color:var(--text-faint); text-transform:uppercase; padding:12px 10px 4px; }
.nav a { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:var(--radius); color:var(--text-body); text-decoration:none; font-weight:500; transition:.15s; }
.nav a:hover { background:var(--primary-soft); color:var(--primary); }
.nav a.active { background:var(--primary-soft); color:var(--primary); font-weight:600; }
.nav a .dot { width:6px; height:6px; border-radius:50%; background:var(--warning); margin-left:auto; }
.nav-more { margin-top:8px; border-top:1px solid var(--border); padding-top:8px; }
.nav-more summary { list-style:none; cursor:pointer; padding:7px 10px; color:var(--text-muted); font-size:12px; font-weight:600; }
.nav-more summary::-webkit-details-marker { display:none; }
.nav-more summary::after { content:"▾"; float:right; color:var(--text-faint); transition:transform .15s; }
.nav-more:not([open]) summary::after { transform:rotate(-90deg); }
.nav-more summary:hover { color:var(--primary); background:var(--primary-soft); border-radius:var(--radius); }
.nav-more a { margin-top:2px; padding-left:18px; font-size:13px; }
.main { flex:1; min-width:0; min-height:0; display:flex; flex-direction:column; overflow:hidden; }
.topbar { display:flex; flex:0 0 auto; align-items:center; gap:12px; padding:10px 24px; border-bottom:1px solid var(--border); background:rgba(255,255,255,.88); backdrop-filter:blur(24px); min-height:49px; }
.topbar .crumb { font-size:13px; color:var(--text-muted); }
.topbar .crumb b { color:var(--text); font-weight:600; }
.topbar .spacer { flex:1; }
.content { flex:1 1 auto; min-height:0; overflow-y:auto; overscroll-behavior:contain; padding:24px; background:#f8fafc; }
.content::-webkit-scrollbar { width:10px; }
.content::-webkit-scrollbar-thumb { background:var(--border); border-radius:8px; border:2px solid #f8fafc; }
.content::-webkit-scrollbar-thumb:hover { background:var(--border-strong); }
.content-inner { max-width:920px; margin:0 auto; }

/* ============ Primitives ============ */
.btn { display:inline-flex; align-items:center; gap:6px; padding:8px 16px; border-radius:var(--radius); border:1px solid transparent; font-weight:600; font-size:13px; transition:all .15s cubic-bezier(.4,0,.2,1); }
.btn:focus-visible { outline:2px solid var(--focus); outline-offset:1px; }
.btn:active { transform:translateY(1px); }
.btn:disabled { opacity:.45; pointer-events:none; }
.btn-primary { background:linear-gradient(180deg,#4f46e5,#4338ca); color:#fff; box-shadow:inset 0 1px 0 rgba(255,255,255,.16), 0 1px 2px rgba(67,56,202,.35); }
.btn-primary:hover { background:linear-gradient(180deg,#4338ca,#3730a3); box-shadow:inset 0 1px 0 rgba(255,255,255,.12), 0 2px 6px rgba(67,56,202,.4); }
.btn-primary:active { box-shadow:inset 0 1px 2px rgba(0,0,0,.2); }
.btn-secondary { background:linear-gradient(180deg,#fff,#fafbfc); color:var(--text-body); border-color:var(--border); box-shadow:0 1px 2px rgba(2,6,23,.05); }
.btn-secondary:hover { border-color:var(--border-strong); background:#f8fafc; box-shadow:0 2px 4px rgba(2,6,23,.06); }
.btn-ghost { background:transparent; color:var(--primary); }
.btn-ghost:hover { background:var(--primary-soft); }
.btn-sm { padding:5px 12px; font-size:12px; }
.btn-danger-soft { background:#fff; color:var(--danger); border-color:var(--danger-line); }
.btn-danger-soft:hover { background:var(--danger-soft); }
.card { background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 1px 2px rgba(2,6,23,.04); }
.badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:600; white-space:nowrap; border:1px solid transparent; }
.badge .bdot { width:6px; height:6px; border-radius:50%; background:currentColor; }
.badge-run  { background:var(--primary-soft); color:var(--primary); border-color:var(--primary-line); }
.badge-run .bdot { animation:pulse 1.6s ease-in-out infinite; }
.badge-ask  { background:var(--warning-soft); color:var(--warning); border-color:var(--warning-line); }
.badge-fix  { background:var(--danger-soft); color:var(--danger); border-color:var(--danger-line); }
.badge-done { background:var(--success-soft); color:var(--success); border-color:var(--success-line); }
.badge-neutral { background:#f8fafc; color:var(--text-muted); border-color:var(--border); }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
.chip { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:6px; font-size:11.5px; font-weight:500; background:var(--primary-soft); color:var(--primary); border:1px solid var(--primary-line); cursor:pointer; }
.chip:hover { background:#e0e7ff; }
.chip.k::before { content:"📘"; font-size:10px; }
input[type=text], textarea, select { width:100%; padding:8px 12px; border:1px solid var(--border); border-radius:var(--radius); background:#fff; transition:.15s; box-shadow:inset 0 1px 2px rgba(2,6,23,.03); }
input[type=text]:focus, textarea:focus, select:focus { outline:none; border-color:var(--focus); box-shadow:inset 0 1px 2px rgba(2,6,23,.02), 0 0 0 3px rgba(129,140,248,.22); }
input[type=radio], input[type=checkbox] { accent-color:var(--primary); }
textarea { resize:vertical; min-height:72px; line-height:1.6; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:12.5px; font-weight:600; color:var(--text); margin-bottom:5px; }
.field label .required { margin-left:4px; font-size:11px; font-weight:600; color:var(--text-muted); }
.field .hint { font-size:12px; color:var(--text-muted); margin-top:4px; }
.advanced-settings { border-top:1px solid var(--border); padding-top:10px; margin-top:12px; }
.advanced-settings summary { cursor:pointer; font-weight:700; color:var(--text-body); margin-bottom:10px; }
.mono { font-family:var(--mono); font-size:12px; }
.visually-hidden { position:absolute !important; width:1px !important; height:1px !important; padding:0 !important; margin:-1px !important; overflow:hidden !important; clip:rect(0,0,0,0) !important; white-space:nowrap !important; border:0 !important; }

/* ============ Screens ============ */
.screen { display:none; }
.screen.active { display:block; }
.page-title { font-size:19px; font-weight:700; margin-bottom:4px; }
.page-sub { color:var(--text-muted); font-size:13px; margin-bottom:20px; }

/* Empty home */
.hero-empty { text-align:center; padding:48px 24px 40px; }
.hero-empty img { width:150px; height:150px; object-fit:contain; margin-bottom:18px; border-radius:16px; box-shadow:0 0 0 1px var(--border), 0 4px 16px rgba(2,6,23,.06); }
.hero-empty h2 { font-size:20px; margin-bottom:8px; }
.hero-empty p { color:var(--text-muted); max-width:440px; margin:0 auto 24px; }
.flow-model { display:flex; justify-content:center; gap:0; margin:28px auto 32px; max-width:760px; }
.flow-step { flex:1; position:relative; padding:14px 10px 12px; }
.flow-step:not(:last-child)::after { content:"→"; position:absolute; right:-8px; top:22px; color:var(--text-faint); font-size:14px; }
.flow-step .fs-icon { width:36px; height:36px; margin:0 auto 8px; border-radius:var(--radius); background:linear-gradient(180deg,#f5f7ff,var(--primary-soft)); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:16px; border:1px solid var(--primary-line); box-shadow:0 1px 2px rgba(67,56,202,.08), inset 0 1px 0 rgba(255,255,255,.6); }
.flow-step .fs-name { font-weight:600; color:var(--text); font-size:13px; }
.flow-step .fs-desc { font-size:11.5px; color:var(--text-muted); line-height:1.5; margin-top:2px; }
.flow-step.human .fs-icon { background:var(--warning-soft); color:var(--warning); border-color:var(--warning-line); }

/* Work home */
.ask-box { border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:24px; background:#fff; box-shadow:0 1px 2px rgba(2,6,23,.04), 0 4px 12px -6px rgba(2,6,23,.05); transition:.15s; }
.ask-box:focus-within { border-color:var(--focus); box-shadow:0 0 0 3px rgba(129,140,248,.22), 0 4px 12px -6px rgba(2,6,23,.05); }
.ask-box textarea { border:none; box-shadow:none; padding:0; min-height:52px; font-size:14.5px; }
.ask-box textarea:focus { box-shadow:none; }
.ask-foot { display:flex; align-items:center; gap:8px; margin-top:10px; }
.ask-foot .meta { font-size:12px; color:var(--text-muted); display:flex; gap:12px; }
.work-constraints { margin-top:10px; border-top:1px solid var(--border); padding-top:9px; }
.work-constraints summary { color:var(--text-muted); font-size:12px; font-weight:600; cursor:pointer; }
.work-constraints textarea { margin-top:8px; min-height:64px; padding:8px 10px; border:1px solid var(--border); border-radius:6px; font-size:12.5px; }
.work-constraints p { margin-top:5px; color:var(--text-muted); font-size:11.5px; }
.filters { display:flex; gap:8px; margin:20px 0 10px; align-items:center; }
.filter-result { font-size:12px; color:var(--text-faint); }
.filter-btn { padding:5px 14px; border-radius:999px; border:1px solid var(--border); background:#fff; color:var(--text-muted); font-size:12.5px; font-weight:600; transition:.15s; box-shadow:0 1px 2px rgba(2,6,23,.04); }
.filter-btn:hover { border-color:var(--border-strong); color:var(--text-body); }
.filter-btn.active { background:var(--primary-soft); border-color:var(--primary-line); color:var(--primary); }
.filter-btn .fc { font-weight:500; opacity:.75; margin-left:2px; }

/* Dropdown */
.dd { position:relative; display:inline-block; }
.dd-btn { display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:var(--radius); border:1px solid var(--border); background:linear-gradient(180deg,#fff,#fafbfc); box-shadow:0 1px 2px rgba(2,6,23,.05); font-size:12.5px; font-weight:600; color:var(--text-body); transition:.15s; }
.dd-btn:hover { border-color:var(--border-strong); }
.dd-btn .dd-pre { color:var(--text-faint); font-weight:500; }
.dd-btn b { color:var(--text); font-weight:600; }
.dd-btn .chev { width:7px; height:7px; border-right:1.5px solid var(--text-faint); border-bottom:1.5px solid var(--text-faint); transform:rotate(45deg) translateY(-2px); transition:.15s; margin-left:2px; }
.dd.open .dd-btn { border-color:var(--focus); box-shadow:0 0 0 3px rgba(129,140,248,.22); }
.dd.open .chev { transform:rotate(225deg) translateY(-2px); }
.dd-menu { display:none; position:absolute; top:calc(100% + 6px); left:0; min-width:190px; background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 12px 28px -8px rgba(2,6,23,.18), 0 2px 8px rgba(2,6,23,.06); padding:5px; z-index:30; }
.dd.open .dd-menu { display:block; }
.dd-item { display:flex; align-items:center; gap:8px; width:100%; text-align:left; padding:7px 10px; border:none; background:none; border-radius:6px; font-size:12.5px; font-weight:500; color:var(--text-body); transition:.1s; }
.dd-item:hover { background:var(--primary-soft); color:var(--primary); }
.dd-item.active { color:var(--primary); font-weight:600; }
.dd-item .dd-count { margin-left:auto; font-size:11px; color:var(--text-faint); }
.dd-item .chk { visibility:hidden; font-size:11px; color:var(--primary); }
.dd-item .dd-count + .chk { margin-left:6px; }
.dd-item:not(:has(.dd-count)) .chk { margin-left:auto; }
.dd-item.active .chk { visibility:visible; }
.dd.demo-open .dd-menu { display:block; position:static; margin-top:8px; }

/* List */
.list { background:#fff; border:1px solid var(--border); border-radius:var(--radius); box-shadow:0 1px 2px rgba(2,6,23,.04); overflow:hidden; }
.list-item { display:flex; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:.15s; background:#fff; }
.list-item:last-of-type { border-bottom:none; }
.list-item:hover { background:#fafaff; }
.list-item .li-icon { width:32px; height:32px; border-radius:6px; background:var(--primary-soft); color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.list-item .li-title { font-weight:600; color:var(--text); font-size:13.5px; }
.list-item .li-desc { font-size:12px; color:var(--text-muted); }
.list-item .li-chev { margin-left:auto; color:var(--text-faint); font-size:16px; }
.list-empty { padding:28px; text-align:center; color:var(--text-faint); font-size:13px; }
.work-item { display:grid; grid-template-columns:32px minmax(280px,1fr) minmax(150px,210px) 76px; align-items:start; column-gap:14px; }
.work-item.attn { box-shadow:inset 3px 0 0 var(--warning); }
.work-item.attn-fix { box-shadow:inset 3px 0 0 var(--danger); }
.wr-projtag { display:inline-block; margin-left:8px; padding:1px 8px; border-radius:999px; background:#f1f5f9; border:1px solid var(--border); color:var(--text-muted); font-size:10.5px; font-weight:600; vertical-align:2px; }
.wr-picon { width:32px; height:32px; border-radius:var(--radius); background:#f8fafc; border:1px solid var(--border); display:flex; align-items:center; justify-content:center; font-size:16px; flex-shrink:0; margin-top:1px; }

/* Agent avatar */
.agent-avatar { width:32px; height:32px; border-radius:var(--radius); object-fit:cover; box-shadow:0 0 0 1px var(--border); flex-shrink:0; background:#fff; }
.agent-avatar.lg { width:56px; height:56px; border-radius:10px; }
.agent-avatar.hd { width:40px; height:40px; }
.mini-av { width:20px; height:20px; border-radius:6px; object-fit:cover; box-shadow:0 0 0 1px var(--border); vertical-align:-5px; margin:0 4px 0 2px; background:#fff; }
.mini-av-emoji { display:inline-flex; width:20px; height:20px; border-radius:6px; background:#f8fafc; border:1px solid var(--border); align-items:center; justify-content:center; font-size:11px; vertical-align:-5px; margin:0 4px 0 2px; }

/* Icon picker */
.icon-pick { display:flex; gap:6px; flex-wrap:wrap; }
.icon-opt { width:38px; height:38px; border-radius:var(--radius); border:1px solid var(--border); background:#fff; display:flex; align-items:center; justify-content:center; font-size:18px; cursor:pointer; transition:.15s; box-shadow:0 1px 2px rgba(2,6,23,.04); }
.icon-opt:hover { border-color:var(--border-strong); }
.icon-opt.sel { border-color:var(--primary); background:var(--primary-soft); box-shadow:0 0 0 2px rgba(129,140,248,.25); }
.group-head { display:flex; align-items:center; gap:8px; margin:22px 0 8px; }
.group-head h3 { font-size:13px; font-weight:700; letter-spacing:.02em; }
.group-head .count { font-size:11.5px; color:var(--text-muted); background:#f1f5f9; padding:1px 8px; border-radius:999px; }
.work-row { display:flex; align-items:flex-start; gap:14px; padding:13px 16px; border:1px solid var(--border); border-radius:var(--radius); background:#fff; margin-bottom:8px; transition:all .15s cubic-bezier(.4,0,.2,1); cursor:pointer; box-shadow:0 1px 2px rgba(2,6,23,.04); }
.work-row:hover { border-color:var(--primary-line); background:#fafaff; transform:translateY(-1px); box-shadow:0 4px 12px -4px rgba(2,6,23,.1); }
.work-row.attn { border-left:3px solid var(--warning); }
.work-row.attn-fix { border-left:3px solid var(--danger); }
.wr-body { flex:1; min-width:0; }
.wr-title { font-weight:600; color:var(--text); font-size:14px; }
.wr-sum { font-size:12.5px; color:var(--text-muted); margin-top:2px; overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:2; line-height:1.55; }
.wr-state { min-width:0; display:flex; flex-direction:column; align-items:flex-start; gap:7px; padding-top:1px; }
.wr-state-badges { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.wr-next { font-size:11.5px; color:var(--text-faint); line-height:1.45; overflow-wrap:anywhere; }
.wr-actions { display:flex; flex-direction:column; align-items:stretch; gap:7px; padding-left:14px; border-left:1px solid var(--border); }
.wr-actions .btn { width:100%; }
@media (max-width: 980px) {
  .work-item { grid-template-columns:32px minmax(0,1fr) 76px; row-gap:9px; }
  .wr-state { grid-column:2; grid-row:2; }
  .wr-actions { grid-column:3; grid-row:1 / span 2; }
}
.runtime-guidance { font-size:11.5px; color:var(--text-faint); margin-top:4px; line-height:1.5; }
.runtime-guidance.warn { color:var(--warning); }

/* Confirm screen */
.confirm-grid { display:flex; flex-direction:column; gap:12px; }
.confirm-sec { padding:16px; }
.confirm-sec h4 { font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--text-muted); text-transform:uppercase; margin-bottom:8px; }
.kv { display:flex; gap:10px; padding:3px 0; font-size:13.5px; }
.kv .k { width:120px; flex-shrink:0; color:var(--text-muted); }
.kv .v { color:var(--text); }
.policy-opts { display:flex; gap:8px; }
.policy { flex:1; border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; cursor:pointer; transition:.15s; }
.policy:hover { border-color:var(--border-strong); }
.policy.sel { border-color:var(--primary); background:var(--primary-soft); }
.policy .p-name { font-weight:600; color:var(--text); font-size:13px; display:flex; align-items:center; gap:6px; }
.policy .p-desc { font-size:11.5px; color:var(--text-muted); margin-top:3px; }
.policy.sel .p-name::before { content:"●"; color:var(--primary); font-size:9px; }
.policy:not(.sel) .p-name::before { content:"○"; color:var(--text-faint); font-size:9px; }

/* Detail */
.detail-head { display:flex; align-items:flex-start; gap:14px; margin-bottom:16px; }
.detail-head h2 { font-size:18px; flex:1; }
.tabs { display:flex; gap:2px; border-bottom:1px solid var(--border); margin-bottom:18px; }
.tab { padding:8px 16px; border:none; background:none; color:var(--text-muted); font-weight:500; font-size:13.5px; border-bottom:2px solid transparent; margin-bottom:-1px; }
.tab:hover { color:var(--text); background:linear-gradient(180deg,transparent,#f1f5f9); border-radius:var(--radius) var(--radius) 0 0; }
.tab.active { color:var(--primary); border-bottom-color:var(--primary); font-weight:600; }
.tabpane { display:none; }
.tabpane.active { display:block; }
.status-strip { display:flex; align-items:center; gap:16px; padding:13px 16px; margin-bottom:18px; }
.status-strip .ss-main { flex:1; }
.status-strip .ss-now { font-weight:600; color:var(--text); font-size:14px; }
.status-strip .ss-next { font-size:12.5px; color:var(--text-muted); margin-top:1px; }
.status-strip .ss-prog { font-size:12px; color:var(--text-muted); text-align:right; }
.status-strip.strip-warn { background:var(--warning-soft); border-color:var(--warning-line); }
.status-strip.strip-danger { background:var(--danger-soft); border-color:var(--danger-line); }
.status-strip.strip-ok { background:var(--success-soft); border-color:var(--success-line); }
.capability-scope { padding:0; overflow:hidden; }
.capability-run { padding:14px 16px; border-bottom:1px solid var(--border); }
.capability-run:last-of-type { border-bottom:0; }
.capability-run-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.capability-run-head strong { display:block; color:var(--text); font-size:13px; }
.capability-run-head span { display:block; color:var(--text-muted); font-size:12px; margin-top:1px; }
.capability-run-head code, .capability-paths code { font-family:var(--mono); font-size:11px; color:var(--text-muted); overflow-wrap:anywhere; }
.capability-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-top:10px; }
.capability-grid > div > span { display:block; color:var(--text-muted); font-size:10.5px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; }
.capability-tags { display:flex; flex-wrap:wrap; align-items:center; gap:5px; min-height:22px; margin-top:4px; }
.capability-tags em { color:var(--text-faint); font-size:12px; font-style:normal; }
.capability-tag { display:inline-flex; align-items:center; padding:2px 7px; border:1px solid var(--primary-line); border-radius:5px; background:var(--primary-soft); color:var(--primary); font-size:11.5px; font-weight:600; }
.capability-tag-mcp { border-color:var(--border-strong); background:#f8fafc; color:var(--text-body); }
.capability-boundary { margin-top:9px; color:var(--text-muted); font-size:11.5px; }
.capability-boundary span { display:block; margin-top:2px; color:var(--text-faint); }
.capability-paths { margin-top:9px; color:var(--primary); font-size:11.5px; }
.capability-paths summary { cursor:pointer; }
.capability-paths code { display:block; margin-top:4px; padding:4px 6px; border-radius:4px; background:#f8fafc; }
.prohibited-task-gate { padding:14px 16px; border-top:1px solid var(--border); background:var(--warning-soft); }
.prohibited-task-gate.prohibited-task-passed { background:var(--success-soft); }
.prohibited-task-gate.prohibited-task-failed { background:var(--danger-soft); }
.prohibited-task-head { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
.prohibited-task-head strong { display:block; color:var(--text); font-size:13px; }
.prohibited-task-head span { display:block; margin-top:2px; color:var(--text-body); font-size:12px; }
.prohibited-task-head > b { padding:2px 7px; border:1px solid var(--warning-line); border-radius:999px; color:var(--warning); background:#fff; font-size:11px; white-space:nowrap; }
.prohibited-task-passed .prohibited-task-head > b { border-color:var(--success-line); color:var(--success); }
.prohibited-task-failed .prohibited-task-head > b { border-color:var(--danger-line); color:var(--danger); }
.prohibited-task-gate ul { margin:8px 0 0 18px; color:var(--text-body); font-size:12px; }
.prohibited-task-evidence { margin-top:8px; padding-top:7px; border-top:1px solid rgba(100,116,139,.2); }
.prohibited-task-evidence p { margin:3px 0 0; color:var(--text-muted); font-size:11.5px; }
@media (max-width: 680px) { .capability-grid { grid-template-columns:1fr; gap:8px; } }

/* Harness timeline */
.trace { position:relative; padding-left:26px; }
.trace::before { content:""; position:absolute; left:9px; top:8px; bottom:8px; width:2px; background:var(--border); }
.step { position:relative; margin-bottom:12px; }
.step::before { content:""; position:absolute; left:-23px; top:14px; width:10px; height:10px; border-radius:50%; background:#fff; border:2px solid var(--border-strong); }
.step.done::before { background:var(--success); border-color:var(--success); }
.step.now::before  { background:var(--primary); border-color:var(--primary); box-shadow:0 0 0 4px var(--primary-soft); }
.step.wait::before { background:var(--warning); border-color:var(--warning); box-shadow:0 0 0 4px var(--warning-soft); }
.step.fail::before { background:var(--danger); border-color:var(--danger); box-shadow:0 0 0 4px var(--danger-soft); }
.step-card { padding:13px 16px; }
.step.now .step-card { border-color:var(--primary-line); }
.step.wait .step-card { border-color:var(--warning-line); }
.step.fail .step-card { border-color:var(--danger-line); }
.step-top { display:flex; align-items:center; gap:10px; }
.step-top.st-click { cursor:pointer; user-select:none; }
.step-top .st-toggle { color:var(--text-faint); font-size:10px; margin-left:4px; transition:transform .15s; display:inline-block; }
.step.open .st-toggle { transform:rotate(180deg); }
.step-body { display:none; }
.step.open .step-body { display:block; }
.step-top .st-name { font-weight:700; color:var(--text); font-size:13.5px; }
.step-top .st-agent { font-size:12.5px; color:var(--text-muted); }
.step-top .st-agent b { color:var(--text-body); font-weight:600; }
.step-top .st-status-group { margin-left:auto; display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
.step-top .st-state { margin-left:0; }
.step-top .st-score { color:var(--text); font-size:12px; font-weight:800; font-variant-numeric:tabular-nums; white-space:nowrap; }
.step-top .st-score.missing { color:var(--text-faint); font-weight:600; }
.step-top .st-criteria { color:var(--text-muted); font-size:11.5px; font-variant-numeric:tabular-nums; white-space:nowrap; }
.step-resolution { color:var(--success); font-size:11.5px; font-weight:700; white-space:nowrap; }
.step-why { font-size:12px; color:var(--text-muted); margin-top:5px; padding:6px 10px; background:#f8fafc; border-radius:6px; border:1px solid var(--border); }
.step-why b { color:var(--text-body); }
.step-io { margin-top:8px; font-size:12.5px; display:flex; flex-direction:column; gap:3px; }
.step-io .io-row { display:flex; gap:8px; }
.step-io .io-k { width:52px; flex-shrink:0; color:var(--text-faint); font-size:11.5px; font-weight:600; padding-top:1px; }
.step-io .io-v { color:var(--text-body); }
.step-know { display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; align-items:center; }
.step-know .sk-label { font-size:11px; color:var(--text-faint); font-weight:600; }
.step-detail-link { font-size:11.5px; color:var(--text-faint); margin-top:8px; }
.step-detail-link a { color:var(--text-muted); text-decoration:none; border-bottom:1px dotted var(--border-strong); }
.step-detail-link a:hover { color:var(--primary); }
.mini-rubric { margin-top:10px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:#fff; }
.mr-row { display:flex; gap:8px; align-items:baseline; padding:6px 12px; border-bottom:1px solid var(--border); font-size:12.5px; }
.mr-row:last-child { border-bottom:none; }
.mr-row.warn { background:#fffdf5; }
.mr-mark { font-weight:700; width:14px; flex-shrink:0; color:var(--success); }
.mr-row.warn .mr-mark { color:var(--warning); }
.mr-name { font-weight:600; color:var(--text); flex-shrink:0; }
.mr-evi { color:var(--text-muted); flex:1; min-width:0; }
.mr-score { font-weight:600; color:var(--text-muted); flex-shrink:0; font-variant-numeric:tabular-nums; }
.mr-row.warn .mr-score { color:var(--warning); }

/* Question / recovery panels */
.action-panel { border:1px solid var(--warning-line); background:var(--warning-soft); border-radius:var(--radius); padding:16px; margin-top:6px; }
.action-panel h4 { font-size:13.5px; margin-bottom:8px; display:flex; gap:8px; align-items:center; }
.action-panel .q-body { background:#fff; border:1px solid var(--warning-line); border-radius:var(--radius); padding:12px 14px; font-size:13.5px; color:var(--text); margin-bottom:12px; }
.approval-panel { border-color:var(--primary-line); background:var(--primary-soft); }
.approval-panel .q-body { border-color:var(--primary-line); }
.opt { display:flex; gap:10px; align-items:flex-start; padding:10px 12px; background:#fff; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:6px; cursor:pointer; }
.field label.opt { display:flex; font-size:inherit; font-weight:normal; margin-bottom:6px; }
.opt:hover { border-color:var(--focus); }
.opt.sel { border-color:var(--primary); background:var(--primary-soft); }
.opt input { margin-top:4px; accent-color:var(--primary); }
.opt .o-name { font-weight:600; color:var(--text); font-size:13px; }
.opt .o-desc { font-size:12px; color:var(--text-muted); }
.recover-panel { border-color:var(--danger-line); background:var(--danger-soft); }
.recover-panel .q-body { border-color:var(--danger-line); }

/* Rubric */
.rubric-head { display:flex; align-items:center; gap:14px; padding:16px; margin-bottom:12px; }
.score-ring { width:64px; height:64px; border-radius:50%; background:conic-gradient(var(--success) 0 316deg, #e2e8f0 316deg 360deg); display:flex; align-items:center; justify-content:center; flex-shrink:0; }
.score-ring .inner { width:50px; height:50px; border-radius:50%; background:#fff; display:flex; flex-direction:column; align-items:center; justify-content:center; }
.score-ring .num { font-size:17px; font-weight:700; color:var(--text); line-height:1.1; }
.score-ring .of { font-size:9px; color:var(--text-faint); }
.rubric-item { display:flex; gap:12px; padding:11px 16px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:6px; background:#fff; }
.rubric-item .ri-mark { width:22px; height:22px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; margin-top:1px; }
.rubric-item.pass .ri-mark { background:var(--success-soft); color:var(--success); border:1px solid var(--success-line); }
.rubric-item.warn .ri-mark { background:var(--warning-soft); color:var(--warning); border:1px solid var(--warning-line); }
.rubric-item.warn { border-color:var(--warning-line); background:#fffdf5; }
.rubric-item .ri-name { font-weight:600; color:var(--text); font-size:13.5px; }
.rubric-item .ri-evi { font-size:12.5px; color:var(--text-muted); margin-top:2px; }
.rubric-item .ri-evi a { color:var(--primary); text-decoration:none; }
.rubric-item .ri-score { margin-left:auto; font-size:12px; color:var(--text-faint); font-weight:600; flex-shrink:0; }

/* Result */
.answer-box { padding:16px; border-left:3px solid var(--primary); }
.answer-box .ab-label { font-size:11px; font-weight:700; letter-spacing:.08em; color:var(--primary); text-transform:uppercase; margin-bottom:5px; }
.answer-box p { color:var(--text); font-size:14px; }
.result-overview { display:flex; align-items:flex-start; gap:18px; padding:16px; margin-bottom:10px; border-left:3px solid var(--primary); }
.result-overview.needs-decision { background:var(--primary-soft); border-color:var(--primary-line); border-left-color:var(--primary); }
.result-overview.is-done { background:var(--success-soft); border-color:var(--success-line); border-left-color:var(--success); }
.result-overview .ro-main { flex:1; min-width:0; }
.result-overview .ro-kicker { font-size:11px; font-weight:700; color:var(--text-muted); letter-spacing:.08em; text-transform:uppercase; margin-bottom:4px; }
.result-overview h3 { font-size:18px; margin-bottom:5px; color:var(--text); }
.result-overview p { font-size:14px; color:var(--text-body); line-height:1.7; margin-bottom:10px; }
.result-overview .ro-dialogue { border:1px solid var(--border); border-radius:var(--radius); background:#fff; overflow:hidden; margin:10px 0; }
.result-overview .ro-line { display:grid; grid-template-columns:132px 1fr; gap:12px; padding:10px 12px; border-bottom:1px solid var(--border); }
.result-overview .ro-line:last-child { border-bottom:none; }
.result-overview .ro-line span { font-size:11.5px; font-weight:800; color:var(--text-faint); padding-top:2px; }
.result-overview .ro-line p { margin:0; color:var(--text-body); }
.result-overview .ro-line.answer { background:#fbfdff; }
.result-overview .ro-line.answer p { color:var(--text); font-weight:500; }
.result-overview .ro-artifacts { display:grid; grid-template-columns:132px minmax(0,1fr); gap:12px; align-items:start; padding:2px 12px 10px; }
.result-overview .ro-artifacts-label { font-size:11.5px; font-weight:800; color:var(--text-faint); padding-top:2px; }
.result-overview .ro-artifact-links { display:flex; flex-wrap:wrap; gap:5px 14px; min-width:0; }
.result-overview .ro-artifacts-empty { font-size:12.5px; color:var(--text-muted); }
.result-artifact-link { appearance:none; border:0; background:transparent; padding:0; color:var(--primary); font:600 12.5px/1.5 var(--font); text-align:left; text-decoration:underline; text-underline-offset:3px; cursor:pointer; overflow-wrap:anywhere; }
.result-artifact-link:hover { color:#3730a3; text-decoration-thickness:2px; }
.result-artifact-link:focus-visible { outline:2px solid var(--primary); outline-offset:3px; }
.result-artifact-link.artifact-more-link { color:var(--text-muted); font-weight:600; }
.result-overview .ro-facts { display:flex; flex-wrap:wrap; gap:8px; }
.result-overview .ro-facts span { display:inline-flex; gap:6px; align-items:center; padding:4px 8px; border:1px solid var(--border); border-radius:999px; background:#fff; font-size:12px; color:var(--text-muted); max-width:100%; }
.result-overview .ro-facts b { color:var(--text-body); font-weight:700; }
.result-overview .ro-actions { display:flex; flex-direction:column; gap:8px; min-width:190px; }
.result-overview .ro-note { margin:10px 0 0; font-size:12.5px; color:var(--text-muted); }
.result-concerns { margin-bottom:8px; }
.review-summary { padding:16px; }
.review-summary-head { display:grid; grid-template-columns:150px minmax(0,1fr) auto; gap:18px; align-items:start; }
.review-total { padding-right:16px; border-right:1px solid var(--border); }
.review-total > span { display:block; margin-bottom:3px; color:var(--text-muted); font-size:11.5px; font-weight:700; }
.review-total strong { display:flex; align-items:baseline; gap:5px; color:var(--text); font-size:24px; line-height:1.2; font-variant-numeric:tabular-nums; }
.review-total small { color:var(--text-muted); font-size:12px; font-weight:600; }
.review-summary-copy p { margin:0 0 5px; color:var(--text-body); font-size:13.5px; line-height:1.55; }
.review-summary-copy div { color:var(--text-muted); font-size:12px; }
.review-summary-actions { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
@media (max-width: 980px) {
  .review-summary-head { grid-template-columns:120px minmax(0,1fr); }
  .review-summary-actions { grid-column:1 / -1; justify-content:flex-start; }
}
.advance-progress { width:min(420px,100%); padding:12px 14px; border-color:var(--primary-line); background:var(--primary-soft); text-align:left; }
.empty-subtle { padding:14px 16px; color:var(--text-muted); font-size:13px; }

/* Modals */
.overlay { display:none; position:fixed; inset:0; background:rgba(2,6,23,.4); backdrop-filter:blur(2px); z-index:50; align-items:center; justify-content:center; }
.overlay.open { display:flex; }
.modal { background:#fff; border:1px solid var(--border); border-radius:12px; width:480px; max-width:92vw; max-height:86vh; overflow-y:auto; box-shadow:0 24px 48px -12px rgba(2,6,23,.25), 0 4px 12px rgba(2,6,23,.08); }
.modal-head { padding:18px 22px 0; }
.modal-head .m-step { font-size:11px; font-weight:700; letter-spacing:.1em; color:#4f46e5; text-transform:uppercase; margin-bottom:4px; }
.modal-head h3 { font-size:16px; }
.modal-head .m-sub { font-size:12.5px; color:var(--text-muted); margin-top:3px; }
.modal-body { padding:16px 22px; }
.modal-foot { display:flex; justify-content:flex-end; gap:8px; padding:0 22px 20px; }
.modal-foot .left { margin-right:auto; }
.artifact-link-list { border-top:1px solid var(--border); }
.artifact-list-link { display:grid; width:100%; gap:3px; padding:11px 2px; border:0; border-bottom:1px solid var(--border); background:transparent; color:var(--primary); text-align:left; cursor:pointer; }
.artifact-list-link span { font-size:13.5px; font-weight:700; text-decoration:underline; text-underline-offset:3px; overflow-wrap:anywhere; }
.artifact-list-link small { color:var(--text-muted); font:11.5px/1.45 var(--mono); overflow-wrap:anywhere; }
.artifact-list-link:hover { background:#f8fafc; }
.artifact-list-link:focus-visible { outline:2px solid var(--primary); outline-offset:2px; }
.rt-opt { display:flex; align-items:center; gap:12px; padding:12px 14px; border:1px solid var(--border); border-radius:var(--radius); margin-bottom:8px; cursor:pointer; }
.rt-opt:hover { border-color:var(--border-strong); }
.rt-opt.sel { border-color:var(--primary); background:var(--primary-soft); }
.rt-opt .rt-icon { width:34px; height:34px; border-radius:var(--radius); background:#f1f5f9; display:flex; align-items:center; justify-content:center; font-size:15px; }
.rt-opt .rt-name { font-weight:600; color:var(--text); font-size:13.5px; }
.rt-opt .rt-desc { font-size:11.5px; color:var(--text-muted); }
.rt-opt .rt-state { margin-left:auto; }
.conn-result { text-align:center; padding:18px 0 6px; }
.conn-result .c-icon { width:52px; height:52px; margin:0 auto 12px; border-radius:50%; background:var(--success-soft); border:1px solid var(--success-line); color:var(--success); display:flex; align-items:center; justify-content:center; font-size:22px; }
.conn-result h4 { font-size:15px; margin-bottom:4px; }
.conn-result p { font-size:12.5px; color:var(--text-muted); }
.conn-check { display:flex; align-items:center; gap:10px; padding:8px 12px; font-size:13px; color:var(--text-body); }
.conn-check .ok { color:var(--success); font-weight:700; }
.conn-check .bad { color:var(--danger); font-weight:700; }

/* Insights (分析・改善) */
.kpi-row { display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:14px; }
.stat-tile { padding:14px 16px; }
.stat-tile .st-label { font-size:11.5px; font-weight:600; color:var(--text-muted); }
.stat-tile .st-value { font-size:24px; font-weight:700; color:var(--text); line-height:1.3; margin-top:2px; }
.stat-tile .st-value .unit { font-size:13px; font-weight:600; color:var(--text-muted); margin-left:2px; }
.stat-tile .st-delta { font-size:11.5px; font-weight:600; margin-top:2px; }
.st-delta.up { color:var(--success); }
.st-delta.down { color:var(--danger); }
.st-delta .vs { color:var(--text-faint); font-weight:500; }
.chart-grid { display:grid; grid-template-columns:3fr 2fr; gap:10px; margin-bottom:14px; }
.chart-card { padding:14px 16px; }
.chart-card h4 { font-size:12px; font-weight:700; letter-spacing:.06em; color:var(--text-muted); text-transform:uppercase; margin-bottom:10px; }
.bar-row { display:flex; align-items:center; gap:10px; margin-bottom:10px; }
.bar-row .b-label { width:150px; flex-shrink:0; font-size:12px; color:var(--text-body); text-align:right; }
.bar-row .b-track { flex:1; height:14px; background:#f1f5f9; border-radius:4px; overflow:hidden; }
.bar-row .b-fill { height:100%; background:#4f46e5; border-radius:0 4px 4px 0; }
.bar-row .b-val { width:34px; font-size:12px; font-weight:600; color:var(--text); }
.itable { width:100%; border-collapse:collapse; font-size:13px; }
.itable th { text-align:left; font-size:11px; font-weight:700; letter-spacing:.05em; color:var(--text-faint); text-transform:uppercase; padding:6px 12px; border-bottom:1px solid var(--border); }
.itable td { padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text-body); }
.itable tr:last-child td { border-bottom:none; }
.itable td.num, .itable th.num { text-align:right; font-variant-numeric:tabular-nums; }
.itable td b { color:var(--text); }
.diagnosis-list { display:flex; flex-direction:column; gap:12px; margin-bottom:16px; }
.diagnosis-case { padding:16px; }
.diagnosis-head { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
.diagnosis-title { font-size:15px; font-weight:800; color:var(--text); }
.diagnosis-scope { font-size:12px; color:var(--text-muted); margin-top:4px; line-height:1.5; }
.diagnosis-observation, .diagnosis-evidence, .diagnosis-plan { display:grid; grid-template-columns:74px 1fr; gap:10px; font-size:12.5px; line-height:1.6; padding:9px 0; border-top:1px solid var(--border); }
.diagnosis-observation b, .diagnosis-evidence b, .diagnosis-plan b { color:var(--text-body); }
.diagnosis-subhead { font-size:12.5px; font-weight:800; color:var(--text-body); padding-top:12px; border-top:1px solid var(--border); }
.diagnosis-subhead span { font-weight:500; color:var(--text-muted); margin-left:6px; }
.hypothesis-list { margin-top:6px; }
.hypothesis-row { display:flex; gap:10px; padding:10px 0; border-top:1px solid var(--border); }
.hypothesis-row:first-child { border-top:0; }
.hypothesis-index { width:22px; height:22px; display:flex; align-items:center; justify-content:center; flex:0 0 auto; border:1px solid var(--border); border-radius:50%; color:var(--text-muted); font-size:11px; font-weight:800; }
.evidence-stage { flex:0 0 76px; padding-top:1px; color:var(--text-muted); font-size:11.5px; font-weight:800; line-height:1.5; white-space:nowrap; }
.hypothesis-target { font-size:12.5px; font-weight:800; color:var(--text-body); }
.hypothesis-summary { font-size:12.5px; color:var(--text-body); line-height:1.55; margin-top:3px; }
.hypothesis-uncertainty { font-size:11.5px; color:var(--text-muted); line-height:1.5; margin-top:3px; }
.diagnosis-plan { margin-top:4px; padding:10px 12px; border:1px solid var(--primary-line); border-radius:var(--radius); background:var(--primary-soft); }
.insights-supporting-data { margin:0 0 16px; overflow:hidden; }
.insights-supporting-data > summary { cursor:pointer; padding:12px 14px; font-size:12.5px; font-weight:700; color:var(--text-body); }
.supporting-section { padding:0 14px 14px; overflow-x:auto; }
.supporting-section h4 { font-size:12.5px; margin:8px 0; }
.text-link { border:0; background:transparent; color:var(--primary); font:inherit; padding:0; text-decoration:underline; text-underline-offset:2px; cursor:pointer; }
.text-link:hover { color:var(--primary-hover); }
.insights-page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:20px; }
.insights-run-actions { display:flex; align-items:center; justify-content:flex-end; gap:10px; min-height:38px; }
.insights-run-actions > span { color:var(--text-faint); font-size:11.5px; white-space:nowrap; }
.insight-filter-bar { display:flex; align-items:flex-end; gap:10px; margin:0 0 10px; }
.insight-filter-bar label { display:grid; grid-template-columns:auto minmax(150px,220px); align-items:center; gap:7px; color:var(--text-muted); font-size:12px; }
.insight-filter-bar select { height:34px; padding:5px 30px 5px 10px; font-size:12.5px; }
.insight-filter-bar .filter-result { margin-left:auto; padding-bottom:7px; }
.signal-overview-list, .agent-analysis-list { margin-bottom:18px; overflow:hidden; border:1px solid var(--border); border-radius:var(--radius); background:#fff; }
.signal-overview-row { display:flex; align-items:center; gap:18px; padding:13px 16px; border-bottom:1px solid var(--border); }
.signal-overview-row:last-child { border-bottom:0; }
.signal-overview-row:hover { background:#fafaff; }
.signal-overview-main { min-width:0; flex:1; }
.signal-cause { display:flex; align-items:baseline; gap:7px; margin-top:5px; color:var(--text-body); font-size:12px; line-height:1.5; }
.signal-cause b { flex:0 0 auto; color:var(--text); }
.signal-cause span { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.signal-overview-action { flex:0 0 auto; display:flex; align-items:center; gap:12px; }
.signal-overview-action > span { color:var(--text-faint); font-size:11.5px; white-space:nowrap; }
.agent-analysis-row { display:grid; grid-template-columns:minmax(150px,1fr) 110px minmax(150px,1fr) minmax(240px,1.4fr) auto; align-items:center; gap:14px; padding:12px 16px; border-bottom:1px solid var(--border); }
.agent-analysis-row:last-child { border-bottom:0; }
.agent-analysis-row:hover { background:#fafaff; }
.agent-analysis-name, .agent-analysis-state, .agent-analysis-findings, .agent-analysis-change { min-width:0; display:flex; flex-direction:column; gap:2px; }
.agent-analysis-row b { color:var(--text); font-size:12.5px; }
.agent-analysis-row span { color:var(--text-muted); font-size:11.5px; line-height:1.45; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.insight-detail-modal { width:min(1040px,calc(100vw - 56px)); max-height:90vh; }
.insight-detail-scope { margin-bottom:10px; color:var(--text-muted); font-size:12.5px; }
.agent-analysis-summary { display:grid; grid-template-columns:150px 130px minmax(0,1fr); border:1px solid var(--border); border-radius:var(--radius); margin-bottom:18px; }
.agent-analysis-summary > div { display:flex; flex-direction:column; gap:3px; padding:12px 14px; border-right:1px solid var(--border); }
.agent-analysis-summary > div:last-child { border-right:0; }
.agent-analysis-summary span { color:var(--text-faint); font-size:11px; }
.agent-analysis-summary b { color:var(--text); font-size:13px; }
@media (max-width:1100px) {
  .agent-analysis-row { grid-template-columns:minmax(150px,1fr) 120px auto; }
  .agent-analysis-findings { grid-column:1; grid-row:2; }
  .agent-analysis-change { grid-column:2 / 4; grid-row:2; }
  .agent-analysis-row > .btn { grid-column:3; grid-row:1; }
}
@media (max-width:720px) {
  .insights-page-head { flex-direction:column; }
  .insights-run-actions { width:100%; justify-content:space-between; }
  .insight-filter-bar { align-items:stretch; flex-direction:column; }
  .insight-filter-bar label { grid-template-columns:90px minmax(0,1fr); }
  .insight-filter-bar .filter-result { margin-left:0; padding-bottom:0; }
  .signal-overview-row { align-items:flex-start; flex-direction:column; }
  .signal-overview-action { width:100%; justify-content:space-between; }
  .agent-analysis-row { grid-template-columns:1fr; }
  .agent-analysis-findings, .agent-analysis-change, .agent-analysis-row > .btn { grid-column:auto; grid-row:auto; }
  .agent-analysis-summary { grid-template-columns:1fr; }
  .agent-analysis-summary > div { border-right:0; border-bottom:1px solid var(--border); }
  .agent-analysis-summary > div:last-child { border-bottom:0; }
  .diagnosis-head { flex-direction:column; }
  .diagnosis-observation, .diagnosis-evidence, .diagnosis-plan { grid-template-columns:1fr; gap:2px; }
}

/* Diff */
.diff { font-family:var(--mono); font-size:12px; border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:#fff; }
.diff .dl { padding:4px 12px 4px 30px; position:relative; white-space:pre-wrap; line-height:1.6; color:var(--text-body); }
.diff .dl::before { position:absolute; left:11px; font-weight:700; }
.diff .ctx::before { content:" "; }
.diff .del { background:var(--danger-soft); }
.diff .del::before { content:"−"; color:var(--danger); }
.diff .add { background:var(--success-soft); }
.diff .add::before { content:"+"; color:var(--success); }
.diff .hunk { background:#f8fafc; color:var(--text-faint); font-size:11px; padding:3px 12px; border-top:1px solid var(--border); border-bottom:1px solid var(--border); }
.diff .dl:first-child.hunk { border-top:none; }
.definition-review-modal { width:920px; }
.definition-review-list { display:flex; flex-direction:column; gap:14px; }
.definition-review-section { border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; background:#fff; }
.definition-review-section > label { display:flex; align-items:flex-start; gap:10px; padding:12px 14px; cursor:pointer; border-bottom:1px solid var(--border); }
.definition-review-section > label input { margin-top:2px; }
.definition-review-section .diff { border:0; border-radius:0; max-height:310px; overflow:auto; }
.definition-review-note { margin:0 0 14px; padding:10px 12px; border:1px solid var(--warning-line); border-radius:var(--radius); background:var(--warning-soft); color:var(--text-body); font-size:12.5px; line-height:1.55; }
@media (max-width:720px) {
  .definition-review-modal { width:94vw; max-height:92vh; }
  .definition-review-section .diff { max-height:240px; }
}

/* Catalog */
.cat-sec { margin-bottom:30px; }
.cat-sec > h3 { font-size:14px; font-weight:700; margin-bottom:2px; }
.cat-note { font-size:12px; color:var(--text-muted); margin-bottom:10px; }
.cat-row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; padding:18px; }
.cat-col { display:flex; flex-direction:column; gap:8px; padding:18px; }
.swatch { width:118px; }
.swatch .sq { height:44px; border-radius:var(--radius); border:1px solid rgba(2,6,23,.07); box-shadow:inset 0 1px 0 rgba(255,255,255,.25); }
.swatch .sw-name { font-size:11.5px; font-weight:600; color:var(--text); margin-top:6px; line-height:1.3; }
.swatch .sw-val { font-family:var(--mono); font-size:10.5px; color:var(--text-muted); }
.cat-well { background:#f1f5f9; border-radius:var(--radius); padding:24px; display:flex; justify-content:center; border:1px solid var(--border); }
.cat-well .modal { position:static; }

/* Prototype jump bar */
.proto-bar { display:none; position:fixed; bottom:14px; right:14px; z-index:99; background:#0f172a; color:#cbd5e1; border-radius:10px; padding:8px 10px; font-size:11px; gap:4px; align-items:center; box-shadow:0 8px 24px rgba(2,6,23,.35); flex-wrap:wrap; max-width:520px; }
.proto-bar span { color:#64748b; font-weight:700; letter-spacing:.08em; margin-right:2px; }
.proto-bar button { background:#1e293b; color:#cbd5e1; border:none; border-radius:6px; padding:4px 9px; font-size:11px; }
.proto-bar button:hover { background:#334155; color:#fff; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <img src="logo.png" alt="Nagare">
      <div>
        <span class="name">NAGARE</span>
        <span class="org">Hachiware Labs</span>
      </div>
    </div>
    <nav class="nav" aria-label="メインナビゲーション">
      <div class="nav-label">主要フロー</div>
      <a href="#" class="active" id="nav-work">ワーク <span class="dot" id="attn-dot"></span></a>
      <a href="#" id="nav-project">プロジェクト</a>
      <a href="#" id="nav-runtime">実行環境</a>
      <a href="#" id="nav-agent">エージェント</a>
      <a href="#" id="nav-knowledge">ナレッジ</a>
      <a href="#" id="nav-insights">分析・改善 <span class="dot" id="insights-dot" style="background:var(--primary);display:none;"></span></a>
      <details class="nav-more">
        <summary>追加機能</summary>
        <a href="#" id="nav-skills">スキル</a>
        <a href="#" id="nav-mcp">MCP接続</a>
      </details>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="crumb" id="crumb"><b>ワーク</b></div>
      <div class="spacer"></div>
    </div>
    <main class="content">
      <div class="content-inner">
        <section class="screen active" id="scr-home-empty">
          <div class="hero-empty">
            <img src="logo.png" alt="">
            <h2>Nagare デスクトップを起動してください</h2>
            <p>この画面は Tauri デスクトップアプリから状態を読み込んで表示します。通常は <span class="mono">nagare ui serve --browser</span> または開発用の起動コマンドから開いてください。</p>
          </div>
        </section>
        <section class="screen" id="scr-home-active"></section>
        <section class="screen" id="scr-detail-running"></section>
        <section class="screen" id="scr-detail-question"></section>
        <section class="screen" id="scr-detail-recover"></section>
        <section class="screen" id="scr-detail-review"></section>
        <section class="screen" id="scr-detail-done"></section>
        <section class="screen" id="scr-project-list"></section>
        <section class="screen" id="scr-project-settings"></section>
        <section class="screen" id="scr-agent-list"></section>
        <section class="screen" id="scr-agent-settings"></section>
        <section class="screen" id="scr-knowledge-list"></section>
        <section class="screen" id="scr-knowledge-domain"></section>
        <section class="screen" id="scr-knowledge-rubric"></section>
        <section class="screen" id="scr-settings-skills"></section>
        <section class="screen" id="scr-settings-mcp"></section>
        <section class="screen" id="scr-settings-runtime"></section>
        <section class="screen" id="scr-insights"></section>
        <section class="screen" id="scr-catalog"></section>
      </div>
    </main>
  </div>
</div>

<script>
const crumbs = {
  "home-empty": "<b>ワーク</b>",
  "home-active": "<b>ワーク</b>",
  "confirm": "ワーク / <b>開始確認</b>",
  "detail-running": "ワーク / <b>実行中</b>",
  "detail-question": "ワーク / <b>質問</b>",
  "detail-recover": "ワーク / <b>回復</b>",
  "detail-review": "ワーク / <b>確認</b>",
  "detail-done": "ワーク / <b>完了</b>",
  "project-list": "<b>プロジェクト</b>",
  "project-settings": "プロジェクト / <b>設定</b>",
  "knowledge-list": "<b>ナレッジ</b>",
  "knowledge-domain": "ナレッジ / <b>ドメイン</b>",
  "knowledge-rubric": "ナレッジ / <b>成果物</b>",
  "agent-list": "<b>エージェント</b>",
  "agent-settings": "エージェント / <b>設定</b>",
  "settings-skills": "エージェント / <b>スキル</b>",
  "settings-mcp": "エージェント / <b>MCP接続</b>",
  "settings-runtime": "エージェント / <b>実行環境</b>",
  "insights": "<b>分析・改善</b>",
  "catalog": "デザイン / <b>カタログ</b>",
};
const navMap = {
  "project-list": "nav-project",
  "project-settings": "nav-project",
  "knowledge-list": "nav-knowledge",
  "knowledge-domain": "nav-knowledge",
  "knowledge-rubric": "nav-knowledge",
  "agent-list": "nav-agent",
  "agent-settings": "nav-agent",
  "settings-skills": "nav-skills",
  "settings-mcp": "nav-mcp",
  "settings-runtime": "nav-runtime",
  "insights": "nav-insights",
  "catalog": "nav-catalog",
};
function go(id) {
  document.querySelectorAll(".screen").forEach((screen) => screen.classList.remove("active"));
  const screen = document.getElementById("scr-" + id);
  if (screen) screen.classList.add("active");
  const crumb = document.getElementById("crumb");
  if (crumb) crumb.innerHTML = crumbs[id] || "<b>ワーク</b>";
  document.querySelectorAll(".nav a").forEach((item) => item.classList.remove("active"));
  document.getElementById(navMap[id] || "nav-work")?.classList.add("active");
  const attnDot = document.getElementById("attn-dot");
  if (attnDot) attnDot.style.display = id === "home-empty" ? "none" : "";
  const content = document.querySelector(".content");
  if (content) {
    content.scrollTop = 0;
    content.scrollLeft = 0;
  }
}
</script>
<script src="./app.js"></script>
</body>
</html>
