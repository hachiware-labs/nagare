<svg xmlns="http://www.w3.org/2000/svg" width="3200" height="1800" viewBox="0 0 3200 1800" role="img" aria-labelledby="title desc">
  <title id="title">Nagare full page screen flow wireframe</title>
  <desc id="desc">A monochrome wireframe of Nagare full-page work screens with a left navigation pane: empty state, request list, running status, and artifact review.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .bg { fill: #f7f7f4; }
      .screen { fill: #fff; stroke: #222; stroke-width: 2.4; rx: 8; }
      .sidebar { fill: #f1f1ec; stroke: #222; stroke-width: 1.6; rx: 8; }
      .topbar { fill: #fbfbf8; stroke: #c8c8c0; stroke-width: 1.5; rx: 8; }
      .panel { fill: #fbfbf8; stroke: #c8c8c0; stroke-width: 1.5; rx: 8; }
      .panelStrong { fill: #f1f1ec; stroke: #222; stroke-width: 1.8; rx: 8; }
      .navActive { fill: #222; rx: 8; }
      .line { stroke: #222; stroke-width: 2.4; fill: none; }
      .softLine { stroke: #b7b7af; stroke-width: 1.5; fill: none; }
      .dash { stroke: #777; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
      .title { font: 700 40px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #151515; letter-spacing: 0; }
      .subtitle { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; letter-spacing: 0; }
      .contract { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; letter-spacing: .2px; }
      .contractBody { font: 400 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; letter-spacing: 0; }
      .brand { font: 800 23px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; letter-spacing: 0; }
      .h { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; letter-spacing: 0; }
      .body { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; letter-spacing: 0; }
      .small { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; letter-spacing: 0; }
      .label { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; letter-spacing: 0; }
      .nav { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; letter-spacing: 0; }
      .navTextActive { font: 700 17px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonText { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="3200" height="1800"/>
  <text class="title" x="80" y="74">Nagare full-page flow wireframe</text>
  <text class="subtitle" x="80" y="108">ワークはタイトルバーではなく、アプリ左ペインの選択タブとして扱う。右側は現在の作業面に集中する</text>

  <g id="contracts">
    <g transform="translate(80 148)">
      <text class="contract" x="0" y="0">SCREEN 01: 空状態</text>
      <text class="contractBody" x="0" y="30">問い: 何も登録されていない状態で、次に進めるか</text>
      <text class="contractBody" x="0" y="58">次: 初期設定モーダルを開く</text>
    </g>
    <g transform="translate(1660 148)">
      <text class="contract" x="0" y="0">SCREEN 02: ワーク一覧</text>
      <text class="contractBody" x="0" y="30">問い: 新しいワークを始め、過去/進行中の結果を見つけられるか</text>
      <text class="contractBody" x="0" y="58">次: ワーク開始で実行詳細へ</text>
    </g>
    <g transform="translate(80 970)">
      <text class="contract" x="0" y="0">SCREEN 03: 実行詳細 / 実行状況タブ</text>
      <text class="contractBody" x="0" y="30">問い: 詳細を開いた時に、今どこで誰が何をしているか</text>
      <text class="contractBody" x="0" y="58">次: 完了時に同じ詳細内の成果物タブへ</text>
    </g>
    <g transform="translate(1660 970)">
      <text class="contract" x="0" y="0">SCREEN 04: 実行詳細 / 結果タブ</text>
      <text class="contractBody" x="0" y="30">問い: 同じ詳細画面で、回答とできたものを採用できるか</text>
      <text class="contractBody" x="0" y="58">次: 採用で一覧へ、差し戻しで実行状況タブへ戻る</text>
    </g>
  </g>

  <path class="line" marker-end="url(#arrow)" d="M 1500 512 C 1554 512 1586 512 1640 512"/>
  <text class="small" x="1504" y="480">初期設定完了</text>
  <path class="line" marker-end="url(#arrow)" d="M 2360 892 C 2360 928 2360 948 2360 984"/>
  <text class="small" x="2384" y="936">ワーク開始 / 詳細</text>
  <path class="line" marker-end="url(#arrow)" d="M 1500 1328 C 1554 1328 1586 1328 1640 1328"/>
  <text class="small" x="1504" y="1296">結果タブへ</text>

  <!-- Reusable app shell instances are drawn explicitly for editability. -->

  <!-- Full-page screen 01 -->
  <g id="screen-empty-work" transform="translate(80 240)">
    <rect class="screen" width="1420" height="650"/>
    <rect class="sidebar" x="28" y="24" width="190" height="602"/>
    <text class="brand" x="52" y="66">Nagare</text>
    <rect class="navActive" x="48" y="104" width="150" height="40"/>
    <text class="navTextActive" x="86" y="130">ワーク</text>
    <text class="nav" x="68" y="184">プロジェクト</text>
    <text class="nav" x="68" y="226">ドメイン</text>
    <text class="nav" x="68" y="268">ランタイム</text>
    <text class="nav" x="68" y="310">エージェント</text>
    <text class="nav" x="68" y="352">スキル</text>
    <text class="nav" x="68" y="394">MCP</text>

    <rect class="topbar" x="246" y="24" width="1146" height="58"/>
    <text class="small" x="270" y="61">プロジェクト未設定</text>
    <text class="small" x="1226" y="61">初回状態</text>

    <rect class="panelStrong" x="410" y="164" width="790" height="272"/>
    <circle cx="805" cy="224" r="30" fill="#222"/>
    <text class="buttonText" x="796" y="232">1</text>
    <text class="h" x="654" y="294">まだワークはありません</text>
    <text class="body" x="496" y="336">最初にプロジェクトとランタイムを設定すると、ワークを開始できます</text>
    <rect x="644" y="374" width="324" height="54" rx="8" fill="#222"/>
    <text class="buttonText" x="721" y="408">セットアップ開始</text>

    <rect class="panel" x="410" y="476" width="790" height="82"/>
    <text class="label" x="438" y="508">初回はここだけ</text>
    <text class="small" x="438" y="536">デフォルトエージェント、スキル、MCPは初期入力にしない。必要になった時に管理画面へ進める。</text>
  </g>

  <!-- Full-page screen 02 -->
  <g id="screen-work-home" transform="translate(1660 240)">
    <rect class="screen" width="1420" height="650"/>
    <rect class="sidebar" x="28" y="24" width="190" height="602"/>
    <text class="brand" x="52" y="66">Nagare</text>
    <rect class="navActive" x="48" y="104" width="150" height="40"/>
    <text class="navTextActive" x="86" y="130">ワーク</text>
    <text class="nav" x="68" y="184">プロジェクト</text>
    <text class="nav" x="68" y="226">ドメイン</text>
    <text class="nav" x="68" y="268">ランタイム</text>
    <text class="nav" x="68" y="310">エージェント</text>
    <text class="nav" x="68" y="352">スキル</text>
    <text class="nav" x="68" y="394">MCP</text>

    <rect class="topbar" x="246" y="24" width="1146" height="58"/>
    <text class="small" x="270" y="61">プロジェクト: Nagare UI</text>
    <rect x="1222" y="32" width="144" height="42" rx="8" fill="#222"/>
    <text class="buttonText" x="1246" y="59">新規ワーク</text>

    <text class="h" x="270" y="126">ワーク</text>
    <rect class="panelStrong" x="270" y="152" width="1098" height="164"/>
    <text class="label" x="302" y="190">ワーク内容</text>
    <rect fill="#fff" stroke="#999" stroke-width="1.5" x="302" y="214" width="806" height="54" rx="8"/>
    <text class="small" x="326" y="248">例: ワーク詳細画面の結論が分かるか確認して修正してください</text>
    <rect x="1130" y="214" width="202" height="54" rx="8" fill="#222"/>
    <text class="buttonText" x="1184" y="248">ワーク開始</text>
    <text class="label" x="302" y="294">確認方法</text>
    <text class="small" x="410" y="294">最後に確認する</text>
    <text class="small" x="570" y="294">重要時のみ確認</text>
    <text class="small" x="732" y="294">自動採用</text>

    <g transform="translate(270 342)">
      <rect class="panel" width="1098" height="48"/>
      <text class="nav" x="24" y="31">要対応</text>
      <text class="small" x="126" y="31">進行中</text>
      <text class="small" x="224" y="31">完了</text>
      <text class="small" x="850" y="31">状態 / プロジェクトで絞り込み</text>
    </g>
    <g transform="translate(270 414)">
      <rect class="panelStrong" width="1098" height="82"/>
      <text class="body" x="24" y="32">ワーク詳細画面の改善</text>
      <text class="small" x="470" y="32">回答待ち</text>
      <text class="small" x="620" y="32">結果: レビュー中。最終回答は未作成</text>
      <text class="small" x="24" y="62">できたもの: 画面フローSVGを更新中。次に結果タブで採否を確認</text>
      <rect class="panel" x="988" y="22" width="82" height="38"/>
      <text class="label" x="1008" y="47">詳細</text>
    </g>
    <g transform="translate(270 510)">
      <rect class="panel" width="1098" height="82"/>
      <text class="body" x="24" y="32">ランタイム設定の接続確認</text>
      <text class="small" x="470" y="32">完了</text>
      <text class="small" x="620" y="32">結果: Codex接続を確認し、ワーク開始可能</text>
      <text class="small" x="24" y="62">できたもの: 接続ログ、選択モデル、失敗時の復帰先を保存</text>
      <rect class="panel" x="988" y="22" width="82" height="38"/>
      <text class="label" x="1008" y="47">詳細</text>
    </g>
  </g>

  <!-- Full-page screen 03 -->
  <g id="screen-running-status" transform="translate(80 1060)">
    <rect class="screen" width="1420" height="650"/>
    <rect class="sidebar" x="28" y="24" width="190" height="602"/>
    <text class="brand" x="52" y="66">Nagare</text>
    <rect class="navActive" x="48" y="104" width="150" height="40"/>
    <text class="navTextActive" x="86" y="130">ワーク</text>
    <text class="nav" x="68" y="184">プロジェクト</text>
    <text class="nav" x="68" y="226">ドメイン</text>
    <text class="nav" x="68" y="268">ランタイム</text>
    <text class="nav" x="68" y="310">エージェント</text>
    <text class="nav" x="68" y="352">スキル</text>
    <text class="nav" x="68" y="394">MCP</text>

    <rect class="topbar" x="246" y="24" width="1146" height="58"/>
    <text class="small" x="270" y="61">ワーク詳細画面の改善</text>
    <text class="small" x="1198" y="61">現在: レビュー中</text>

    <text class="h" x="270" y="126">実行詳細</text>
    <rect class="panel" x="270" y="148" width="1098" height="48"/>
    <text class="nav" x="304" y="178">結果</text>
    <rect x="372" y="156" width="128" height="32" rx="8" fill="#222"/>
    <text class="navTextActive" x="404" y="178">実行状況</text>
    <text class="nav" x="530" y="178">レビュー</text>
    <text class="nav" x="620" y="178">履歴</text>

    <rect class="panelStrong" x="270" y="220" width="1098" height="106"/>
    <text class="label" x="304" y="254">概況</text>
    <text class="body" x="304" y="292">現在: レビュー中。回答とできたものは作成済み、最終確認前です</text>
    <text class="small" x="996" y="254">3 / 4 ステップ</text>
    <text class="small" x="996" y="292">次: 結果タブで確認</text>

    <rect class="panel" x="270" y="350" width="1098" height="74"/>
    <text class="label" x="304" y="382">1 受付 / オーガナイザー</text>
    <text class="small" x="304" y="410">入力: ワーク内容、確認方法、プロジェクト文脈。出力: 実行方針と担当候補。</text>
    <text class="small" x="1116" y="382">完了</text>

    <rect class="panel" x="270" y="444" width="1098" height="74"/>
    <text class="label" x="304" y="476">2 作成 / 作成エージェント</text>
    <text class="small" x="304" y="504">実施: 画面フローSVGを編集。出力: 更新ファイルと変更理由。</text>
    <text class="small" x="1116" y="476">完了</text>

    <rect class="panelStrong" x="270" y="538" width="1098" height="74"/>
    <text class="label" x="304" y="570">3 レビュー / レビューエージェント</text>
    <text class="small" x="304" y="598">実施中: 結果サマリー、成果物、レビュー根拠、確認導線を照合中。</text>
    <text class="small" x="1116" y="570">進行中</text>
  </g>

  <!-- Full-page screen 04 -->
  <g id="screen-artifact-review" transform="translate(1660 1060)">
    <rect class="screen" width="1420" height="650"/>
    <rect class="sidebar" x="28" y="24" width="190" height="602"/>
    <text class="brand" x="52" y="66">Nagare</text>
    <rect class="navActive" x="48" y="104" width="150" height="40"/>
    <text class="navTextActive" x="86" y="130">ワーク</text>
    <text class="nav" x="68" y="184">プロジェクト</text>
    <text class="nav" x="68" y="226">ドメイン</text>
    <text class="nav" x="68" y="268">ランタイム</text>
    <text class="nav" x="68" y="310">エージェント</text>
    <text class="nav" x="68" y="352">スキル</text>
    <text class="nav" x="68" y="394">MCP</text>

    <rect class="topbar" x="246" y="24" width="1146" height="58"/>
    <text class="small" x="270" y="61">ワーク詳細画面の改善</text>
    <text class="small" x="1194" y="61">完了前の確認</text>

    <text class="h" x="270" y="126">実行詳細</text>
    <rect class="panel" x="270" y="148" width="1098" height="48"/>
    <rect x="294" y="156" width="80" height="32" rx="8" fill="#222"/>
    <text class="navTextActive" x="320" y="178">結果</text>
    <text class="nav" x="404" y="178">実行状況</text>
    <text class="nav" x="526" y="178">レビュー</text>
    <text class="nav" x="616" y="178">履歴</text>

    <rect class="panelStrong" x="270" y="220" width="1098" height="162"/>
    <text class="label" x="304" y="258">結果サマリー</text>
    <text class="body" x="304" y="300">回答: 画面全体フローとモーダルフローは分けて扱うべきです</text>
    <text class="small" x="304" y="328">理由: ワーク一覧、実行詳細、結果確認の情報量が異なるため</text>
    <text class="label" x="900" y="258">ユーザー確認: 必要</text>
    <rect x="900" y="276" width="126" height="38" rx="8" fill="#222"/>
    <text class="buttonText" x="922" y="301">確認する</text>
    <text class="small" x="900" y="340">押すと結果確認モーダルを開く</text>

    <rect class="panel" x="270" y="408" width="520" height="154"/>
    <text class="label" x="304" y="446">できたもの</text>
    <text class="small" x="304" y="476">docs/design-assets/svg/nagare-full-page-flow-wireframe.svg</text>
    <text class="small" x="304" y="506">docs/design-assets/png/nagare-full-page-flow-wireframe.png</text>
    <text class="small" x="304" y="536">長い一覧はこの領域を縦スクロールして確認</text>

    <rect class="panel" x="812" y="408" width="556" height="154"/>
    <text class="label" x="846" y="446">レビュー</text>
    <text class="body" x="846" y="476">評価: 88点</text>
    <text class="small" x="846" y="506">根拠: 左ペイン、結果タブ、確認方法が一貫している</text>
    <text class="small" x="846" y="536">懸念: 差し戻し理由が短いと再作業がぶれる。長文はスクロールで読む</text>
  </g>

  <path class="dash" marker-end="url(#arrow)" d="M 2820 1714 C 2820 1760 1840 1760 1840 1714"/>
  <text class="small" x="2248" y="1752">差し戻しは対象ステップへ戻す</text>
</svg>
