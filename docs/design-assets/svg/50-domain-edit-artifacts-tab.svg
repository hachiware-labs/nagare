<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="domain-artifacts-title domain-artifacts-desc">
  <title id="domain-artifacts-title">Nagare Domain Edit Artifact Types Tab</title>
  <desc id="domain-artifacts-desc">Domain edit modal with the Artifact Types tab active. Each artifact type has its own knowledge and large rubric memo areas.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172033" flood-opacity=".18"/>
    </filter>
    <style>
      .bg{fill:#f6f8fb}
      .surface{fill:#fff;stroke:#d8e0ea;stroke-width:1}
      .soft{fill:#f8fbff;stroke:#d8e0ea;stroke-width:1}
      .input{fill:#fff;stroke:#b8c4d3;stroke-width:1}
      .line{stroke:#d8e0ea;stroke-width:1}
      .brand{fill:#2f6f73}
      .brand-soft{fill:#e6f4f1}
      .blue-soft{fill:#eef4ff;stroke:#b9cfff}
      .ai-soft{fill:#eef4ff;stroke:#b9cfff}
      .button{fill:#2f6f73}
      .text{fill:#111827;font-family:Inter,"Segoe UI","Yu Gothic UI",Meiryo,Arial,sans-serif}
      .muted{fill:#566579;font-family:Inter,"Segoe UI","Yu Gothic UI",Meiryo,Arial,sans-serif}
      .title{font-size:25px;font-weight:760}
      .h1{font-size:22px;font-weight:760}
      .h2{font-size:16px;font-weight:740}
      .h3{font-size:13px;font-weight:740}
      .body{font-size:12px;font-weight:560}
      .small{font-size:11px;font-weight:560}
      .tiny{font-size:10px;font-weight:760}
      .nav{font-size:13px;font-weight:680}
      .nav-on{font-size:13px;font-weight:780}
      .tab{font-size:13px;font-weight:760}
    </style>
  </defs>

  <rect class="bg" width="1440" height="1024"/>

  <g id="background-domain-list" opacity=".56">
    <rect x="0" y="0" width="204" height="1024" fill="#fff" stroke="#d8e0ea"/>
    <text x="28" y="43" class="text title">Nagare</text>
    <text x="30" y="66" class="muted small">制御プレーン</text>
    <text x="34" y="118" class="muted nav">ワーク</text>
    <text x="34" y="157" class="muted nav">プロジェクト</text>
    <rect x="18" y="174" width="168" height="34" rx="7" class="brand-soft"/>
    <rect x="18" y="174" width="4" height="34" rx="2" class="brand"/>
    <text x="34" y="196" class="text nav-on" style="fill:#2f6f73">ドメイン</text>
    <text x="232" y="48" class="text title">ドメイン</text>
    <rect x="232" y="96" width="1164" height="828" rx="8" class="surface"/>
    <text x="260" y="136" class="text h1">ドメイン一覧</text>
    <rect x="260" y="310" width="1088" height="78" rx="8" class="brand-soft" stroke="#b9ddd6"/>
    <rect x="260" y="310" width="5" height="78" rx="2" class="brand"/>
    <text x="282" y="338" class="text h2" style="fill:#2f6f73">開発</text>
    <text x="282" y="361" class="muted small">コード、UI、テスト、ドキュメント</text>
  </g>

  <rect x="0" y="0" width="1440" height="1024" fill="#111827" opacity=".22"/>

  <g id="domain-edit-modal-artifacts" filter="url(#shadow)">
    <rect x="180" y="74" width="1080" height="876" rx="8" fill="#fff" stroke="#cbd6e5"/>
    <rect x="180" y="74" width="1080" height="82" rx="8" fill="#fff"/>
    <text x="222" y="116" class="text h1">ドメイン編集: 開発</text>
    <text x="222" y="140" class="muted body">成果物ごとの知識、判断基準、作業の期待値を管理する</text>
    <rect x="1096" y="100" width="44" height="34" rx="7" class="surface"/>
    <path d="M1110 110 L1126 126 M1126 110 L1110 126" stroke="#566579" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="156" x2="1260" y2="156" class="line"/>

    <g id="tabs">
      <rect x="222" y="180" width="152" height="40" rx="7" fill="#fff" stroke="#d8e0ea"/>
      <text x="254" y="205" class="muted tab">基本情報</text>
      <rect x="386" y="180" width="166" height="40" rx="7" class="brand-soft" stroke="#b9ddd6"/>
      <text x="425" y="205" class="tab" style="fill:#2f6f73;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">成果物種別</text>
    </g>

    <g id="artifact-list">
      <rect x="222" y="250" width="286" height="604" rx="8" class="soft"/>
      <text x="248" y="288" class="text h2">成果物種別</text>
      <rect x="374" y="267" width="104" height="34" rx="7" fill="#fff" stroke="#b8c4d3"/>
      <text x="401" y="289" class="muted body">追加</text>

      <rect x="248" y="326" width="230" height="72" rx="7" fill="#fff" stroke="#d8e0ea"/>
      <text x="270" y="355" class="text h3">コード変更</text>
      <text x="270" y="378" class="muted small">実装、修正、差分説明</text>

      <rect x="248" y="414" width="230" height="72" rx="7" fill="#fff" stroke="#d8e0ea"/>
      <text x="270" y="443" class="text h3">レビュー結果</text>
      <text x="270" y="466" class="muted small">評価、指摘、採点</text>

      <rect x="248" y="502" width="230" height="78" rx="7" class="brand-soft" stroke="#b9ddd6"/>
      <rect x="248" y="502" width="5" height="78" rx="2" class="brand"/>
      <text x="270" y="532" class="text h3" style="fill:#2f6f73">テスト結果</text>
      <text x="270" y="556" class="muted small">確認内容、結果、残リスク</text>

      <rect x="248" y="596" width="230" height="72" rx="7" fill="#fff" stroke="#d8e0ea"/>
      <text x="270" y="625" class="text h3">設計メモ</text>
      <text x="270" y="648" class="muted small">構成、判断、代替案</text>
    </g>

    <g id="artifact-editor">
      <text x="542" y="258" class="text h2">テスト結果</text>
      <text x="542" y="282" class="muted body">この成果物種別だけに適用する知識と評価基準を設定する</text>

      <text x="542" y="330" class="text h3">成果物名</text>
      <rect x="542" y="346" width="292" height="42" rx="7" class="input"/>
      <text x="562" y="373" class="text body">テスト結果</text>

      <text x="862" y="330" class="text h3">短い説明</text>
      <rect x="862" y="346" width="328" height="42" rx="7" class="input"/>
      <text x="882" y="373" class="text body">何を確認し、何が残ったか</text>

      <text x="542" y="430" class="text h3">成果物ごとの知識</text>
      <rect x="542" y="450" width="648" height="164" rx="7" class="input"/>
      <text x="566" y="484" class="text body">テスト結果では、実行したコマンド、確認した画面、失敗時の原因、未確認範囲を分けて記録する。</text>
      <text x="566" y="514" class="text body">UI確認では、表示崩れ、主要導線、空状態、処理中状態、エラー状態を優先して見る。</text>
      <text x="566" y="544" class="text body">自動テストがない場合でも、代替の確認方法とその限界を明記する。</text>
      <text x="566" y="574" class="muted body">この知識は、テスト担当エージェントへの作業指示と完了判定に使う。</text>

      <text x="542" y="658" class="text h3">ルーブリック</text>
      <rect x="1024" y="635" width="166" height="34" rx="7" class="ai-soft"/>
      <text x="1052" y="657" class="body" style="fill:#1d4ed8;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">AIで作成支援</text>
      <rect x="542" y="678" width="648" height="176" rx="7" class="input"/>
      <text x="566" y="712" class="text body">1. 依頼されたユースケースに沿って、成功条件を確認している。</text>
      <text x="566" y="742" class="text body">2. 失敗、未実行、未確認の範囲を隠さず書いている。</text>
      <text x="566" y="772" class="text body">3. 画面確認では、結論、操作可能性、情報量、視線順序を評価している。</text>
      <text x="566" y="802" class="text body">4. 次に直すべきことがある場合、ユーザーに意味のある粒度で示している。</text>
      <text x="566" y="832" class="muted body">採点やレビューコメントが必要な場合は、レビュー担当のRoleで表示項目を増やす。</text>
    </g>

    <line x1="180" y1="882" x2="1260" y2="882" class="line"/>
    <rect x="922" y="904" width="106" height="36" rx="7" fill="#fff" stroke="#b8c4d3"/>
    <text x="958" y="927" class="muted body">閉じる</text>
    <rect x="1042" y="904" width="148" height="36" rx="7" class="button"/>
    <text x="1088" y="927" class="body" style="fill:#fff;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">保存</text>
  </g>
</svg>
