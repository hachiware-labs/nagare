<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="agent-modal-title agent-modal-desc">
  <title id="agent-modal-title">Nagare Agent List And Edit Modal</title>
  <desc id="agent-modal-desc">Agent management screen using an agent list as the base view and a large edit modal for the selected agent settings.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172033" flood-opacity=".18"/>
    </filter>
    <style>
      .bg{fill:#f6f8fb}
      .surface{fill:#fff;stroke:#d8e0ea;stroke-width:1}
      .soft{fill:#f8fbff;stroke:#d8e0ea;stroke-width:1}
      .input{fill:#fff;stroke:#b8c4d3;stroke-width:1}
      .line{stroke:#d8e0ea;stroke-width:1}
      .brand{fill:#2f6f73}
      .brand-soft{fill:#e6f4f1}
      .blue{fill:#1d4ed8}
      .blue-soft{fill:#eef4ff;stroke:#b9cfff}
      .green-soft{fill:#e8f7ee;stroke:#b8e3c7}
      .amber-soft{fill:#fff7e8;stroke:#f2d29b}
      .text{fill:#111827;font-family:Inter,"Segoe UI","Yu Gothic UI",Meiryo,Arial,sans-serif}
      .muted{fill:#566579;font-family:Inter,"Segoe UI","Yu Gothic UI",Meiryo,Arial,sans-serif}
      .title{font-size:25px;font-weight:760}
      .h1{font-size:22px;font-weight:760}
      .h2{font-size:16px;font-weight:740}
      .h3{font-size:13px;font-weight:740}
      .body{font-size:12px;font-weight:560}
      .small{font-size:11px;font-weight:560}
      .tiny{font-size:10px;font-weight:760}
      .nav{font-size:13px;font-weight:680}
      .nav-on{font-size:13px;font-weight:780}
      .tab{font-size:13px;font-weight:760}
    </style>
  </defs>

  <rect class="bg" width="1440" height="1024"/>

  <g id="background-agent-list" opacity=".58">
    <rect x="0" y="0" width="204" height="1024" fill="#fff" stroke="#d8e0ea"/>
    <text x="28" y="43" class="text title">Nagare</text>
    <text x="30" y="66" class="muted small">制御プレーン</text>
    <text x="34" y="118" class="muted nav">ワーク</text>
    <text x="34" y="157" class="muted nav">プロジェクト</text>
    <text x="34" y="196" class="muted nav">ドメイン</text>
    <rect x="18" y="213" width="168" height="34" rx="7" class="brand-soft"/>
    <rect x="18" y="213" width="4" height="34" rx="2" class="brand"/>
    <text x="34" y="235" class="text nav-on" style="fill:#2f6f73">エージェント</text>
    <text x="34" y="274" class="muted nav">スキル</text>
    <text x="34" y="313" class="muted nav">MCP</text>
    <text x="34" y="352" class="muted nav">ランタイム</text>

    <text x="232" y="48" class="text title">エージェント</text>
    <text x="232" y="72" class="muted body">ツールに依存しないエージェントを追加し、担当範囲と能力を管理する</text>
    <rect x="1208" y="32" width="138" height="36" rx="7" class="brand"/>
    <text x="1240" y="55" class="body" style="fill:#fff;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">新規作成</text>

    <rect x="232" y="96" width="1164" height="828" rx="8" class="surface"/>
    <text x="260" y="136" class="text h1">エージェント一覧</text>
    <rect x="260" y="164" width="456" height="38" rx="7" class="input"/>
    <text x="278" y="188" class="muted body">名前、役割、ドメイン、成果物種別で検索</text>
    <rect x="736" y="164" width="150" height="38" rx="7" class="input"/>
    <text x="760" y="188" class="muted body">役割で絞り込み</text>
    <rect x="900" y="164" width="160" height="38" rx="7" class="input"/>
    <text x="924" y="188" class="muted body">ドメインで絞り込み</text>

    <rect x="260" y="236" width="1088" height="36" rx="7" fill="#f1f5f9"/>
    <text x="284" y="259" class="muted tiny">エージェント</text>
    <text x="530" y="259" class="muted tiny">役割</text>
    <text x="668" y="259" class="muted tiny">担当</text>
    <text x="906" y="259" class="muted tiny">ランタイム</text>
    <text x="1070" y="259" class="muted tiny">利用能力</text>

    <g id="row-selected">
      <rect x="260" y="292" width="1088" height="78" rx="8" class="brand-soft" stroke="#b9ddd6"/>
      <rect x="260" y="292" width="5" height="78" rx="2" class="brand"/>
      <text x="284" y="322" class="text h2" style="fill:#2f6f73">ui-builder</text>
      <text x="284" y="346" class="muted small">UI作成と画面設計</text>
      <text x="530" y="333" class="text body">ワーカー</text>
      <text x="668" y="322" class="text body">開発</text>
      <text x="668" y="346" class="muted small">UI画面、設計メモ</text>
      <text x="906" y="333" class="text body">Codex CLI</text>
      <text x="1070" y="322" class="text body">hachi-ui / hachi-search</text>
      <text x="1070" y="346" class="muted small">MCP: GitHub</text>
    </g>

    <g>
      <rect x="260" y="388" width="1088" height="72" rx="8" class="soft"/>
      <text x="284" y="418" class="text h2">reviewer</text>
      <text x="284" y="442" class="muted small">品質評価と採点</text>
      <text x="530" y="428" class="text body">レビュー</text>
      <text x="668" y="428" class="text body">開発 / レビュー結果</text>
      <text x="906" y="428" class="text body">Claude Code</text>
      <text x="1070" y="428" class="text body">web-design-guidelines</text>
    </g>

    <g>
      <rect x="260" y="478" width="1088" height="72" rx="8" class="soft"/>
      <text x="284" y="508" class="text h2">researcher</text>
      <text x="284" y="532" class="muted small">調査と根拠整理</text>
      <text x="530" y="518" class="text body">ワーカー</text>
      <text x="668" y="518" class="text body">調査 / 調査メモ</text>
      <text x="906" y="518" class="text body">OpenClaw</text>
      <text x="1070" y="518" class="text body">hachi-search</text>
    </g>

    <g>
      <rect x="260" y="568" width="1088" height="72" rx="8" class="soft"/>
      <text x="284" y="598" class="text h2">organizer</text>
      <text x="284" y="622" class="muted small">ワーク整理と割り振り</text>
      <text x="530" y="608" class="text body">オーガナイザー</text>
      <text x="668" y="608" class="text body">全体</text>
      <text x="906" y="608" class="text body">Codex CLI</text>
      <text x="1070" y="608" class="text body">GitHub MCP</text>
    </g>
  </g>

  <rect x="0" y="0" width="1440" height="1024" fill="#111827" opacity=".22"/>

  <g id="agent-edit-modal" filter="url(#shadow)">
    <rect x="180" y="64" width="1080" height="896" rx="8" fill="#fff" stroke="#cbd6e5"/>
    <rect x="180" y="64" width="1080" height="82" rx="8" fill="#fff"/>
    <text x="222" y="106" class="text h1">エージェント編集: ui-builder</text>
    <text x="222" y="130" class="muted body">役割、担当範囲、ランタイム、利用能力をこの画面でまとめて設定する</text>
    <rect x="1096" y="90" width="44" height="34" rx="7" class="surface"/>
    <path d="M1110 100 L1126 116 M1126 100 L1110 116" stroke="#566579" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="146" x2="1260" y2="146" class="line"/>

    <g id="modal-form">
      <text x="222" y="192" class="text h2">基本情報</text>
      <text x="222" y="216" class="muted body">一覧や割り振り判断で使う、エージェントの名前と役割</text>

      <text x="222" y="262" class="text h3">表示名</text>
      <rect x="222" y="278" width="300" height="42" rx="7" class="input"/>
      <text x="242" y="305" class="text body">ui-builder</text>

      <text x="550" y="262" class="text h3">役割</text>
      <rect x="550" y="278" width="190" height="42" rx="7" class="input"/>
      <text x="570" y="305" class="text body">ワーカー</text>
      <path d="M712 295 l7 7 l7 -7" fill="none" stroke="#566579" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

      <text x="768" y="262" class="text h3">状態</text>
      <rect x="768" y="278" width="128" height="42" rx="7" class="green-soft"/>
      <text x="812" y="305" class="small" style="fill:#15803d;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">有効</text>

      <text x="222" y="360" class="text h3">説明</text>
      <rect x="222" y="380" width="438" height="64" rx="7" class="input"/>
      <text x="246" y="416" class="text body">UI画面、SVGプロトタイプ、画面設計メモを作成する。</text>

      <text x="694" y="360" class="text h3">指示プロンプト</text>
      <rect x="694" y="380" width="496" height="148" rx="7" class="input"/>
      <text x="718" y="414" class="text body">依頼者の目的、現在の画面状態、過去の指摘を踏まえて、</text>
      <text x="718" y="444" class="text body">使いやすさを優先して提案する。</text>
      <text x="718" y="474" class="muted body">結果では、変更意図、確認したこと、残ったリスクを短く示す。</text>

      <line x1="222" y1="560" x2="1190" y2="560" class="line"/>

      <g id="scope">
        <text x="222" y="606" class="text h2">担当範囲</text>
        <text x="222" y="630" class="muted body">このエージェントに渡してよい依頼の範囲</text>

        <text x="222" y="676" class="text h3">ドメイン</text>
        <rect x="222" y="692" width="240" height="42" rx="7" class="input"/>
        <text x="242" y="719" class="text body">開発</text>
        <path d="M434 709 l7 7 l7 -7" fill="none" stroke="#566579" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

        <text x="492" y="676" class="text h3">成果物種別</text>
        <rect x="492" y="692" width="116" height="34" rx="17" class="brand-soft" stroke="#b9ddd6"/>
        <text x="516" y="714" class="small" style="fill:#2f6f73;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">UI画面</text>
        <rect x="620" y="692" width="126" height="34" rx="17" class="brand-soft" stroke="#b9ddd6"/>
        <text x="644" y="714" class="small" style="fill:#2f6f73;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">設計メモ</text>
        <rect x="758" y="692" width="106" height="34" rx="17" fill="#fff" stroke="#b8c4d3"/>
        <text x="786" y="714" class="muted small">追加</text>
      </g>

      <g id="runtime">
        <text x="222" y="782" class="text h2">ランタイムとモデル</text>
        <rect x="222" y="808" width="240" height="42" rx="7" class="input"/>
        <text x="242" y="835" class="text body">Codex CLI</text>
        <path d="M434 825 l7 7 l7 -7" fill="none" stroke="#566579" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="492" y="808" width="260" height="42" rx="7" class="input"/>
        <text x="512" y="835" class="text body">gpt-5-codex</text>
        <path d="M724 825 l7 7 l7 -7" fill="none" stroke="#566579" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="770" y="808" width="122" height="42" rx="7" class="blue-soft"/>
        <text x="792" y="835" class="small" style="fill:#1d4ed8;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">接続確認</text>
      </g>

      <g id="capabilities">
        <text x="934" y="606" class="text h2">利用能力</text>
        <text x="934" y="630" class="muted body">このエージェントだけに渡すスキルとMCP</text>
        <rect x="934" y="664" width="256" height="42" rx="7" class="blue-soft"/>
        <text x="956" y="691" class="small" style="fill:#1d4ed8;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">スキル: hachi-ui / hachi-search</text>
        <rect x="934" y="722" width="256" height="42" rx="7" class="blue-soft"/>
        <text x="956" y="749" class="small" style="fill:#1d4ed8;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">MCP: GitHub</text>
        <rect x="934" y="782" width="120" height="36" rx="7" fill="#fff" stroke="#b8c4d3"/>
        <text x="962" y="805" class="muted body">編集</text>
      </g>
    </g>

    <line x1="180" y1="884" x2="1260" y2="884" class="line"/>
    <rect x="918" y="906" width="106" height="36" rx="7" fill="#fff" stroke="#b8c4d3"/>
    <text x="954" y="929" class="muted body">閉じる</text>
    <rect x="1038" y="906" width="152" height="36" rx="7" class="brand"/>
    <text x="1094" y="929" class="body" style="fill:#fff;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">保存</text>
  </g>
</svg>
