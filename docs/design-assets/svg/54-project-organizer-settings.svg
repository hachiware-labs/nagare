<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="project-organizer-title project-organizer-desc">
  <title id="project-organizer-title">Nagare Project Organizer Settings</title>
  <desc id="project-organizer-desc">Project edit modal showing organizer selection. When no project organizer is configured, Nagare uses the built-in organizer visibly rather than hiding the fallback.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172033" flood-opacity=".18"/>
    </filter>
    <style>
      .bg{fill:#f6f8fb}
      .surface{fill:#fff;stroke:#d8e0ea;stroke-width:1}
      .soft{fill:#f8fbff;stroke:#d8e0ea;stroke-width:1}
      .input{fill:#fff;stroke:#b8c4d3;stroke-width:1}
      .line{stroke:#d8e0ea;stroke-width:1}
      .brand{fill:#2f6f73}
      .brand-soft{fill:#e6f4f1}
      .blue-soft{fill:#eef4ff;stroke:#b9cfff}
      .green-soft{fill:#e8f7ee;stroke:#b8e3c7}
      .text{fill:#111827;font-family:Inter,"Segoe UI","Yu Gothic UI",Meiryo,Arial,sans-serif}
      .muted{fill:#566579;font-family:Inter,"Segoe UI","Yu Gothic UI",Meiryo,Arial,sans-serif}
      .title{font-size:25px;font-weight:760}
      .h1{font-size:22px;font-weight:760}
      .h2{font-size:16px;font-weight:740}
      .h3{font-size:13px;font-weight:740}
      .body{font-size:12px;font-weight:560}
      .small{font-size:11px;font-weight:560}
      .tiny{font-size:10px;font-weight:760}
      .nav{font-size:13px;font-weight:680}
      .nav-on{font-size:13px;font-weight:780}
    </style>
  </defs>

  <rect class="bg" width="1440" height="1024"/>

  <g id="background-project-list" opacity=".58">
    <rect x="0" y="0" width="204" height="1024" fill="#fff" stroke="#d8e0ea"/>
    <text x="28" y="43" class="text title">Nagare</text>
    <text x="30" y="66" class="muted small">制御プレーン</text>
    <text x="34" y="118" class="muted nav">ワーク</text>
    <rect x="18" y="135" width="168" height="34" rx="7" class="brand-soft"/>
    <rect x="18" y="135" width="4" height="34" rx="2" class="brand"/>
    <text x="34" y="157" class="text nav-on" style="fill:#2f6f73">プロジェクト</text>
    <text x="34" y="196" class="muted nav">ドメイン</text>
    <text x="34" y="235" class="muted nav">エージェント</text>
    <text x="34" y="274" class="muted nav">スキル</text>
    <text x="34" y="313" class="muted nav">MCP</text>
    <text x="34" y="352" class="muted nav">ランタイム</text>

    <text x="232" y="48" class="text title">プロジェクト</text>
    <text x="232" y="72" class="muted body">作業文脈、対象フォルダ、評価基準、オーガナイザーを管理する</text>
    <rect x="1208" y="32" width="138" height="36" rx="7" class="brand"/>
    <text x="1240" y="55" class="body" style="fill:#fff;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">新規作成</text>

    <rect x="232" y="96" width="1164" height="828" rx="8" class="surface"/>
    <text x="260" y="136" class="text h1">プロジェクト一覧</text>
    <rect x="260" y="164" width="476" height="38" rx="7" class="input"/>
    <text x="278" y="188" class="muted body">名前、フォルダ、状態で検索</text>

    <rect x="260" y="236" width="1088" height="36" rx="7" fill="#f1f5f9"/>
    <text x="284" y="259" class="muted tiny">プロジェクト</text>
    <text x="604" y="259" class="muted tiny">対象フォルダ</text>
    <text x="866" y="259" class="muted tiny">オーガナイザー</text>
    <text x="1080" y="259" class="muted tiny">状態</text>

    <g id="project-row-selected">
      <rect x="260" y="292" width="1088" height="78" rx="8" class="brand-soft" stroke="#b9ddd6"/>
      <rect x="260" y="292" width="5" height="78" rx="2" class="brand"/>
      <text x="284" y="322" class="text h2" style="fill:#2f6f73">Nagare</text>
      <text x="284" y="346" class="muted small">エージェント制御プレーン</text>
      <text x="604" y="333" class="text body">C:\Users\naruhide\workspace\nagare</text>
      <text x="866" y="322" class="text body">ビルトインを使用</text>
      <text x="866" y="346" class="muted small">プロジェクト固有は未設定</text>
      <text x="1080" y="333" class="text body">利用可能</text>
    </g>

    <g>
      <rect x="260" y="388" width="1088" height="72" rx="8" class="soft"/>
      <text x="284" y="418" class="text h2">灯火館</text>
      <text x="284" y="442" class="muted small">CLI入口と管理人セッション</text>
      <text x="604" y="428" class="text body">未設定</text>
      <text x="866" y="428" class="text body">tomoshibi-organizer</text>
      <text x="1080" y="428" class="text body">準備中</text>
    </g>
  </g>

  <rect x="0" y="0" width="1440" height="1024" fill="#111827" opacity=".22"/>

  <g id="project-edit-modal" filter="url(#shadow)">
    <rect x="180" y="76" width="1080" height="872" rx="8" fill="#fff" stroke="#cbd6e5"/>
    <rect x="180" y="76" width="1080" height="82" rx="8" fill="#fff"/>
    <text x="222" y="118" class="text h1">プロジェクト編集: Nagare</text>
    <text x="222" y="142" class="muted body">管理人から引き継がれた依頼を、どのオーガナイザーが整理するかを設定する</text>
    <rect x="1096" y="102" width="44" height="34" rx="7" class="surface"/>
    <path d="M1110 112 L1126 128 M1126 112 L1110 128" stroke="#566579" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="158" x2="1260" y2="158" class="line"/>

    <g id="project-basic">
      <text x="222" y="208" class="text h2">基本情報</text>
      <text x="222" y="232" class="muted body">プロジェクトの作業文脈と対象フォルダ</text>

      <text x="222" y="278" class="text h3">プロジェクト名</text>
      <rect x="222" y="294" width="360" height="42" rx="7" class="input"/>
      <text x="242" y="321" class="text body">Nagare</text>

      <text x="614" y="278" class="text h3">対象フォルダ</text>
      <rect x="614" y="294" width="576" height="42" rx="7" class="input"/>
      <text x="634" y="321" class="text body">C:\Users\naruhide\workspace\nagare</text>

      <text x="222" y="374" class="text h3">説明</text>
      <rect x="222" y="394" width="968" height="64" rx="7" class="input"/>
      <text x="246" y="432" class="text body">複数ランタイム、エージェント、スキル、MCPを横断してワークを進める制御プレーン。</text>
    </g>

    <line x1="222" y1="498" x2="1190" y2="498" class="line"/>

    <g id="organizer-setting">
      <text x="222" y="546" class="text h2">オーガナイザー</text>
      <text x="222" y="570" class="muted body">灯火館の管理人からこのプロジェクトへ渡された依頼を、最初に整理するセッション</text>

      <text x="222" y="618" class="text h3">使用するオーガナイザー</text>
      <rect x="222" y="636" width="420" height="46" rx="7" class="input"/>
      <text x="244" y="665" class="text body">ビルトイン・オーガナイザーを使用</text>
      <path d="M612 653 l7 7 l7 -7" fill="none" stroke="#566579" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="670" y="636" width="242" height="46" rx="7" class="green-soft"/>
      <text x="694" y="665" class="small" style="fill:#15803d;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">プロジェクト固有は未設定</text>

      <rect x="222" y="708" width="968" height="92" rx="8" class="soft"/>
      <text x="246" y="742" class="text h3">現在の引き継ぎ</text>
      <text x="246" y="770" class="text body">灯火館の管理人がプロジェクトを Nagare と判断した場合、標準のオーガナイザーがワーク化と割り振りを行う。</text>
      <text x="246" y="792" class="muted body">専用の判断基準やプロンプトが必要になったら、オーガナイザー役のエージェントを選択する。</text>

      <text x="222" y="846" class="text h3">選択候補</text>
      <rect x="314" y="824" width="154" height="34" rx="17" class="brand-soft" stroke="#b9ddd6"/>
      <text x="340" y="846" class="small" style="fill:#2f6f73;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">organizer</text>
      <rect x="480" y="824" width="210" height="34" rx="17" fill="#fff" stroke="#b8c4d3"/>
      <text x="506" y="846" class="muted small">新しいオーガナイザーを作成</text>
    </g>

    <line x1="180" y1="884" x2="1260" y2="884" class="line"/>
    <rect x="918" y="906" width="106" height="36" rx="7" fill="#fff" stroke="#b8c4d3"/>
    <text x="954" y="929" class="muted body">閉じる</text>
    <rect x="1038" y="906" width="152" height="36" rx="7" class="brand"/>
    <text x="1094" y="929" class="body" style="fill:#fff;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">保存</text>
  </g>
</svg>
