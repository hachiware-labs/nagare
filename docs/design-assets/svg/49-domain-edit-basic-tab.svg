<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="domain-basic-title domain-basic-desc">
  <title id="domain-basic-title">Nagare Domain Edit Basic Tab</title>
  <desc id="domain-basic-desc">Domain edit modal with two tabs. The Basic Information tab shows only domain description and shared knowledge.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#172033" flood-opacity=".18"/>
    </filter>
    <style>
      .bg{fill:#f6f8fb}
      .surface{fill:#fff;stroke:#d8e0ea;stroke-width:1}
      .soft{fill:#f8fbff;stroke:#d8e0ea;stroke-width:1}
      .input{fill:#fff;stroke:#b8c4d3;stroke-width:1}
      .line{stroke:#d8e0ea;stroke-width:1}
      .brand{fill:#2f6f73}
      .brand-soft{fill:#e6f4f1}
      .button{fill:#2f6f73}
      .text{fill:#111827;font-family:Inter,"Segoe UI","Yu Gothic UI",Meiryo,Arial,sans-serif}
      .muted{fill:#566579;font-family:Inter,"Segoe UI","Yu Gothic UI",Meiryo,Arial,sans-serif}
      .title{font-size:25px;font-weight:760}
      .h1{font-size:22px;font-weight:760}
      .h2{font-size:16px;font-weight:740}
      .h3{font-size:13px;font-weight:740}
      .body{font-size:12px;font-weight:560}
      .small{font-size:11px;font-weight:560}
      .tiny{font-size:10px;font-weight:760}
      .nav{font-size:13px;font-weight:680}
      .nav-on{font-size:13px;font-weight:780}
      .tab{font-size:13px;font-weight:760}
    </style>
  </defs>

  <rect class="bg" width="1440" height="1024"/>

  <g id="background-domain-list" opacity=".56">
    <rect x="0" y="0" width="204" height="1024" fill="#fff" stroke="#d8e0ea"/>
    <text x="28" y="43" class="text title">Nagare</text>
    <text x="30" y="66" class="muted small">制御プレーン</text>
    <text x="34" y="118" class="muted nav">ワーク</text>
    <text x="34" y="157" class="muted nav">プロジェクト</text>
    <rect x="18" y="174" width="168" height="34" rx="7" class="brand-soft"/>
    <rect x="18" y="174" width="4" height="34" rx="2" class="brand"/>
    <text x="34" y="196" class="text nav-on" style="fill:#2f6f73">ドメイン</text>
    <text x="34" y="235" class="muted nav">エージェント</text>
    <text x="34" y="274" class="muted nav">スキル</text>
    <text x="34" y="313" class="muted nav">MCP</text>
    <text x="232" y="48" class="text title">ドメイン</text>
    <text x="232" y="72" class="muted body">一覧から選び、詳細を編集する</text>
    <rect x="232" y="96" width="1164" height="828" rx="8" class="surface"/>
    <text x="260" y="136" class="text h1">ドメイン一覧</text>
    <rect x="260" y="190" width="476" height="38" rx="7" class="input"/>
    <text x="278" y="214" class="muted body">検索: 開発、調査、営業...</text>
    <rect x="260" y="258" width="1088" height="36" rx="7" fill="#f1f5f9"/>
    <text x="282" y="281" class="muted tiny">ドメイン</text>
    <text x="606" y="281" class="muted tiny">成果物種別</text>
    <text x="746" y="281" class="muted tiny">状態</text>
    <rect x="260" y="310" width="1088" height="78" rx="8" class="brand-soft" stroke="#b9ddd6"/>
    <rect x="260" y="310" width="5" height="78" rx="2" class="brand"/>
    <text x="282" y="338" class="text h2" style="fill:#2f6f73">開発</text>
    <text x="282" y="361" class="muted small">コード、UI、テスト、ドキュメント</text>
    <text x="606" y="348" class="text body">4</text>
    <text x="746" y="348" class="text body">要確認</text>
    <rect x="260" y="404" width="1088" height="70" rx="8" class="soft"/>
    <text x="282" y="432" class="text h2">調査</text>
    <text x="282" y="455" class="muted small">Web調査、比較、根拠整理</text>
  </g>

  <rect x="0" y="0" width="1440" height="1024" fill="#111827" opacity=".22"/>

  <g id="domain-edit-modal-basic" filter="url(#shadow)">
    <rect x="180" y="74" width="1080" height="876" rx="8" fill="#fff" stroke="#cbd6e5"/>
    <rect x="180" y="74" width="1080" height="82" rx="8" fill="#fff"/>
    <text x="222" y="116" class="text h1">ドメイン編集: 開発</text>
    <text x="222" y="140" class="muted body">ドメイン単位の説明と共通知識を管理する</text>
    <rect x="1096" y="100" width="44" height="34" rx="7" class="surface"/>
    <path d="M1110 110 L1126 126 M1126 110 L1110 126" stroke="#566579" stroke-width="2" stroke-linecap="round"/>
    <line x1="180" y1="156" x2="1260" y2="156" class="line"/>

    <g id="tabs">
      <rect x="222" y="180" width="152" height="40" rx="7" class="brand-soft" stroke="#b9ddd6"/>
      <text x="254" y="205" class="tab" style="fill:#2f6f73;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">基本情報</text>
      <rect x="386" y="180" width="166" height="40" rx="7" fill="#fff" stroke="#d8e0ea"/>
      <text x="425" y="205" class="muted tab">成果物種別</text>
    </g>

    <g id="basic-fields">
      <text x="222" y="258" class="text h2">基本情報</text>
      <text x="222" y="282" class="muted body">ワーク依頼を振り分ける時に使う、ドメイン全体の意味を定義する</text>

      <text x="222" y="330" class="text h3">ドメイン名</text>
      <rect x="222" y="346" width="450" height="44" rx="7" class="input"/>
      <text x="242" y="374" class="text body">開発</text>

      <text x="704" y="330" class="text h3">短い説明</text>
      <rect x="704" y="346" width="486" height="44" rx="7" class="input"/>
      <text x="724" y="374" class="text body">コード、UI、テスト、ドキュメントを扱う</text>

      <text x="222" y="432" class="text h3">ドメインの説明</text>
      <rect x="222" y="452" width="968" height="148" rx="7" class="input"/>
      <text x="246" y="486" class="text body">開発に関する依頼を受け、必要な成果物種別に分けてエージェントへ渡す。</text>
      <text x="246" y="514" class="text body">UI作成、実装、レビュー、テスト、技術調査、設計整理などを含める。</text>
      <text x="246" y="542" class="muted body">営業資料や契約判断など、開発成果物ではない依頼は別ドメインへ回す。</text>

      <text x="222" y="648" class="text h3">共通知識</text>
      <rect x="222" y="668" width="968" height="184" rx="7" class="input"/>
      <text x="246" y="704" class="text body">Nagareでは、ユーザーの依頼からワークを作成し、適切なランタイムとエージェントに割り当てる。</text>
      <text x="246" y="734" class="text body">UIでは依頼者が結論、担当ステップ、レビュー結果を追えることを重視する。</text>
      <text x="246" y="764" class="text body">実装変更では、ユーザー未承認の既存変更を戻さず、差分の意図を保つ。</text>
      <text x="246" y="794" class="muted body">成果物ごとの具体的な評価基準や補足知識は「成果物種別」タブで管理する。</text>
    </g>

    <line x1="180" y1="882" x2="1260" y2="882" class="line"/>
    <rect x="922" y="904" width="106" height="36" rx="7" fill="#fff" stroke="#b8c4d3"/>
    <text x="958" y="927" class="muted body">閉じる</text>
    <rect x="1042" y="904" width="148" height="36" rx="7" class="button"/>
    <text x="1088" y="927" class="body" style="fill:#fff;font-family:Inter,'Segoe UI','Yu Gothic UI',Meiryo,Arial,sans-serif">保存</text>
  </g>
</svg>
