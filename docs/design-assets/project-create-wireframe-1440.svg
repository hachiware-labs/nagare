<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Project Create Wireframe 1440</title>
  <desc id="desc">Nagare project create wireframe with work folder, optional knowledge files, optional agents, and create action.</desc>
  <defs>
    <style>
      .bg{fill:#f8f8f8}.surface{fill:#fff}.soft{fill:#f3f4f6}.line{stroke:#d1d5db;stroke-width:1;fill:none}.strong{stroke:#111827;stroke-width:1.5;fill:none}.text{fill:#111827;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#6b7280;font-family:Inter,Segoe UI,Arial,sans-serif}.tiny{font-size:11px}.small{font-size:12px}.body{font-size:14px}.h2{font-size:17px;font-weight:700}.h1{font-size:24px;font-weight:700}.bold{font-weight:700}.chip{fill:#fff;stroke:#9ca3af;stroke-width:1}.active{fill:#e5e7eb}.wire{fill:none;stroke:#111827;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1440" height="1024"/>
  <g id="sidebar">
    <rect class="surface" x="0" y="0" width="200" height="1024"/><line class="line" x1="200" y1="0" x2="200" y2="1024"/>
    <circle class="soft" cx="39" cy="42" r="18"/><path class="wire" d="M28 45c12 0 20-8 26-20-4 17-10 27-26 30z"/>
    <text class="text h1" x="62" y="39">Nagare</text><text class="muted tiny" x="64" y="61">hachiware-labs</text>
    <g class="body">
      <text class="text" x="62" y="132">ワーク</text><rect class="wire" x="34" y="121" width="13" height="10" rx="1"/>
      <rect class="active" x="18" y="154" width="164" height="37" rx="8"/><text class="text bold" x="62" y="178">プロジェクト</text><path class="wire" d="M34 171h14l2 4v8H32v-12z"/>
      <text class="text" x="62" y="224">知識</text><rect class="wire" x="34" y="209" width="13" height="16" rx="1"/>
      <text class="text" x="62" y="270">エージェント</text><circle class="wire" cx="40" cy="254" r="4"/><path class="wire" d="M32 270c1-7 15-7 16 0"/>
      <text class="text" x="62" y="316">設定</text><circle class="wire" cx="40" cy="300" r="5"/><path class="wire" d="M40 290v5M40 305v5M30 300h5M45 300h5"/>
    </g>
  </g>
  <g id="content" transform="translate(232 28)">
    <text class="text h1" x="0" y="20">プロジェクトを追加</text>
    <text class="muted small" x="0" y="52">作業フォルダを選ぶとプロジェクト名を自動で作ります</text>
    <rect class="chip" x="1012" y="0" width="176" height="38" rx="7"/><text class="text small bold" x="1052" y="24">一覧に戻る</text>
    <line class="strong" x1="0" y1="80" x2="1188" y2="80"/>
    <g transform="translate(0 112)">
      <rect class="surface" x="0" y="0" width="1188" height="166" rx="8"/><rect class="line" x="0" y="0" width="1188" height="166" rx="8"/>
      <text class="text h2" x="28" y="36">作業フォルダ</text><text class="muted small" x="28" y="62">必須。選択したフォルダ名をプロジェクト名に使います。</text>
      <rect class="soft" x="28" y="90" width="880" height="44" rx="7"/><text class="muted body" x="48" y="118">フォルダを選択</text>
      <rect class="chip" x="930" y="90" width="148" height="44" rx="7"/><text class="text small bold" x="967" y="118">参照</text>
    </g>
    <g transform="translate(0 306)">
      <rect class="surface" x="0" y="0" width="580" height="336" rx="8"/><rect class="line" x="0" y="0" width="580" height="336" rx="8"/>
      <text class="text h2" x="28" y="36">知識ファイル</text><text class="muted small" x="28" y="62">任意。後から追加できます。</text>
      <rect class="soft" x="28" y="88" width="136" height="36" rx="7"/><text class="text small bold" x="53" y="111">ファイルを登録</text>
      <rect class="surface" x="28" y="148" width="524" height="54" rx="7"/><rect class="line" x="28" y="148" width="524" height="54" rx="7"/><text class="muted body" x="48" y="181">まだ登録されていません</text>
    </g>
    <g transform="translate(608 306)">
      <rect class="surface" x="0" y="0" width="580" height="336" rx="8"/><rect class="line" x="0" y="0" width="580" height="336" rx="8"/>
      <text class="text h2" x="28" y="36">参加エージェント</text><text class="muted small" x="28" y="62">任意。既存エージェントを追加できます。</text>
      <rect class="soft" x="28" y="88" width="156" height="36" rx="7"/><text class="text small bold" x="57" y="111">エージェントを追加</text>
      <rect class="surface" x="28" y="148" width="524" height="54" rx="7"/><rect class="line" x="28" y="148" width="524" height="54" rx="7"/><text class="muted body" x="48" y="181">まだ追加されていません</text>
    </g>
    <g transform="translate(0 682)">
      <rect class="surface" x="0" y="0" width="1188" height="92" rx="8"/><rect class="line" x="0" y="0" width="1188" height="92" rx="8"/>
      <text class="text body bold" x="28" y="36">プロジェクトを作成</text><text class="muted small" x="28" y="60">作成後、プロジェクト詳細でファイルとエージェントを追加できます。</text>
      <rect class="chip" x="884" y="24" width="110" height="42" rx="7"/><text class="text small bold" x="917" y="50">戻る</text>
      <rect class="soft" x="1010" y="24" width="154" height="42" rx="7"/><text class="text small bold" x="1032" y="50">プロジェクトを作成</text>
    </g>
  </g>
</svg>
