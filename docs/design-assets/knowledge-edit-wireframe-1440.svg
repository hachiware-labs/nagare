<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge Edit Wireframe 1440</title>
  <desc id="desc">Nagare knowledge domain edit wireframe with artifact definitions and one large rubric text editor per artifact.</desc>
  <defs>
    <style>
      .bg{fill:#f8f8f8}.surface{fill:#fff}.soft{fill:#f3f4f6}.line{stroke:#d1d5db;stroke-width:1;fill:none}.strong{stroke:#111827;stroke-width:1.5;fill:none}.text{fill:#111827;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#6b7280;font-family:Inter,Segoe UI,Arial,sans-serif}.tiny{font-size:11px}.small{font-size:12px}.body{font-size:14px}.h2{font-size:17px;font-weight:700}.h1{font-size:24px;font-weight:700}.bold{font-weight:700}.chip{fill:#fff;stroke:#9ca3af;stroke-width:1}.active{fill:#e5e7eb}.wire{fill:none;stroke:#111827;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1440" height="1024"/>
  <g id="sidebar">
    <rect class="surface" x="0" y="0" width="200" height="1024"/><line class="line" x1="200" y1="0" x2="200" y2="1024"/>
    <circle class="soft" cx="39" cy="42" r="18"/><path class="wire" d="M28 45c12 0 20-8 26-20-4 17-10 27-26 30z"/>
    <text class="text h1" x="62" y="39">Nagare</text><text class="muted tiny" x="64" y="61">hachiware-labs</text>
    <g class="body">
      <text class="text" x="62" y="132">ワーク</text><rect class="wire" x="34" y="121" width="13" height="10" rx="1"/>
      <text class="text" x="62" y="178">プロジェクト</text><path class="wire" d="M34 171h14l2 4v8H32v-12z"/>
      <rect class="active" x="18" y="200" width="164" height="37" rx="8"/><text class="text bold" x="62" y="224">知識</text><rect class="wire" x="34" y="209" width="13" height="16" rx="1"/>
      <text class="text" x="62" y="270">エージェント</text><circle class="wire" cx="40" cy="254" r="4"/><path class="wire" d="M32 270c1-7 15-7 16 0"/>
      <text class="text" x="62" y="316">設定</text><circle class="wire" cx="40" cy="300" r="5"/><path class="wire" d="M40 290v5M40 305v5M30 300h5M45 300h5"/>
    </g>
  </g>
  <g id="content" transform="translate(232 28)">
    <text class="text h1" x="0" y="20">ソフトウェア開発</text>
    <text class="muted small" x="0" y="52">生成物ごとに、生成と評価をまとめた長いルーブリック本文を編集します</text>
    <rect class="chip" x="1012" y="0" width="176" height="38" rx="7"/><text class="text small bold" x="1052" y="24">一覧に戻る</text>
    <line class="strong" x1="0" y1="80" x2="1188" y2="80"/>
    <g transform="translate(0 104)">
      <rect class="surface" x="0" y="0" width="1188" height="92" rx="8"/><rect class="line" x="0" y="0" width="1188" height="92" rx="8"/>
      <text class="text h2" x="28" y="34">知識領域</text>
      <rect class="soft" x="28" y="54" width="320" height="28" rx="7"/><text class="text small" x="48" y="73">ソフトウェア開発</text>
      <rect class="soft" x="368" y="54" width="792" height="28" rx="7"/><text class="text small" x="388" y="73">README、CLI、UI実装の共通知識</text>
    </g>
    <g transform="translate(0 216)">
      <rect class="surface" x="0" y="0" width="1188" height="112" rx="8"/><rect class="line" x="0" y="0" width="1188" height="112" rx="8"/>
      <text class="text h2" x="28" y="34">生成物</text>
      <rect class="soft" x="1040" y="20" width="120" height="34" rx="7"/><text class="text small bold" x="1062" y="42">生成物を追加</text>
      <g transform="translate(28 58)">
        <rect class="active" x="0" y="0" width="254" height="38" rx="7"/><text class="text small bold" x="14" y="24">README</text><text class="muted tiny" x="96" y="24">ルーブリック 100行</text>
        <rect class="surface" x="270" y="0" width="254" height="38" rx="7"/><rect class="line" x="270" y="0" width="254" height="38" rx="7"/><text class="text small bold" x="284" y="24">CLIエラー説明</text><text class="muted tiny" x="398" y="24">ルーブリック 40行</text>
        <rect class="surface" x="540" y="0" width="254" height="38" rx="7"/><rect class="line" x="540" y="0" width="254" height="38" rx="7"/><text class="text small bold" x="554" y="24">UI変更レポート</text><text class="muted tiny" x="666" y="24">ルーブリック 70行</text>
      </g>
    </g>
    <g id="artifact-editor" transform="translate(0 348)">
      <rect class="surface" x="0" y="0" width="1188" height="530" rx="8"/><rect class="line" x="0" y="0" width="1188" height="530" rx="8"/>
      <text class="text h2" x="28" y="36">READMEの定義</text>
      <rect class="chip" x="832" y="18" width="146" height="32" rx="7"/><text class="text tiny bold" x="863" y="39">テンプレート</text>
      <rect class="soft" x="990" y="18" width="170" height="32" rx="7"/><text class="text tiny bold" x="1022" y="39">本文を整形</text>
      <rect class="soft" x="28" y="62" width="1132" height="58" rx="7"/>
      <text class="muted small" x="46" y="84">生成物はどんなものか</text>
      <text class="text small" x="46" y="104">setup.mdの変更点が重複なく反映され、変更対象と確認結果まで読めるREADME。</text>
      <g transform="translate(28 144)">
        <text class="text small bold" x="0" y="0">ルーブリック本文</text>
        <text class="muted tiny" x="154" y="0">生成と評価を分けず、この生成物をどう作り、どう合格判断するかを一つの長文で管理します。</text>
        <rect class="soft" x="0" y="18" width="1132" height="318" rx="7"/>
        <text class="text small" x="18" y="46"># READMEルーブリック</text>
        <text class="text small" x="18" y="78">この生成物は、setup.mdの変更内容が反映されたREADMEです。</text>
        <text class="text small" x="18" y="110">作成時は、既存READMEの章構成を先に読み、重複する説明を増やさないこと。</text>
        <text class="text small" x="18" y="142">setup.md の差分から、ユーザーが実行する手順、前提条件、確認コマンドを抽出すること。</text>
        <text class="text small" x="18" y="174">長い手順は、前提条件、実行手順、確認手順に分けて、既存章へ自然に追記すること。</text>
        <text class="text small" x="18" y="206">完成後は、変更対象、変更しなかった内容、確認結果が読める状態になっていること。</text>
        <text class="text small" x="18" y="238">レビューでは、既存READMEとの矛盾、説明の重複、確認不能な記述がないかを確認すること。</text>
        <text class="muted small" x="18" y="282">... 100行規模の長文をこのまま編集</text>
        <line class="strong" x1="1118" y1="38" x2="1118" y2="306"/><rect class="active" x="1113" y="72" width="10" height="104" rx="5"/>
      </g>
    </g>
    <g transform="translate(0 900)">
      <rect class="surface" x="0" y="0" width="1188" height="56" rx="8"/><rect class="line" x="0" y="0" width="1188" height="56" rx="8"/>
      <rect class="chip" x="28" y="10" width="136" height="36" rx="7"/><text class="text small bold" x="53" y="33">ファイルを登録</text>
      <text class="muted small" x="184" y="33">知識ファイル 2件</text>
      <rect class="chip" x="884" y="10" width="110" height="36" rx="7"/><text class="text small bold" x="917" y="33">戻る</text>
      <rect class="soft" x="1010" y="10" width="154" height="36" rx="7"/><text class="text small bold" x="1040" y="33">変更を保存</text>
    </g>
  </g>
</svg>
