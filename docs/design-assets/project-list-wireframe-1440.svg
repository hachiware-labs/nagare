<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Project List Wireframe 1440</title>
  <desc id="desc">Nagare project list wireframe with add project action and simple project rows.</desc>
  <defs>
    <style>
      .bg{fill:#f8f8f8}.surface{fill:#fff}.soft{fill:#f3f4f6}.line{stroke:#d1d5db;stroke-width:1;fill:none}.strong{stroke:#111827;stroke-width:1.5;fill:none}.text{fill:#111827;font-family:Inter,Segoe UI,Arial,sans-serif}.muted{fill:#6b7280;font-family:Inter,Segoe UI,Arial,sans-serif}.tiny{font-size:11px}.small{font-size:12px}.body{font-size:14px}.h2{font-size:17px;font-weight:700}.h1{font-size:24px;font-weight:700}.bold{font-weight:700}.chip{fill:#fff;stroke:#9ca3af;stroke-width:1}.active{fill:#e5e7eb}.wire{fill:none;stroke:#111827;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect class="bg" width="1440" height="1024"/>
  <g id="sidebar">
    <rect class="surface" x="0" y="0" width="200" height="1024"/><line class="line" x1="200" y1="0" x2="200" y2="1024"/>
    <circle class="soft" cx="39" cy="42" r="18"/><path class="wire" d="M28 45c12 0 20-8 26-20-4 17-10 27-26 30z"/>
    <text class="text h1" x="62" y="39">Nagare</text><text class="muted tiny" x="64" y="61">hachiware-labs</text>
    <g class="body">
      <text class="text" x="62" y="132">ワーク</text><rect class="wire" x="34" y="121" width="13" height="10" rx="1"/>
      <rect class="active" x="18" y="154" width="164" height="37" rx="8"/><text class="text bold" x="62" y="178">プロジェクト</text><path class="wire" d="M34 171h14l2 4v8H32v-12z"/>
      <text class="text" x="62" y="224">知識</text><rect class="wire" x="34" y="209" width="13" height="16" rx="1"/>
      <text class="text" x="62" y="270">エージェント</text><circle class="wire" cx="40" cy="254" r="4"/><path class="wire" d="M32 270c1-7 15-7 16 0"/>
      <text class="text" x="62" y="316">設定</text><circle class="wire" cx="40" cy="300" r="5"/><path class="wire" d="M40 290v5M40 305v5M30 300h5M45 300h5"/>
    </g>
  </g>
  <g id="content" transform="translate(232 28)">
    <text class="text h1" x="0" y="20">プロジェクト</text>
    <text class="muted small" x="0" y="52">作業フォルダごとのプロジェクトを開く、または追加します</text>
    <line class="strong" x1="0" y1="80" x2="1188" y2="80"/>
    <g id="project-list" transform="translate(0 112)">
      <rect class="surface" x="0" y="0" width="1188" height="672" rx="8"/><rect class="line" x="0" y="0" width="1188" height="672" rx="8"/>
      <text class="text h2" x="28" y="36">プロジェクト一覧</text>
      <rect class="soft" x="960" y="20" width="200" height="38" rx="7"/>
      <text class="text small bold" x="998" y="44">新しいプロジェクトを追加</text>
      <rect class="soft" x="28" y="62" width="330" height="38" rx="7"/><text class="muted small" x="48" y="86">プロジェクト名・フォルダで検索</text>
      <g transform="translate(28 128)">
        <text class="muted tiny bold" x="0" y="0">プロジェクト</text><text class="muted tiny bold" x="380" y="0">作業フォルダ</text><text class="muted tiny bold" x="720" y="0">知識ファイル</text><text class="muted tiny bold" x="850" y="0">エージェント</text><text class="muted tiny bold" x="1020" y="0">操作</text>
        <rect class="soft" x="0" y="18" width="1132" height="64" rx="7"/>
        <text class="text body bold" x="18" y="54">nagare</text><text class="muted small" x="380" y="54">C:/workspace/nagare</text><text class="text small" x="720" y="54">4件</text><text class="text small" x="850" y="54">4人</text><rect class="chip" x="1000" y="33" width="64" height="30" rx="7"/><text class="text tiny bold" x="1018" y="53">詳細</text><rect class="chip" x="1074" y="33" width="58" height="30" rx="7"/><text class="text tiny bold" x="1090" y="53">削除</text>
        <rect class="surface" x="0" y="96" width="1132" height="64" rx="7"/><rect class="line" x="0" y="96" width="1132" height="64" rx="7"/>
        <text class="text body bold" x="18" y="132">hidamari</text><text class="muted small" x="380" y="132">C:/workspace/hidamari</text><text class="text small" x="720" y="132">2件</text><text class="text small" x="850" y="132">3人</text><rect class="chip" x="1000" y="111" width="64" height="30" rx="7"/><text class="text tiny bold" x="1018" y="131">詳細</text><rect class="chip" x="1074" y="111" width="58" height="30" rx="7"/><text class="text tiny bold" x="1090" y="131">削除</text>
        <rect class="surface" x="0" y="174" width="1132" height="64" rx="7"/><rect class="line" x="0" y="174" width="1132" height="64" rx="7"/>
        <text class="text body bold" x="18" y="210">docs-playground</text><text class="muted small" x="380" y="210">D:/work/docs-playground</text><text class="text small" x="720" y="210">1件</text><text class="text small" x="850" y="210">2人</text><rect class="chip" x="1000" y="189" width="64" height="30" rx="7"/><text class="text tiny bold" x="1018" y="209">詳細</text><rect class="chip" x="1074" y="189" width="58" height="30" rx="7"/><text class="text tiny bold" x="1090" y="209">削除</text>
      </g>
    </g>
  </g>
</svg>
