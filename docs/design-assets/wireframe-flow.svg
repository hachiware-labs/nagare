<svg xmlns="http://www.w3.org/2000/svg" width="2996" height="760" viewBox="0 0 2996 760" role="img" aria-labelledby="title desc">
  <title id="title">Nagare 初回作業フロー ワイヤーフレーム</title>
  <desc id="desc">Nagare の初回作業に必要な、空状態、初期設定、依頼作成、作業中、確認待ち状態の流れを確認するデスクトップ向け白黒ワイヤーフレーム。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .canvas { fill: #f7f7f7; }
      .contract { fill: #fff; stroke: #222; stroke-width: 1.5; rx: 8; }
      .screen { fill: #fff; stroke: #222; stroke-width: 2; rx: 8; }
      .shell { fill: #f3f3f3; stroke: #aaa; stroke-width: 1; }
      .panel { fill: #fbfbfb; stroke: #b8b8b8; stroke-width: 1; rx: 7; }
      .panelStrong { fill: #f0f0f0; stroke: #222; stroke-width: 1.2; rx: 7; }
      .input { fill: #fff; stroke: #777; stroke-width: 1; rx: 6; }
      .button { fill: #222; stroke: #222; stroke-width: 1; rx: 6; }
      .buttonLight { fill: #fff; stroke: #444; stroke-width: 1; rx: 6; }
      .chip { fill: #ededed; stroke: #777; stroke-width: 1; rx: 10; }
      .chipDark { fill: #222; stroke: #222; stroke-width: 1; rx: 10; }
      .line { stroke: #222; stroke-width: 1.6; fill: none; }
      .softLine { stroke: #aaa; stroke-width: 1; fill: none; }
      .dash { stroke: #777; stroke-width: 1.2; fill: none; stroke-dasharray: 5 5; }
      .title { font: 700 26px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .subtitle { font: 400 14px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #555; letter-spacing: 0; }
      .contractTitle { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .contractText { font: 400 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .brand { font: 800 15px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .nav { font: 700 11px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .h { font: 700 18px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .h2 { font: 700 14px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .body { font: 400 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .small { font: 400 10px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #555; letter-spacing: 0; }
      .label { font: 700 10px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .buttonText { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .arrowLabel { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="canvas" width="2996" height="760"/>
  <text class="title" x="56" y="54">Nagare 初回作業フロー ワイヤーフレーム</text>
  <text class="subtitle" x="56" y="78">圧縮フロー: 画面順、状態、遷移トリガーを検証する。実際の情報密度は Work Run Trace の状態別SVGで確認する</text>

  <g id="screen-contracts">
    <g id="contract-01" transform="translate(56 126)">
      <rect class="contract" width="500" height="58"/>
      <text class="contractTitle" x="14" y="20">画面 01 の役割</text>
      <text class="contractText" x="14" y="38">問い: 何もない状態で最初に何をすればよいか？</text>
      <text class="contractText" x="14" y="52">主操作: セットアップを始める / 空状態と不足だけを示す</text>
    </g>
    <g id="contract-02" transform="translate(652 126)">
      <rect class="contract" width="500" height="58"/>
      <text class="contractTitle" x="14" y="20">画面 02 の役割</text>
      <text class="contractText" x="14" y="38">問い: 実行できる最小構成は揃ったか？</text>
      <text class="contractText" x="14" y="52">主操作: 接続してワークへ進む / 失敗時は同画面で回復</text>
    </g>
    <g id="contract-03" transform="translate(1248 126)">
      <rect class="contract" width="500" height="58"/>
      <text class="contractTitle" x="14" y="20">画面 03 の役割</text>
      <text class="contractText" x="14" y="38">問い: 何を頼み、何は自動推定に任せるか？</text>
      <text class="contractText" x="14" y="52">主操作: 依頼を作成 / 範囲警告は作成前に見せる</text>
    </g>
    <g id="contract-04" transform="translate(1844 126)">
      <rect class="contract" width="500" height="58"/>
      <text class="contractTitle" x="14" y="20">画面 04 の役割</text>
      <text class="contractText" x="14" y="38">問い: 今どの工程で、誰が何をしているか？</text>
      <text class="contractText" x="14" y="52">主操作: 実行状況を見る / 質問と回復を同じ流れに置く</text>
    </g>
    <g id="contract-05" transform="translate(2440 126)">
      <rect class="contract" width="500" height="58"/>
      <text class="contractTitle" x="14" y="20">Work Run Trace - 確認待ち の役割</text>
      <text class="contractText" x="14" y="38">問い: この変更案を採用してよいか？</text>
      <text class="contractText" x="14" y="52">主操作: 同じ画面内で採用する / 差し戻し理由は例外時だけ入力</text>
    </g>
  </g>

  <g id="flow-arrows">
    <line class="line" x1="556" y1="405" x2="652" y2="405" marker-end="url(#arrow)"/>
    <text class="arrowLabel" x="574" y="390">セットアップ開始</text>
    <line class="line" x1="1152" y1="405" x2="1248" y2="405" marker-end="url(#arrow)"/>
    <text class="arrowLabel" x="1184" y="390">接続成功</text>
    <line class="line" x1="1748" y1="405" x2="1844" y2="405" marker-end="url(#arrow)"/>
    <text class="arrowLabel" x="1784" y="390">依頼作成</text>
    <line class="line" x1="2344" y1="405" x2="2440" y2="405" marker-end="url(#arrow)"/>
    <text class="arrowLabel" x="2358" y="390">変更案完成</text>
  </g>

  <g id="screen-01-empty-work-home" transform="translate(56 210)">
    <rect class="screen" width="500" height="390"/>
    <rect class="shell" x="0" y="0" width="86" height="390" rx="8"/>
    <text class="brand" x="16" y="32">Nagare</text>
    <rect class="button" x="12" y="64" width="62" height="24"/>
    <text class="buttonText" x="26" y="80">ワーク</text>
    <text class="nav" x="18" y="116">プロジェクト</text>
    <text class="nav" x="18" y="148">知識</text>
    <text class="nav" x="18" y="180">エージェント</text>
    <text class="nav" x="18" y="212">設定</text>
    <rect class="panel" x="106" y="24" width="370" height="52"/>
    <text class="h" x="124" y="48">ワーク</text>
    <text class="small" x="124" y="66">依頼、実行、レビュー、完了までをここから始める</text>
    <rect class="panelStrong" x="106" y="102" width="370" height="162"/>
    <text class="h" x="134" y="136">まだワークがありません</text>
    <text class="body" x="134" y="164">最初の依頼を流すには、作業場所と接続だけ確認します。</text>
    <text class="body" x="134" y="186">担当AI、作業分類、確認条件は初回構成として自動作成されます。</text>
    <rect class="button" x="134" y="214" width="146" height="34"/>
    <text class="buttonText" x="160" y="236">セットアップを始める</text>
    <rect class="buttonLight" x="292" y="214" width="120" height="34"/>
    <text class="buttonTextDark" x="318" y="236">既存Projectを開く</text>
    <rect class="panel" x="106" y="286" width="370" height="78"/>
    <text class="label" x="124" y="308">READINESS</text>
    <circle cx="132" cy="330" r="5" fill="#fff" stroke="#222"/>
    <text class="small" x="146" y="334">Project 未設定</text>
    <circle cx="242" cy="330" r="5" fill="#fff" stroke="#222"/>
    <text class="small" x="256" y="334">接続 0</text>
    <circle cx="342" cy="330" r="5" fill="#fff" stroke="#222"/>
    <text class="small" x="356" y="334">Work 0</text>
    <text class="small" x="124" y="354">詳細設定やSkill/MCP管理は、最初の依頼後に開ける。</text>
  </g>

  <g id="screen-02-project-runtime-setup" transform="translate(652 210)">
    <rect class="screen" width="500" height="390"/>
    <rect class="shell" x="0" y="0" width="86" height="390" rx="8"/>
    <text class="brand" x="16" y="32">Nagare</text>
    <rect class="button" x="12" y="64" width="62" height="24"/>
    <text class="buttonText" x="26" y="80">ワーク</text>
    <rect class="panel" x="106" y="26" width="370" height="338"/>
    <text class="h" x="126" y="54">初回セットアップ</text>
    <text class="small" x="126" y="74">作業場所と検出済み接続だけ確認する</text>
    <line class="softLine" x1="126" y1="92" x2="454" y2="92"/>
    <circle cx="142" cy="118" r="10" fill="#222"/>
    <text class="buttonText" x="139" y="122">1</text>
    <line class="line" x1="154" y1="118" x2="232" y2="118"/>
    <circle cx="244" cy="118" r="10" fill="#222"/>
    <text class="buttonText" x="241" y="122">2</text>
    <line class="dash" x1="256" y1="118" x2="334" y2="118"/>
    <circle cx="346" cy="118" r="10" fill="#fff" stroke="#222"/>
    <text class="buttonTextDark" x="343" y="122">3</text>
    <text class="small" x="126" y="146">Project</text>
    <rect class="input" x="126" y="154" width="326" height="30"/>
    <text class="body" x="138" y="174">nagare / C:\workspace\nagare</text>
    <text class="small" x="126" y="202">検出済み接続</text>
    <rect class="panelStrong" x="126" y="210" width="326" height="48"/>
    <text class="h2" x="144" y="232">実行環境</text>
    <text class="small" x="144" y="248">接続テスト成功 / 既定設定を使用</text>
    <rect class="panel" x="126" y="270" width="326" height="42"/>
    <text class="label" x="142" y="290">自動作成されるもの</text>
    <text class="small" x="142" y="304">汎用設定、担当AI、初回ルート</text>
    <rect class="buttonLight" x="126" y="326" width="82" height="28"/>
    <text class="buttonTextDark" x="150" y="344">戻る</text>
    <rect class="button" x="272" y="326" width="180" height="28"/>
    <text class="buttonText" x="306" y="344">接続してワークへ進む</text>
    <g transform="translate(330 186)">
      <rect class="panel" width="122" height="18"/>
      <text class="small" x="8" y="13">失敗時: 診断を開く</text>
    </g>
  </g>

  <g id="screen-03-work-request-composer" transform="translate(1248 210)">
    <rect class="screen" width="500" height="390"/>
    <rect class="shell" x="0" y="0" width="86" height="390" rx="8"/>
    <text class="brand" x="16" y="32">Nagare</text>
    <rect class="button" x="12" y="64" width="62" height="24"/>
    <text class="buttonText" x="26" y="80">ワーク</text>
    <text class="nav" x="18" y="116">プロジェクト</text>
    <text class="nav" x="18" y="148">知識</text>
    <text class="nav" x="18" y="180">エージェント</text>
    <text class="nav" x="18" y="212">設定</text>
    <rect class="panel" x="106" y="24" width="370" height="52"/>
    <text class="h" x="124" y="48">新しい依頼</text>
    <text class="small" x="124" y="66">依頼文だけを必須にし、範囲と完了条件は推定する</text>
    <text class="label" x="106" y="102">依頼内容</text>
    <rect class="input" x="106" y="112" width="370" height="106"/>
    <text class="body" x="124" y="140">README のセットアップ手順を更新して</text>
    <text class="small" x="124" y="164">docs/setup.md の変更を README に反映。</text>
    <text class="small" x="124" y="184">既存説明と重複しないように整理。</text>
    <rect class="panel" x="106" y="234" width="178" height="76"/>
    <text class="label" x="122" y="254">継承された文脈</text>
    <text class="small" x="122" y="272">Project: nagare</text>
    <text class="small" x="122" y="288">実行環境: 接続済み</text>
    <text class="small" x="122" y="304">作業分類: 汎用</text>
    <rect class="panel" x="298" y="234" width="178" height="76"/>
    <text class="label" x="314" y="254">推定された確認</text>
    <text class="small" x="314" y="272">範囲: README / docs</text>
    <text class="small" x="314" y="288">条件: 手順反映、重複なし</text>
    <text class="small" x="314" y="304">確認: 最終確認あり</text>
    <rect class="chip" x="106" y="322" width="154" height="24"/>
    <text class="small" x="120" y="338">広すぎる範囲なら警告</text>
    <rect class="buttonLight" x="276" y="322" width="74" height="28"/>
    <text class="buttonTextDark" x="298" y="340">戻る</text>
    <rect class="button" x="360" y="322" width="116" height="28"/>
    <text class="buttonText" x="388" y="340">依頼を作成</text>
  </g>

  <g id="screen-04-work-run-trace" transform="translate(1844 210)">
    <rect class="screen" width="500" height="390"/>
    <rect class="shell" x="0" y="0" width="86" height="390" rx="8"/>
    <text class="brand" x="16" y="32">Nagare</text>
    <rect class="button" x="12" y="64" width="62" height="24"/>
    <text class="buttonText" x="26" y="80">ワーク</text>
    <text class="nav" x="18" y="116">プロジェクト</text>
    <text class="nav" x="18" y="148">知識</text>
    <text class="nav" x="18" y="180">エージェント</text>
    <text class="nav" x="18" y="212">設定</text>
    <rect class="panel" x="106" y="20" width="370" height="58"/>
    <text class="h" x="124" y="44">README 更新</text>
    <rect class="chipDark" x="320" y="30" width="72" height="20"/>
    <text class="buttonText" x="338" y="44">処理中</text>
    <text class="small" x="124" y="64">現在: 担当AIが変更案を作成中</text>
    <rect class="panelStrong" x="106" y="94" width="370" height="62"/>
    <text class="label" x="124" y="116">現在の工程</text>
    <text class="body" x="124" y="136">担当AIが README 変更案を作成中</text>
    <text class="small" x="124" y="150">次の予想: 確認担当が条件を確認</text>
    <g id="timeline" transform="translate(106 174)">
      <line class="line" x1="22" y1="16" x2="22" y2="154"/>
      <circle cx="22" cy="18" r="7" fill="#222"/>
      <text class="label" x="42" y="22">01 依頼作成</text>
      <text class="small" x="42" y="38">User / done</text>
      <circle cx="22" cy="62" r="7" fill="#222"/>
      <text class="label" x="42" y="66">02 作業準備</text>
      <text class="small" x="42" y="82">担当AIを自動選択</text>
      <circle cx="22" cy="106" r="7" fill="#fff" stroke="#222" stroke-width="2"/>
      <text class="label" x="42" y="110">03 担当AIが作業中</text>
      <text class="small" x="42" y="126">入力、出力、証跡を構造化して保存</text>
      <circle cx="22" cy="150" r="7" fill="#fff" stroke="#777"/>
      <text class="label" x="42" y="154">04 確認 / 検証</text>
    </g>
    <rect class="panel" x="308" y="174" width="168" height="104"/>
    <text class="label" x="322" y="194">証跡プレビュー</text>
    <text class="small" x="322" y="214">依頼: README更新</text>
    <text class="small" x="322" y="232">途中出力: 変更案</text>
    <text class="small" x="322" y="250">生ログは詳細へ</text>
    <rect class="panel" x="106" y="320" width="218" height="34"/>
    <text class="small" x="122" y="340">質問が出たらここに回答欄を表示</text>
    <rect class="buttonLight" x="338" y="320" width="62" height="28"/>
    <text class="buttonTextDark" x="354" y="338">停止</text>
    <rect class="button" x="410" y="320" width="66" height="28"/>
    <text class="buttonText" x="426" y="338">詳細</text>
  </g>

  <g id="screen-05-work-run-trace-review-ready" transform="translate(2440 210)">
    <rect class="screen" width="500" height="390"/>
    <rect class="shell" x="0" y="0" width="86" height="390" rx="8"/>
    <text class="brand" x="16" y="32">Nagare</text>
    <rect class="button" x="12" y="64" width="62" height="24"/>
    <text class="buttonText" x="26" y="80">ワーク</text>
    <text class="nav" x="18" y="116">プロジェクト</text>
    <text class="nav" x="18" y="148">知識</text>
    <text class="nav" x="18" y="180">エージェント</text>
    <text class="nav" x="18" y="212">設定</text>
