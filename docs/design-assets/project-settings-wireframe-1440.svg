      <rect class="line" x="0" y="0" width="580" height="452" rx="8"/>
      <text class="text h2" x="28" y="36">プロジェクト用の知識ファイル</text>
      <text class="muted small" x="28" y="62">このプロジェクトだけでAIに渡すファイルを登録します。</text>
      <rect class="soft" x="28" y="88" width="136" height="36" rx="7"/>
      <text class="text small bold" x="53" y="111">ファイルを登録</text>

      <g transform="translate(28 148)">
        <rect class="soft" x="0" y="0" width="524" height="54" rx="7"/>
        <text class="text body bold" x="18" y="23">README.md</text>
        <text class="muted small" x="220" y="23">/README.md</text>
        <text class="muted tiny" x="18" y="42">更新: 今日</text>
        <rect class="chip" x="448" y="13" width="56" height="28" rx="7"/>
        <text class="text tiny bold" x="465" y="32">削除</text>

        <rect class="surface" x="0" y="66" width="524" height="54" rx="7"/>
        <rect class="line" x="0" y="66" width="524" height="54" rx="7"/>
        <text class="text body bold" x="18" y="89">docs/setup.md</text>
        <text class="muted small" x="220" y="89">/docs/setup.md</text>
        <text class="muted tiny" x="18" y="108">更新: 2日前</text>
        <rect class="chip" x="448" y="79" width="56" height="28" rx="7"/>
        <text class="text tiny bold" x="465" y="98">削除</text>

        <rect class="surface" x="0" y="132" width="524" height="54" rx="7"/>
        <rect class="line" x="0" y="132" width="524" height="54" rx="7"/>
        <text class="text body bold" x="18" y="155">docs/design.md</text>
        <text class="muted small" x="220" y="155">/docs/design.md</text>
        <text class="muted tiny" x="18" y="174">更新: 5日前</text>
        <rect class="chip" x="448" y="145" width="56" height="28" rx="7"/>
        <text class="text tiny bold" x="465" y="164">削除</text>

        <rect class="surface" x="0" y="198" width="524" height="54" rx="7"/>
        <rect class="line" x="0" y="198" width="524" height="54" rx="7"/>
        <text class="text body bold" x="18" y="221">docs/rubric.md</text>
        <text class="muted small" x="220" y="221">/docs/rubric.md</text>
        <text class="muted tiny" x="18" y="240">更新: 1週間前</text>
        <rect class="chip" x="448" y="211" width="56" height="28" rx="7"/>
        <text class="text tiny bold" x="465" y="230">削除</text>
      </g>
    </g>

    <g id="agent-list" transform="translate(608 296)">
      <rect class="surface" x="0" y="0" width="580" height="452" rx="8"/>
      <rect class="line" x="0" y="0" width="580" height="452" rx="8"/>
      <text class="text h2" x="28" y="36">参加エージェント</text>
      <text class="muted small" x="28" y="62">このプロジェクトで使うエージェントを追加・削除します。</text>
      <rect class="soft" x="28" y="88" width="156" height="36" rx="7"/>
      <text class="text small bold" x="57" y="111">エージェントを追加</text>

      <g transform="translate(28 148)">
        <rect class="soft" x="0" y="0" width="524" height="54" rx="7"/>
        <text class="text body bold" x="18" y="23">Default Organizer</text>
        <text class="muted small" x="250" y="23">オーガナイザー</text>
        <text class="muted tiny" x="18" y="42">依頼整理と次工程判断</text>
        <rect class="chip" x="448" y="13" width="56" height="28" rx="7"/>
        <text class="text tiny bold" x="465" y="32">削除</text>

        <rect class="surface" x="0" y="66" width="524" height="54" rx="7"/>
        <rect class="line" x="0" y="66" width="524" height="54" rx="7"/>
        <text class="text body bold" x="18" y="89">Default Worker</text>
        <text class="muted small" x="250" y="89">ワーカー</text>
        <text class="muted tiny" x="18" y="108">成果物と変更案を作成</text>
        <rect class="chip" x="448" y="79" width="56" height="28" rx="7"/>
        <text class="text tiny bold" x="465" y="98">削除</text>

        <rect class="surface" x="0" y="132" width="524" height="54" rx="7"/>
        <rect class="line" x="0" y="132" width="524" height="54" rx="7"/>
        <text class="text body bold" x="18" y="155">Default Reviewer</text>
        <text class="muted small" x="250" y="155">レビュアー</text>
        <text class="muted tiny" x="18" y="174">確認条件と根拠を確認</text>
        <rect class="chip" x="448" y="145" width="56" height="28" rx="7"/>
        <text class="text tiny bold" x="465" y="164">削除</text>

        <rect class="surface" x="0" y="198" width="524" height="54" rx="7"/>
        <rect class="line" x="0" y="198" width="524" height="54" rx="7"/>
        <text class="text body bold" x="18" y="221">Research Helper</text>
        <text class="muted small" x="250" y="221">ワーカー</text>
        <text class="muted tiny" x="18" y="240">調査と要約</text>
        <rect class="chip" x="448" y="211" width="56" height="28" rx="7"/>
        <text class="text tiny bold" x="465" y="230">削除</text>
      </g>
    </g>

    <g id="footer" transform="translate(0 788)">
      <rect class="surface" x="0" y="0" width="1188" height="92" rx="8"/>
      <rect class="line" x="0" y="0" width="1188" height="92" rx="8"/>
      <text class="text body bold" x="28" y="36">一覧に戻る</text>
      <text class="muted small" x="28" y="60">追加や削除は各一覧の操作で行います。プロジェクト一覧へ戻れます。</text>
      <rect class="soft" x="1010" y="24" width="154" height="42" rx="7"/>
      <text class="text small bold" x="1045" y="50">一覧に戻る</text>
    </g>
  </g>
</svg>
