<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
  <title id="title">Nagare Work Run Trace 質問あり状態</title>
  <desc id="desc">Nagare のワーク詳細で、タスク状況、必要なユーザー回答、トレース記録を一画面にまとめた質問あり状態の白黒ワイヤーフレーム。</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f7; }
      .sidebar { fill: #f0f0f0; stroke: #c9c9c9; stroke-width: 1; }
      .surface { fill: #fff; stroke: #d1d1d1; stroke-width: 1; }
      .soft { fill: #fafafa; stroke: #dadada; stroke-width: 1; }
      .strong { fill: #f1f1f1; stroke: #222; stroke-width: 1.3; }
      .selected { fill: #efefef; stroke: #222; stroke-width: 1.2; }
      .button { fill: #222; stroke: #222; stroke-width: 1; }
      .buttonLight { fill: #fff; stroke: #555; stroke-width: 1; }
      .chip { fill: #eee; stroke: #777; stroke-width: 1; }
      .chipDark { fill: #222; stroke: #222; stroke-width: 1; }
      .line { stroke: #d0d0d0; stroke-width: 1; fill: none; }
      .titleText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .heroText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .section { font: 700 16px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .body { font: 400 14px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .small { font: 400 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #555; letter-spacing: 0; }
      .tiny { font: 400 11px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #666; letter-spacing: 0; }
      .label { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .nav { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .navInv { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonText { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1180"/>

  <g id="app-shell">
    <rect class="sidebar" x="0" y="0" width="212" height="1180"/>
    <text class="titleText" x="28" y="46">Nagare</text>
    <text class="tiny" x="28" y="68">作業を進める画面</text>
    <rect class="chipDark" x="20" y="112" width="172" height="36" rx="7"/>
    <text class="navInv" x="42" y="135">ワーク</text>
    <text class="nav" x="42" y="184">プロジェクト</text>
    <text class="nav" x="42" y="226">知識</text>
    <text class="nav" x="42" y="268">エージェント</text>
    <text class="nav" x="42" y="310">設定</text>
    <line class="line" x1="20" y1="356" x2="192" y2="356"/>
    <text class="label" x="28" y="388">選択中のワーク</text>
    <text class="small" x="28" y="414">README の手順更新</text>
  </g>

  <g id="page-header">
    <rect class="surface" x="240" y="24" width="1172" height="72" rx="8"/>
    <text class="titleText" x="264" y="56">ワーク詳細: README のセットアップ手順を更新</text>
    <text class="small" x="264" y="78">進行詳細 / 依頼: docs/setup.md の変更を README に反映して</text>
    <rect class="chip" x="1174" y="42" width="102" height="24" rx="12"/>
    <text class="label" x="1206" y="59">質問あり</text>
    <rect class="buttonLight" x="1292" y="36" width="72" height="32" rx="6"/>
    <text class="buttonTextDark" x="1314" y="57">停止</text>
  </g>

  <g id="task-status">
    <rect class="strong" x="240" y="116" width="1172" height="248" rx="8"/>
    <text class="label" x="268" y="148">タスクの状況</text>
    <text class="heroText" x="268" y="180">AIから質問があります。</text>
    <text class="body" x="268" y="210">回答すると作業を再開できます。</text>
    <text class="small" x="268" y="236">不足している判断は1つです。</text>
    <text class="small" x="268" y="256">現在の担当: オーガナイザー</text>
    <text class="small" x="268" y="276">方針確認のため一時停止中です。</text>
    <rect class="buttonLight" x="268" y="304" width="118" height="36" rx="7"/>
    <text class="buttonTextDark" x="300" y="327">一覧に戻る</text>

    <rect class="surface" x="640" y="136" width="724" height="154" rx="7"/>
    <text class="label" x="658" y="160">依頼文</text>
    <text class="small" x="658" y="184">
      <tspan x="658" dy="0">docs/setup.md に追加したセットアップ手順を README に反映してください。</tspan>
      <tspan x="658" dy="18">既存のREADMEには古い導入説明が残っているので、読者が最初に見るべき手順が分かるように整理してください。</tspan>
      <tspan x="658" dy="18">変更案を出す前に、手順反映、重複説明なし、採用前レビュー表示の3点を確認してください。</tspan>
      <tspan x="658" dy="18">依頼文が長い場合でも、ここで読み返してから回答できます。</tspan>
    </text>
  </g>

  <g id="user-action">
    <rect class="surface" x="240" y="388" width="1172" height="334" rx="8"/>
    <text class="section" x="264" y="424">ユーザー対応</text>
    <text class="small" x="264" y="446">この質問に答えると、止まっている整理ステップだけが再開します。</text>

    <g id="question-card" transform="translate(264 476)">
      <rect class="selected" x="0" y="0" width="1124" height="112" rx="7"/>
      <text class="label" x="18" y="28">質問</text>
      <text class="body" x="82" y="28">README では `セットアップ` 節を置き換えますか、それとも既存節の下に追記しますか。</text>
      <text class="small" x="18" y="58">理由: 既存の導入文が古く、追記すると同じ意味の説明が二重になる可能性があります。</text>
      <rect class="surface" x="18" y="74" width="332" height="24" rx="6"/>
      <text class="label" x="34" y="91">推奨: 既存節を置き換える</text>
      <rect class="chipDark" x="1018" y="72" width="78" height="26" rx="13"/>
      <text class="buttonText" x="1038" y="90">質問中</text>
    </g>

    <g id="answer-card" transform="translate(264 612)">
      <rect class="soft" x="0" y="0" width="850" height="54" rx="7"/>
      <text class="label" x="18" y="24">回答欄</text>
      <text class="small" x="86" y="24">既存のセットアップ節を置き換えてください。必要なら古い説明は削除候補として示してください。</text>
      <text class="tiny" x="86" y="43">長い回答が必要な場合は複数行入力に広がります。</text>
      <rect class="button" x="876" y="9" width="154" height="36" rx="7"/>
      <text class="buttonText" x="908" y="32">回答して再開</text>
    </g>
  </g>

  <g id="trace-record">
    <rect class="surface" x="240" y="746" width="1172" height="376" rx="8"/>
    <text class="section" x="264" y="782">トレース記録</text>
    <text class="small" x="264" y="804">質問の背景を詳しく追いたい場合は、ここで入力、判断、次の処理を確認できます。</text>

    <g id="trace" transform="translate(264 834)">
      <rect class="soft" x="0" y="0" width="1124" height="118" rx="7"/>
      <text class="label" x="18" y="28">1. 整理</text>
      <text class="body" x="120" y="28">オーガナイザー</text>
      <rect class="surface" x="18" y="48" width="520" height="50" rx="6"/>
      <text class="label" x="34" y="69">入力</text>
      <text class="small" x="82" y="69">依頼文、README現状、docs/setup.md の変更、確認条件3件。</text>
      <text class="small" x="82" y="88">既存節が古いため、変更方針の確認が必要。</text>
      <rect class="surface" x="560" y="48" width="546" height="50" rx="6"/>
      <text class="label" x="576" y="69">判断</text>
      <text class="small" x="624" y="69">置き換え/追記の方針が未確定。ユーザー回答を待っています。</text>
      <text class="small" x="624" y="88">回答後、ワーカーへ README 変更案作成を依頼します。</text>
    </g>

    <g id="next" transform="translate(264 976)">
      <rect class="soft" x="0" y="0" width="1124" height="108" rx="7"/>
      <text class="label" x="18" y="28">次に進む処理</text>
      <text class="small" x="18" y="58">回答が入ると、ワーカーが README.md の変更案、削除候補、差分要約を作ります。</text>
      <text class="small" x="18" y="82">その後、レビュアーが setup.md との反映漏れ、重複説明、採用前レビュー表示を確認します。</text>
    </g>
  </g>
</svg>
