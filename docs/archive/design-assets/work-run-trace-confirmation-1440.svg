<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1180" viewBox="0 0 1440 1180" role="img" aria-labelledby="title desc">
  <title id="title">Nagare Work Run Trace 確認待ち状態</title>
  <desc id="desc">Nagare のワーク詳細で、タスク状況、必要なユーザー対応、トレース記録を一画面にまとめた確認待ち状態の白黒ワイヤーフレーム。</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f7; }
      .sidebar { fill: #f0f0f0; stroke: #c9c9c9; stroke-width: 1; }
      .surface { fill: #fff; stroke: #d1d1d1; stroke-width: 1; }
      .soft { fill: #fafafa; stroke: #dadada; stroke-width: 1; }
      .strong { fill: #f1f1f1; stroke: #222; stroke-width: 1.3; }
      .selected { fill: #efefef; stroke: #222; stroke-width: 1.2; }
      .button { fill: #222; stroke: #222; stroke-width: 1; }
      .buttonLight { fill: #fff; stroke: #555; stroke-width: 1; }
      .chip { fill: #eee; stroke: #777; stroke-width: 1; }
      .chipDark { fill: #222; stroke: #222; stroke-width: 1; }
      .line { stroke: #d0d0d0; stroke-width: 1; fill: none; }
      .titleText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .heroText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .section { font: 700 16px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .body { font: 400 14px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .small { font: 400 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #555; letter-spacing: 0; }
      .tiny { font: 400 11px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #666; letter-spacing: 0; }
      .label { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .nav { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .navInv { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonText { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1180"/>

  <g id="app-shell">
    <rect class="sidebar" x="0" y="0" width="212" height="1180"/>
    <text class="titleText" x="28" y="46">Nagare</text>
    <text class="tiny" x="28" y="68">作業を進める画面</text>
    <rect class="chipDark" x="20" y="112" width="172" height="36" rx="7"/>
    <text class="navInv" x="42" y="135">ワーク</text>
    <text class="nav" x="42" y="184">プロジェクト</text>
    <text class="nav" x="42" y="226">知識</text>
    <text class="nav" x="42" y="268">エージェント</text>
    <text class="nav" x="42" y="310">設定</text>
    <line class="line" x1="20" y1="356" x2="192" y2="356"/>
    <text class="label" x="28" y="388">選択中のワーク</text>
    <text class="small" x="28" y="414">README の手順更新</text>
  </g>

  <g id="page-header">
    <rect class="surface" x="240" y="24" width="1172" height="72" rx="8"/>
    <text class="titleText" x="264" y="56">ワーク詳細: README のセットアップ手順を更新</text>
    <text class="small" x="264" y="78">進行詳細 / 依頼: docs/setup.md の変更を README に反映して</text>
    <rect class="chip" x="1168" y="42" width="108" height="24" rx="12"/>
    <text class="label" x="1196" y="59">確認待ち</text>
    <rect class="buttonLight" x="1292" y="36" width="72" height="32" rx="6"/>
    <text class="buttonTextDark" x="1314" y="57">停止</text>
  </g>

  <g id="task-status">
    <rect class="strong" x="240" y="116" width="1172" height="238" rx="8"/>
    <text class="label" x="268" y="148">タスクの状況</text>
    <text class="heroText" x="268" y="180">変更案ができました。</text>
    <text class="body" x="268" y="210">採用するか確認してください。</text>
    <text class="small" x="268" y="232">レビューは合格済みです。判断に必要な内容をこの下に表示します。</text>
    <rect class="buttonLight" x="268" y="260" width="118" height="36" rx="7"/>
    <text class="buttonTextDark" x="300" y="283">一覧に戻る</text>

    <rect class="surface" x="640" y="136" width="724" height="154" rx="7"/>
    <text class="label" x="658" y="160">依頼文</text>
    <text class="small" x="658" y="184">
      <tspan x="658" dy="0">docs/setup.md に追加したセットアップ手順を README に反映してください。</tspan>
      <tspan x="658" dy="18">読者が最初に見るべき手順が分かるように整理し、重複する説明が残らないようにしてください。</tspan>
      <tspan x="658" dy="18">変更案を出す前に、手順反映、重複説明なし、採用前レビュー表示の3点を確認してください。</tspan>
      <tspan x="658" dy="18">長い依頼文でも、このブロックが複数行で受け止め、判断前に依頼の意図を読み返せるようにします。</tspan>
    </text>
  </g>

  <g id="user-action">
    <rect class="surface" x="240" y="378" width="1172" height="360" rx="8"/>
    <text class="section" x="264" y="414">ユーザー対応</text>
    <text class="small" x="264" y="436">この変更案を採用するか、差し戻すかを選びます。必要な確認内容はここにまとめます。</text>

    <g id="result-preview" transform="translate(264 466)">
      <rect class="selected" x="0" y="0" width="690" height="188" rx="7"/>
      <text class="label" x="18" y="28">結果</text>
      <text class="body" x="18" y="56">README.md の `セットアップ` 節を差し替える変更案</text>
      <text class="small" x="18" y="86">作業フォルダ選択、ランタイム設定、デフォルトプロジェクト作成の順に本文を整理します。</text>
      <text class="small" x="18" y="110">古い導入説明と同じ意味の段落は削除候補に入り、必要な確認方法だけを簡潔に残します。</text>
      <text class="small" x="18" y="134">採用すると README.md に変更案が反映され、ワークは完了になります。</text>
      <text class="small" x="18" y="158">差し戻す場合は、修正してほしい点だけを短く書けば再作成に戻ります。</text>
    </g>

    <g id="review-checks" transform="translate(978 466)">
      <rect class="soft" x="0" y="0" width="410" height="188" rx="7"/>
      <text class="label" x="18" y="28">レビュー結果</text>
      <rect class="chipDark" x="310" y="14" width="72" height="26" rx="13"/>
      <text class="buttonText" x="331" y="32">合格</text>
      <rect class="surface" x="18" y="50" width="374" height="32" rx="6"/>
      <text class="small" x="34" y="71">手順反映: docs/setup.md の新手順を README に反映</text>
      <rect class="surface" x="18" y="90" width="374" height="32" rx="6"/>
      <text class="small" x="34" y="111">重複説明なし: 古い導入説明を削除候補として整理</text>
      <rect class="surface" x="18" y="130" width="374" height="32" rx="6"/>
      <text class="small" x="34" y="151">採用前レビュー: 確認条件に照合済み</text>
    </g>

    <rect class="button" x="264" y="678" width="130" height="36" rx="7"/>
    <text class="buttonText" x="304" y="701">採用する</text>
    <rect class="buttonLight" x="410" y="678" width="126" height="36" rx="7"/>
    <text class="buttonTextDark" x="444" y="701">差し戻す</text>
    <rect class="buttonLight" x="552" y="678" width="118" height="36" rx="7"/>
    <text class="buttonTextDark" x="584" y="701">一覧に戻る</text>
  </g>

  <g id="trace-record">
    <rect class="surface" x="240" y="762" width="1172" height="360" rx="8"/>
    <text class="section" x="264" y="798">トレース記録</text>
    <text class="small" x="264" y="820">判断が終わったあとでも、どの担当が何を作り、何を確認したかを追えます。</text>

    <g id="trace-worker" transform="translate(264 850)">
      <rect class="soft" x="0" y="0" width="1124" height="112" rx="7"/>
      <text class="label" x="18" y="28">2. 変更案作成</text>
      <text class="body" x="142" y="28">ワーカー</text>
      <rect class="surface" x="18" y="48" width="520" height="44" rx="6"/>
      <text class="label" x="34" y="68">入力</text>
      <text class="small" x="82" y="68">依頼文、README現状、docs/setup.md の追加手順、確認条件3件。</text>
      <text class="small" x="82" y="86">既存節の古い導入説明を削除候補として扱う方針。</text>
      <rect class="surface" x="560" y="48" width="546" height="44" rx="6"/>
      <text class="label" x="576" y="68">出力</text>
      <text class="small" x="624" y="68">README の差し替え本文、削除候補、差分要約、採用時の反映先。</text>
      <text class="small" x="624" y="86">次工程としてレビューへ渡しました。</text>
    </g>

    <g id="trace-reviewer" transform="translate(264 982)">
      <rect class="soft" x="0" y="0" width="1124" height="112" rx="7"/>
      <text class="label" x="18" y="28">3. 採用前確認</text>
      <text class="body" x="142" y="28">レビュアー</text>
      <rect class="surface" x="18" y="48" width="520" height="44" rx="6"/>
      <text class="label" x="34" y="68">入力</text>
      <text class="small" x="82" y="68">ワーカーの変更案、削除候補、確認条件、docs/setup.md の原文。</text>
      <text class="small" x="82" y="86">採用前にユーザーへ見せるべき注意点。</text>
      <rect class="surface" x="560" y="48" width="546" height="44" rx="6"/>
      <text class="label" x="576" y="68">結果</text>
      <text class="small" x="624" y="68">手順反映、重複説明なし、採用前レビュー表示を確認。判定は合格。</text>
      <text class="small" x="624" y="86">この確認結果を上のユーザー対応に表示しました。</text>
    </g>
  </g>
</svg>
