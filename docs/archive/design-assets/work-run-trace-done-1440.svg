<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nagare Work Run Trace 完了状態</title>
  <desc id="desc">Nagare のワーク詳細で、結果採用後の完了状態を示す白黒ワイヤーフレーム。</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f7; }
      .sidebar { fill: #f0f0f0; stroke: #c9c9c9; stroke-width: 1; }
      .surface { fill: #fff; stroke: #d1d1d1; stroke-width: 1; }
      .soft { fill: #fafafa; stroke: #dadada; stroke-width: 1; }
      .strong { fill: #f1f1f1; stroke: #222; stroke-width: 1.3; }
      .selected { fill: #efefef; stroke: #222; stroke-width: 1.2; }
      .button { fill: #222; stroke: #222; stroke-width: 1; }
      .buttonLight { fill: #fff; stroke: #555; stroke-width: 1; }
      .chip { fill: #eee; stroke: #777; stroke-width: 1; }
      .chipDark { fill: #222; stroke: #222; stroke-width: 1; }
      .line { stroke: #d0d0d0; stroke-width: 1; fill: none; }
      .titleText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .heroText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .section { font: 700 16px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .body { font: 400 14px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .small { font: 400 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #555; letter-spacing: 0; }
      .tiny { font: 400 11px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #666; letter-spacing: 0; }
      .label { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .nav { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .navInv { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonText { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1024"/>

  <g id="app-shell">
    <rect class="sidebar" x="0" y="0" width="212" height="1024"/>
    <text class="titleText" x="28" y="46">Nagare</text>
    <text class="tiny" x="28" y="68">作業を進める画面</text>
    <rect class="chipDark" x="20" y="112" width="172" height="36" rx="7"/>
    <text class="navInv" x="42" y="135">ワーク</text>
    <text class="nav" x="42" y="184">プロジェクト</text>
    <text class="nav" x="42" y="226">知識</text>
    <text class="nav" x="42" y="268">エージェント</text>
    <text class="nav" x="42" y="310">設定</text>
    <line class="line" x1="20" y1="356" x2="192" y2="356"/>
    <text class="label" x="28" y="388">選択中のワーク</text>
    <text class="small" x="28" y="414">README の手順更新</text>
  </g>

  <g id="page-header">
    <rect class="surface" x="240" y="24" width="1172" height="72" rx="8"/>
    <text class="titleText" x="264" y="56">ワーク詳細: README のセットアップ手順を更新</text>
    <text class="small" x="264" y="78">進行詳細 / 依頼: docs/setup.md の変更を README に反映して</text>
    <rect class="chip" x="1190" y="42" width="86" height="24" rx="12"/>
    <text class="label" x="1218" y="59">完了</text>
    <rect class="buttonLight" x="1292" y="36" width="72" height="32" rx="6"/>
    <text class="buttonTextDark" x="1314" y="57">閉じる</text>
  </g>

  <g id="task-status">
    <rect class="strong" x="240" y="116" width="1172" height="228" rx="8"/>
    <text class="label" x="268" y="148">タスクの状況</text>
    <text class="heroText" x="268" y="180">依頼は完了しました。</text>
    <text class="body" x="268" y="210">README.md に反映済みです。</text>
    <text class="small" x="268" y="228">追加の操作は不要です。</text>
    <rect class="button" x="268" y="236" width="126" height="36" rx="7"/>
    <text class="buttonText" x="298" y="259">完了を閉じる</text>
    <rect class="buttonLight" x="412" y="236" width="118" height="36" rx="7"/>
    <text class="buttonTextDark" x="444" y="259">一覧に戻る</text>

    <rect class="surface" x="640" y="136" width="724" height="74" rx="7"/>
    <text class="label" x="658" y="160">依頼文</text>
    <text class="small" x="658" y="184">docs/setup.md の変更を README に反映して。既存の説明と矛盾しないようにしてほしい。</text>
    <rect class="surface" x="640" y="222" width="724" height="78" rx="7"/>
    <text class="label" x="658" y="246">採用済みの結果</text>
    <text class="body" x="658" y="270">README.md のセットアップ節を更新</text>
    <text class="small" x="658" y="290">作業フォルダ、ランタイム設定、デフォルトプロジェクト作成の順に整理しました。</text>
  </g>

  <g id="done-summary">
    <rect class="surface" x="240" y="368" width="1172" height="592" rx="8"/>
    <text class="section" x="264" y="404">完了内容</text>
    <text class="small" x="264" y="426">採用済みの結果と、どこに反映されたかを確認します。</text>

    <g id="applied-result" transform="translate(264 458)">
      <rect class="selected" x="0" y="0" width="1124" height="144" rx="7"/>
      <text class="label" x="18" y="28">反映先</text>
      <text class="body" x="120" y="28">README.md</text>
      <rect class="chipDark" x="1030" y="14" width="66" height="26" rx="13"/>
      <text class="buttonText" x="1048" y="32">採用済</text>
      <rect class="surface" x="18" y="52" width="1080" height="34" rx="6"/>
      <text class="label" x="34" y="73">変更</text>
      <text class="small" x="120" y="73">セットアップ節を docs/setup.md の手順に合わせて更新しました。</text>
      <rect class="surface" x="18" y="96" width="1080" height="34" rx="6"/>
      <text class="label" x="34" y="117">削除</text>
      <text class="small" x="120" y="117">古い導入説明と重複する説明を削除候補として整理し、採用済み内容から外しました。</text>
    </g>

    <g id="final-checks" transform="translate(264 626)">
      <rect class="soft" x="0" y="0" width="1124" height="128" rx="7"/>
      <text class="label" x="18" y="28">確認済み条件</text>
      <rect class="surface" x="18" y="48" width="350" height="58" rx="6"/>
      <text class="label" x="34" y="70">手順反映</text>
      <text class="small" x="34" y="92">setup.md の新手順を README に反映</text>
      <rect class="surface" x="386" y="48" width="350" height="58" rx="6"/>
      <text class="label" x="402" y="70">重複説明なし</text>
      <text class="small" x="402" y="92">古い説明との二重記載を回避</text>
      <rect class="surface" x="754" y="48" width="344" height="58" rx="6"/>
      <text class="label" x="770" y="70">レビュー済み</text>
      <text class="small" x="770" y="92">採用前にレビュアーが確認</text>
    </g>

    <g id="completed-flow" transform="translate(264 778)">
      <rect class="soft" x="0" y="0" width="1124" height="124" rx="7"/>
      <text class="label" x="18" y="28">完了した流れ</text>
      <text class="small" x="18" y="56">1. オーガナイザーが依頼を README 更新として整理しました。</text>
      <text class="small" x="18" y="80">2. ワーカーが README.md の変更案、削除候補、差分要約を作成しました。</text>
      <text class="small" x="18" y="104">3. レビュアーが確認条件に照合し、ユーザーが同じワーク詳細で採用しました。</text>
    </g>
  </g>
</svg>
