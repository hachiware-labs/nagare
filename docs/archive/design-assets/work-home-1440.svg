<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nagare 通常ワーク画面 実寸ワイヤーフレーム</title>
  <desc id="desc">Nagare の通常ワーク画面を 1440x1024 のデスクトップ密度で示す白黒ワイヤーフレーム。新しい依頼作成と既存ワークの対応要否確認を主目的にする。</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f7; }
      .sidebar { fill: #f0f0f0; stroke: #c9c9c9; stroke-width: 1; }
      .surface { fill: #fff; stroke: #d1d1d1; stroke-width: 1; }
      .soft { fill: #fafafa; stroke: #dadada; stroke-width: 1; }
      .strong { fill: #f1f1f1; stroke: #222; stroke-width: 1.3; }
      .selected { fill: #efefef; stroke: #222; stroke-width: 1.3; }
      .button { fill: #222; stroke: #222; stroke-width: 1; }
      .buttonLight { fill: #fff; stroke: #555; stroke-width: 1; }
      .chip { fill: #eee; stroke: #777; stroke-width: 1; }
      .chipDark { fill: #222; stroke: #222; stroke-width: 1; }
      .iconLine { stroke: currentColor; stroke-width: 1.5; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .line { stroke: #d0d0d0; stroke-width: 1; fill: none; }
      .titleText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .section { font: 700 16px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .body { font: 400 14px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .small { font: 400 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #555; letter-spacing: 0; }
      .tiny { font: 400 11px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #666; letter-spacing: 0; }
      .label { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .nav { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .navInv { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonText { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1024"/>

  <g id="app-shell">
    <rect class="sidebar" x="0" y="0" width="212" height="1024"/>
    <text class="titleText" x="28" y="46">Nagare</text>
    <text class="tiny" x="28" y="68">作業を進める画面</text>
    <rect class="chipDark" x="20" y="112" width="172" height="36" rx="7"/>
    <text class="navInv" x="42" y="135">ワーク</text>
    <text class="nav" x="42" y="184">プロジェクト</text>
    <text class="nav" x="42" y="226">知識</text>
    <text class="nav" x="42" y="268">エージェント</text>
    <text class="nav" x="42" y="310">設定</text>
    <line class="line" x1="20" y1="356" x2="192" y2="356"/>
  </g>

  <g id="page-header">
    <rect class="surface" x="240" y="24" width="1172" height="72" rx="8"/>
    <text class="titleText" x="264" y="56">ワーク</text>
    <text class="small" x="264" y="78">新しい依頼を作成し、対応が必要な作業だけすばやく確認します</text>
  </g>

  <g id="composer">
    <rect class="strong" x="240" y="116" width="1172" height="246" rx="8"/>
    <text class="section" x="264" y="152">新しい依頼</text>
    <text class="small" x="264" y="174">プロジェクトを選び、やりたいことを書きます。</text>
    <rect class="surface" x="264" y="202" width="840" height="92" rx="7"/>
    <text class="body" x="284" y="232">README のセットアップ手順を更新して</text>
    <text class="small" x="284" y="258">docs/setup.md の変更を README に反映。既存説明と重複しないように整理。</text>
    <rect class="button" x="1124" y="202" width="214" height="42" rx="7"/>
    <text class="buttonText" x="1188" y="228">依頼を作成</text>
    <rect class="buttonLight" x="1124" y="258" width="214" height="36" rx="7"/>
    <text class="buttonTextDark" x="1188" y="281">下書き保存</text>
    <rect class="soft" x="264" y="314" width="310" height="30" rx="7"/>
    <text class="small" x="282" y="334">作業プロジェクト: nagare</text>
    <path d="M 548 326 L 554 332 L 560 326" fill="none" stroke="#555" stroke-width="1.4"/>
  </g>

  <g id="work-history">
    <rect class="surface" x="240" y="386" width="1172" height="590" rx="8"/>
    <text class="section" x="264" y="422">ワーク履歴</text>
    <text class="small" x="264" y="444">プロジェクト、ワーク状態、依頼文で絞り込み、必要な作業を開きます。</text>

    <g id="filters" transform="translate(264 468)">
      <rect class="soft" x="0" y="0" width="260" height="32" rx="7"/>
      <text class="small" x="18" y="21">プロジェクト: すべて</text>
      <path d="M 228 13 L 234 19 L 240 13" fill="none" stroke="#555" stroke-width="1.4"/>
      <g id="status-filter" transform="translate(280 0)">
        <rect class="soft" x="0" y="0" width="430" height="32" rx="7"/>
        <rect class="surface" x="14" y="9" width="14" height="14" rx="2"/>
        <path d="M 17 16 L 20 19 L 26 12" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="label" x="36" y="21">要対応</text>
        <rect class="surface" x="150" y="9" width="14" height="14" rx="2"/>
        <path d="M 153 16 L 156 19 L 162 12" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="label" x="172" y="21">処理中</text>
        <rect class="surface" x="286" y="9" width="14" height="14" rx="2"/>
        <path d="M 289 16 L 292 19 L 298 12" fill="none" stroke="#222" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="label" x="308" y="21">完了</text>
      </g>
      <rect class="soft" x="730" y="0" width="350" height="32" rx="7"/>
      <text class="small" x="748" y="21">キーワードで検索</text>
    </g>

    <g id="rows" transform="translate(264 520)">
      <rect class="selected" x="0" y="0" width="1108" height="74" rx="8"/>
      <text class="label" x="18" y="24">README のセットアップ手順を更新</text>
      <text class="small" x="18" y="48">変更案を作成中です。いま操作は不要です。</text>
      <rect class="chip" x="808" y="22" width="132" height="24" rx="12"/>
      <circle cx="824" cy="34" r="6" fill="none" stroke="#555" stroke-width="1.4"/>
      <path d="M 824 30 L 824 34 L 828 36" fill="none" stroke="#555" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="label" x="842" y="39">処理中</text>
      <rect class="buttonLight" x="970" y="20" width="92" height="32" rx="6"/>
      <text class="buttonTextDark" x="996" y="41">詳細</text>

      <rect class="soft" x="0" y="86" width="1108" height="74" rx="8"/>
      <text class="label" x="18" y="110">API エラー時の説明を整理</text>
      <text class="small" x="18" y="134">AIから確認したい項目があります。回答すると作業を再開できます。</text>
      <rect class="chipDark" x="808" y="108" width="132" height="24" rx="12"/>
      <circle cx="824" cy="120" r="6" fill="none" stroke="#fff" stroke-width="1.4"/>
      <text class="buttonText" x="821" y="124">?</text>
      <text class="buttonText" x="842" y="125">要対応・質問</text>
      <rect class="buttonLight" x="970" y="106" width="92" height="32" rx="6"/>
      <text class="buttonTextDark" x="996" y="127">詳細</text>

      <rect class="soft" x="0" y="172" width="1108" height="74" rx="8"/>
      <text class="label" x="18" y="196">CLI テスト手順の追記</text>
      <text class="small" x="18" y="220">変更案ができました。採用するか確認してください。</text>
      <rect class="chipDark" x="808" y="194" width="132" height="24" rx="12"/>
      <circle cx="824" cy="206" r="6" fill="none" stroke="#fff" stroke-width="1.4"/>
      <path d="M 820 206 L 823 209 L 829 203" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="buttonText" x="842" y="211">要対応・確認</text>
      <rect class="buttonLight" x="970" y="192" width="92" height="32" rx="6"/>
      <text class="buttonTextDark" x="996" y="213">詳細</text>

      <rect class="soft" x="0" y="258" width="1108" height="74" rx="8"/>
      <text class="label" x="18" y="282">依存パッケージ更新メモを作成</text>
      <text class="small" x="18" y="306">作業が止まりました。安全な再開方法を選べます。</text>
      <rect class="chipDark" x="808" y="280" width="132" height="24" rx="12"/>
      <circle cx="824" cy="292" r="6" fill="none" stroke="#fff" stroke-width="1.4"/>
      <path d="M 824 288 L 824 293 M 824 296 L 824 296" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
      <text class="buttonText" x="842" y="297">要対応・回復</text>
      <rect class="buttonLight" x="970" y="278" width="92" height="32" rx="6"/>
      <text class="buttonTextDark" x="996" y="299">詳細</text>

      <rect class="soft" x="0" y="344" width="1108" height="74" rx="8"/>
      <text class="label" x="18" y="368">README の日本語見出しを調整</text>
      <text class="small" x="18" y="392">依頼は完了しました。採用済みの内容を確認できます。</text>
      <rect class="chip" x="808" y="366" width="132" height="24" rx="12"/>
      <circle cx="824" cy="378" r="6" fill="none" stroke="#555" stroke-width="1.4"/>
      <path d="M 820 378 L 823 381 L 829 375" fill="none" stroke="#555" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="label" x="842" y="383">完了</text>
      <rect class="buttonLight" x="970" y="364" width="92" height="32" rx="6"/>
      <text class="buttonTextDark" x="996" y="385">詳細</text>

    </g>
  </g>

  <g id="setup-complete-toast">
    <rect class="surface" x="1062" y="116" width="322" height="54" rx="8"/>
    <circle cx="1090" cy="143" r="9" fill="#222"/>
    <path d="M 1085 143 L 1089 147 L 1096 139" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    <text class="label" x="1114" y="139">セットアップが完了しました</text>
    <text class="small" x="1114" y="158">最初の依頼を作成できます</text>
  </g>
</svg>
