<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1320" viewBox="0 0 1440 1320" role="img" aria-labelledby="title desc">
  <title id="title">Nagare Work Run Trace 実寸ワイヤーフレーム</title>
  <desc id="desc">Nagare の Work Run Trace 画面を 1440x1320 のデスクトップ密度で示す白黒ワイヤーフレーム。依頼文、各ステップの担当役割、入力、判断・作成・レビュー結果、次の受け渡しを長文で確認する。</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f7; }
      .sidebar { fill: #f0f0f0; stroke: #c9c9c9; stroke-width: 1; }
      .surface { fill: #fff; stroke: #d1d1d1; stroke-width: 1; }
      .soft { fill: #fafafa; stroke: #dadada; stroke-width: 1; }
      .strong { fill: #f1f1f1; stroke: #222; stroke-width: 1.3; }
      .selected { fill: #efefef; stroke: #222; stroke-width: 1.2; }
      .button { fill: #222; stroke: #222; stroke-width: 1; }
      .buttonLight { fill: #fff; stroke: #555; stroke-width: 1; }
      .chip { fill: #eee; stroke: #777; stroke-width: 1; }
      .chipDark { fill: #222; stroke: #222; stroke-width: 1; }
      .line { stroke: #d0d0d0; stroke-width: 1; fill: none; }
      .titleText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .heroText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .section { font: 700 16px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .body { font: 400 14px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .small { font: 400 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #555; letter-spacing: 0; }
      .tiny { font: 400 11px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #666; letter-spacing: 0; }
      .label { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .nav { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .navInv { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonText { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1320"/>

  <g id="app-shell">
    <rect class="sidebar" x="0" y="0" width="212" height="1320"/>
    <text class="titleText" x="28" y="46">Nagare</text>
    <text class="tiny" x="28" y="68">作業を進める画面</text>
    <rect class="chipDark" x="20" y="112" width="172" height="36" rx="7"/>
    <text class="navInv" x="42" y="135">ワーク</text>
    <text class="nav" x="42" y="184">プロジェクト</text>
    <text class="nav" x="42" y="226">知識</text>
    <text class="nav" x="42" y="268">エージェント</text>
    <text class="nav" x="42" y="310">設定</text>
    <line class="line" x1="20" y1="356" x2="192" y2="356"/>
    <text class="label" x="28" y="388">選択中のワーク</text>
    <text class="small" x="28" y="414">README の手順更新</text>
  </g>

  <g id="page-header">
    <rect class="surface" x="240" y="24" width="1172" height="72" rx="8"/>
    <text class="titleText" x="264" y="56">ワーク詳細: README のセットアップ手順を更新</text>
    <text class="small" x="264" y="78">進行詳細 / 依頼: docs/setup.md の変更を README に反映して</text>
    <rect class="chip" x="1190" y="42" width="86" height="24" rx="12"/>
    <text class="label" x="1218" y="59">処理中</text>
    <rect class="buttonLight" x="1292" y="36" width="72" height="32" rx="6"/>
    <text class="buttonTextDark" x="1314" y="57">停止</text>
  </g>

  <g id="decision-surface">
    <rect class="strong" x="240" y="116" width="1172" height="218" rx="8"/>
    <text class="label" x="268" y="148">タスクの状況</text>
    <text class="heroText" x="268" y="180">4手順中 2手順目。</text>
    <text class="body" x="268" y="210">README変更案を作成中です。</text>
    <text class="small" x="268" y="232">処理中のため、ユーザー操作は今は不要です。</text>
    <rect class="surface" x="268" y="258" width="142" height="32" rx="7"/>
    <text class="label" x="292" y="279">ユーザー操作なし</text>
    <rect class="buttonLight" x="426" y="258" width="118" height="32" rx="7"/>
    <text class="buttonTextDark" x="462" y="279">一覧に戻る</text>

    <rect class="surface" x="640" y="136" width="724" height="104" rx="7"/>
    <text class="label" x="658" y="160">依頼文</text>
    <text class="small" x="658" y="184">
      <tspan x="658" dy="0">docs/setup.md に追加したセットアップ手順を README に反映してください。既存のREADMEには古い導入説明が残っているので、</tspan>
      <tspan x="658" dy="18">読者が最初に見るべき手順が分かるように整理し、重複する説明や古い前提が残らないようにしてください。</tspan>
      <tspan x="658" dy="18">変更案を出す前に、setup.md の手順反映、README の重複説明なし、採用前レビュー表示の3点を確認してください。</tspan>
    </text>
    <rect class="surface" x="640" y="252" width="724" height="58" rx="7"/>
    <text class="label" x="658" y="276">現在の処理エージェント</text>
    <text class="body" x="808" y="276">ワーカー</text>
    <text class="small" x="658" y="298">README.md の変更案を作成中。次はレビュアーが setup.md との反映漏れを確認します。</text>
  </g>

  <g id="flow-detail">
    <rect class="surface" x="240" y="358" width="1172" height="934" rx="8"/>
    <text class="section" x="264" y="394">ステップごとの入出力</text>
    <text class="small" x="264" y="416">各ステップは内容に応じて縦に伸びます。入力、処理内容、出力/次の受け渡しを長文で追います。</text>

    <g id="step-1" transform="translate(264 446)">
      <rect class="soft" x="0" y="0" width="1124" height="196" rx="7"/>
      <text class="label" x="18" y="26">1. 整理</text>
      <text class="body" x="116" y="26">オーガナイザー</text>
      <rect class="chip" x="1038" y="12" width="58" height="24" rx="12"/>
      <text class="label" x="1056" y="29">完了</text>
      <rect class="surface" x="18" y="44" width="1080" height="42" rx="6"/>
      <text class="label" x="34" y="64">入力</text>
      <text class="small" x="90" y="62">
        <tspan x="90" dy="0">依頼本文: 「docs/setup.md に追加したセットアップ手順を README に反映して。既存の説明と矛盾しないようにしてほしい」</tspan>
        <tspan x="90" dy="18">参照素材: docs/setup.md の新しい手順、現在の README のセットアップ節、プロジェクトの既存表記ルール。</tspan>
      </text>
      <rect class="surface" x="18" y="96" width="1080" height="50" rx="6"/>
      <text class="label" x="34" y="116">判断</text>
      <text class="small" x="90" y="114">
        <tspan x="90" dy="0">この依頼は新規ページ作成ではなく README の既存節更新として扱う。setup.md の手順を主根拠にし、README にある古い説明を置き換える。</tspan>
        <tspan x="90" dy="18">ただし説明の重複を増やさないため、前提説明や背景説明は増やさず、実行順と確認条件だけをワーカーへ渡す。</tspan>
      </text>
      <rect class="surface" x="18" y="156" width="1080" height="26" rx="6"/>
      <text class="label" x="34" y="174">出力/次</text>
      <text class="small" x="90" y="174">ワーカーへの作業指示、参照ファイル、制約、レビュー時に見る確認条件をまとめて次ステップへ渡しました。</text>
    </g>

    <g id="step-2" transform="translate(264 658)">
      <rect class="selected" x="0" y="0" width="1124" height="238" rx="7"/>
      <text class="label" x="18" y="26">2. 作成</text>
      <text class="body" x="116" y="26">ワーカー</text>
      <rect class="chipDark" x="1028" y="11" width="68" height="26" rx="13"/>
      <text class="buttonText" x="1046" y="29">作業中</text>
      <rect class="surface" x="18" y="44" width="1080" height="58" rx="6"/>
      <text class="label" x="34" y="64">入力</text>
      <text class="small" x="90" y="62">
        <tspan x="90" dy="0">オーガナイザーからの作業指示: README.md のセットアップ節を更新し、setup.md の新手順が読者の最初の導線になるようにする。</tspan>
        <tspan x="90" dy="18">制約: 既存 README のトーンを維持する。古い導入文を丸ごと残さない。セットアップ後の確認方法は簡潔に残す。</tspan>
        <tspan x="90" dy="18">入力ファイル: README.md、docs/setup.md。確認条件: 手順反映、重複なし、レビュー判断を採用前に表示。</tspan>
      </text>
      <rect class="surface" x="18" y="112" width="1080" height="78" rx="6"/>
      <text class="label" x="34" y="132">作成</text>
      <text class="small" x="90" y="130">
        <tspan x="90" dy="0">README.md の変更案を作成中。`セットアップ` 節の手順順序を docs/setup.md に合わせ、古い説明と重なる段落を削除候補にしています。</tspan>
        <tspan x="90" dy="18">新しい本文案では、最初に作業フォルダを決め、次にランタイムを設定し、最後にデフォルトプロジェクトを作る流れとして整理します。</tspan>
        <tspan x="90" dy="18">レビューしやすいように、本文差し替え案、削除候補、差分要約、採用時の注意点を分けて出す予定です。</tspan>
      </text>
      <rect class="surface" x="18" y="200" width="1080" height="26" rx="6"/>
      <text class="label" x="34" y="218">出力/次</text>
      <text class="small" x="90" y="218">README 変更案、差分要約、削除候補、レビュー依頼をレビュアーへ渡します。</text>
    </g>

    <g id="step-3" transform="translate(264 912)">
      <rect class="soft" x="0" y="0" width="1124" height="208" rx="7"/>
      <text class="label" x="18" y="26">3. 確認</text>
      <text class="body" x="116" y="26">レビュアー</text>
      <rect class="chip" x="1038" y="12" width="58" height="24" rx="12"/>
      <text class="label" x="1056" y="29">待機</text>
      <rect class="surface" x="18" y="44" width="1080" height="50" rx="6"/>
      <text class="label" x="34" y="64">入力</text>
      <text class="small" x="90" y="62">
        <tspan x="90" dy="0">README 変更案、差分要約、削除候補、確認条件。確認条件は setup.md の手順反映、README の重複説明なし、採用前レビュー表示。</tspan>
        <tspan x="90" dy="18">レビュー時には、手順の抜け、順序の逆転、既存説明との矛盾、読者が次に取る行動の曖昧さを確認します。</tspan>
      </text>
      <rect class="surface" x="18" y="104" width="1080" height="66" rx="6"/>
      <text class="label" x="34" y="124">レビュー</text>
      <text class="small" x="90" y="122">
        <tspan x="90" dy="0">変更案が出たら、setup.md の手順が README の本文に過不足なく反映されているかを照合します。</tspan>
        <tspan x="90" dy="18">README 側で古い説明が残って読者を迷わせないか、同じ意味の説明が二重に出ていないかを確認します。</tspan>
        <tspan x="90" dy="18">不足があれば「どの入力に対して、どの出力が不足したか」が分かる差し戻し理由を作ります。</tspan>
      </text>
      <rect class="surface" x="18" y="180" width="1080" height="18" rx="6"/>
      <text class="label" x="34" y="194">出力/次</text>
      <text class="small" x="90" y="194">合格/差し戻し、レビュー理由、採用候補をオーガナイザーへ渡します。</text>
    </g>

    <g id="step-4" transform="translate(264 1136)">
      <rect class="soft" x="0" y="0" width="1124" height="130" rx="7"/>
      <text class="label" x="18" y="26">4. 確認へ</text>
      <text class="body" x="116" y="26">オーガナイザー</text>
      <rect class="chip" x="1028" y="12" width="68" height="24" rx="12"/>
      <text class="label" x="1040" y="29">未着手</text>
      <rect class="surface" x="18" y="44" width="1080" height="34" rx="6"/>
      <text class="label" x="34" y="64">入力</text>
      <text class="small" x="90" y="64">レビュー結果、採用候補、差し戻し理由。合格ならユーザーに確認を出し、差し戻しならワーカーへ戻します。</text>
      <rect class="surface" x="18" y="88" width="1080" height="30" rx="6"/>
      <text class="label" x="34" y="108">出力/次</text>
      <text class="small" x="90" y="108">完了結果を要約し、質問/確認の有無を決定。必要なら上部のタスクの状況に「確認する」を表示します。</text>
    </g>
  </g>
</svg>
