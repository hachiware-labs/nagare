<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1024" viewBox="0 0 1440 1024" role="img" aria-labelledby="title desc">
  <title id="title">Nagare Default Workspace Setup 実寸ワイヤーフレーム</title>
  <desc id="desc">Nagare の Default Workspace Setup 画面を 1440x1024 のデスクトップ密度で示す白黒ワイヤーフレーム。作業フォルダを選び、デフォルトプロジェクトと標準エージェントを作成して依頼受付へ進む。</desc>
  <defs>
    <style>
      .bg { fill: #f7f7f7; }
      .sidebar { fill: #f0f0f0; stroke: #c9c9c9; stroke-width: 1; }
      .surface { fill: #fff; stroke: #d1d1d1; stroke-width: 1; }
      .soft { fill: #fafafa; stroke: #dadada; stroke-width: 1; }
      .strong { fill: #f1f1f1; stroke: #222; stroke-width: 1.3; }
      .button { fill: #222; stroke: #222; stroke-width: 1; }
      .buttonLight { fill: #fff; stroke: #555; stroke-width: 1; }
      .chip { fill: #eee; stroke: #777; stroke-width: 1; }
      .chipDark { fill: #222; stroke: #222; stroke-width: 1; }
      .line { stroke: #d0d0d0; stroke-width: 1; fill: none; }
      .stepLine { stroke: #222; stroke-width: 1.4; fill: none; }
      .titleText { font: 700 22px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .section { font: 700 16px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #111; letter-spacing: 0; }
      .body { font: 400 14px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .small { font: 400 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #555; letter-spacing: 0; }
      .tiny { font: 400 11px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #666; letter-spacing: 0; }
      .label { font: 700 12px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .nav { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #333; letter-spacing: 0; }
      .navInv { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonText { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 13px "Segoe UI", "Yu Gothic UI", Meiryo, Arial, sans-serif; fill: #222; letter-spacing: 0; }
      .mono { font: 400 13px Consolas, "Cascadia Mono", monospace; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="1440" height="1024"/>

  <g id="app-shell">
    <rect class="sidebar" x="0" y="0" width="212" height="1024"/>
    <text class="titleText" x="28" y="46">Nagare</text>
    <text class="tiny" x="28" y="68">作業を進める画面</text>
    <rect class="chipDark" x="20" y="112" width="172" height="36" rx="7"/>
    <text class="navInv" x="42" y="135">ワーク</text>
    <text class="nav" x="42" y="184">プロジェクト</text>
    <text class="nav" x="42" y="226">知識</text>
    <text class="nav" x="42" y="268">エージェント</text>
    <text class="nav" x="42" y="310">設定</text>
    <line class="line" x1="20" y1="356" x2="192" y2="356"/>
    <text class="label" x="28" y="388">セットアップ</text>
    <text class="small" x="28" y="414">Default Workspace</text>
  </g>

  <g id="page-header">
    <rect class="surface" x="240" y="24" width="1172" height="72" rx="8"/>
    <text class="titleText" x="264" y="56">Default Workspace Setup</text>
    <text class="small" x="264" y="78">作業フォルダを選び、依頼を受け付ける初期構成を作成します</text>
  </g>

  <g id="setup-steps" transform="translate(240 116)">
    <rect class="surface" x="0" y="0" width="1172" height="72" rx="8"/>
    <circle cx="34" cy="36" r="12" fill="#222"/>
    <text class="buttonText" x="30" y="41">1</text>
    <text class="label" x="56" y="32">セットアップ開始</text>
    <text class="small" x="56" y="50">完了</text>
    <line class="stepLine" x1="184" y1="36" x2="286" y2="36"/>
    <circle cx="310" cy="36" r="12" fill="#222"/>
    <text class="buttonText" x="306" y="41">2</text>
    <text class="label" x="332" y="32">実行環境</text>
    <text class="small" x="332" y="50">完了</text>
    <line class="stepLine" x1="460" y1="36" x2="562" y2="36"/>
    <circle cx="586" cy="36" r="12" fill="#222"/>
    <text class="buttonText" x="582" y="41">3</text>
    <text class="label" x="608" y="32">作業場所</text>
    <text class="small" x="608" y="50">この画面</text>
    <line class="line" x1="742" y1="36" x2="844" y2="36"/>
    <circle cx="868" cy="36" r="12" fill="#fff" stroke="#555"/>
    <text class="label" x="864" y="41">4</text>
    <text class="label" x="890" y="32">最初の依頼</text>
    <text class="small" x="890" y="50">次へ</text>
  </g>

  <g id="workspace-setup-main" transform="translate(240 212)">
    <rect class="strong" x="0" y="0" width="1172" height="644" rx="8"/>

    <g id="folder-selection" transform="translate(24 84)">
      <rect class="surface" x="0" y="0" width="686" height="360" rx="8"/>
      <text class="section" x="24" y="36">作業場所</text>

      <text class="label" x="24" y="88">作業フォルダ</text>
      <rect class="soft" x="24" y="104" width="520" height="44" rx="7"/>
      <text class="mono" x="42" y="132">C:\Users\naruhide\workspace\nagare</text>
      <rect class="buttonLight" x="558" y="104" width="104" height="44" rx="7"/>
      <text class="buttonTextDark" x="588" y="132">参照</text>

      <rect class="soft" x="24" y="178" width="638" height="126" rx="8"/>
      <text class="section" x="44" y="210">デフォルトプロジェクト</text>
      <text class="label" x="44" y="248">名前</text>
      <rect class="surface" x="92" y="226" width="212" height="34" rx="7"/>
      <text class="body" x="110" y="248">nagare</text>
      <rect class="chip" x="320" y="226" width="86" height="24" rx="12"/>
      <text class="label" x="344" y="243">自動</text>
      <line class="line" x1="44" y1="276" x2="634" y2="276"/>
      <text class="small" x="44" y="294">選択したフォルダを作業場所として使います</text>
    </g>

    <g id="initial-structure" transform="translate(742 84)">
      <rect class="surface" x="0" y="0" width="406" height="360" rx="8"/>
      <text class="section" x="22" y="34">作成される初期構成</text>

      <g transform="translate(22 74)">
        <rect class="soft" x="0" y="0" width="362" height="54" rx="8"/>
        <circle cx="22" cy="27" r="8" fill="#222"/>
        <path d="M 18 27 L 21 30 L 27 23" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="label" x="44" y="24">デフォルトプロジェクト</text>
        <text class="small" x="44" y="42">作業フォルダから作成</text>
      </g>

      <g transform="translate(22 142)">
        <rect class="soft" x="0" y="0" width="362" height="54" rx="8"/>
        <circle cx="22" cy="27" r="8" fill="#222"/>
        <path d="M 18 27 L 21 30 L 27 23" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="label" x="44" y="24">オーガナイザー</text>
        <text class="small" x="44" y="42">依頼の進め方を決める担当</text>
      </g>

      <g transform="translate(22 210)">
        <rect class="soft" x="0" y="0" width="362" height="54" rx="8"/>
        <circle cx="22" cy="27" r="8" fill="#222"/>
        <path d="M 18 27 L 21 30 L 27 23" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="label" x="44" y="24">ワーカー</text>
        <text class="small" x="44" y="42">依頼内容を処理する担当</text>
      </g>

      <g transform="translate(22 278)">
        <rect class="soft" x="0" y="0" width="362" height="54" rx="8"/>
        <circle cx="22" cy="27" r="8" fill="#222"/>
        <path d="M 18 27 L 21 30 L 27 23" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        <text class="label" x="44" y="24">レビュアー</text>
        <text class="small" x="44" y="42">結果を確認する担当</text>
      </g>
    </g>

    <g id="footer-actions" transform="translate(24 582)">
      <rect class="buttonLight" x="0" y="0" width="116" height="38" rx="7"/>
      <text class="buttonTextDark" x="42" y="24">戻る</text>
      <rect class="button" x="984" y="0" width="140" height="38" rx="7"/>
      <text class="buttonText" x="1016" y="24">作成して次へ</text>
    </g>
  </g>
</svg>
