<svg xmlns="http://www.w3.org/2000/svg" width="4000" height="980" viewBox="0 0 4000 980" role="img" aria-labelledby="title desc">
  <title id="title">Nagare modal flow wireframe</title>
  <desc id="desc">A monochrome wireframe of Nagare modal-only setup screens: project setup, runtime setup, connection check, and error recovery.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#222"/>
    </marker>
    <style>
      .bg { fill: #f7f7f4; }
      .backdrop { fill: #ecece7; stroke: #d5d5cc; stroke-width: 1.5; rx: 8; }
      .modal { fill: #fff; stroke: #222; stroke-width: 2.4; rx: 8; }
      .panel { fill: #fbfbf8; stroke: #c8c8c0; stroke-width: 1.5; rx: 8; }
      .panelStrong { fill: #f1f1ec; stroke: #222; stroke-width: 1.8; rx: 8; }
      .line { stroke: #222; stroke-width: 2.4; fill: none; }
      .dash { stroke: #777; stroke-width: 2; fill: none; stroke-dasharray: 8 8; }
      .title { font: 700 40px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #151515; letter-spacing: 0; }
      .subtitle { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; letter-spacing: 0; }
      .contract { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; letter-spacing: .2px; }
      .contractBody { font: 400 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #444; letter-spacing: 0; }
      .h { font: 700 28px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #171717; letter-spacing: 0; }
      .body { font: 400 20px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #333; letter-spacing: 0; }
      .small { font: 400 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #555; letter-spacing: 0; }
      .label { font: 700 16px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; letter-spacing: 0; }
      .buttonText { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #fff; letter-spacing: 0; }
      .buttonTextDark { font: 700 18px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #222; letter-spacing: 0; }
    </style>
  </defs>

  <rect class="bg" width="4000" height="980"/>
  <text class="title" x="72" y="74">Nagare modal flow wireframe</text>
  <text class="subtitle" x="72" y="108">一時的な手続きだけをモーダルとして扱う。全体画面とは別に、入力負荷と戻り先を確認する</text>

  <g transform="translate(72 148)">
    <text class="contract" x="0" y="0">MODAL 01: プロジェクト設定</text>
    <text class="contractBody" x="0" y="30">問い: ワーク実行の文脈を最低限設定できるか</text>
    <text class="contractBody" x="0" y="58">次: ランタイム設定へ</text>
  </g>
  <g transform="translate(1060 148)">
    <text class="contract" x="0" y="0">MODAL 02: ランタイム設定</text>
    <text class="contractBody" x="0" y="30">問い: 実行可能なAIランタイムを選べるか</text>
    <text class="contractBody" x="0" y="58">次: 接続確認へ</text>
  </g>
  <g transform="translate(2048 148)">
    <text class="contract" x="0" y="0">MODAL 03: 接続確認 / 復帰</text>
    <text class="contractBody" x="0" y="30">問い: 成功ならワークへ、失敗なら直せるか</text>
    <text class="contractBody" x="0" y="58">次: ワーク一覧へ戻る</text>
  </g>
  <g transform="translate(3036 148)">
    <text class="contract" x="0" y="0">MODAL 04: 結果確認</text>
    <text class="contractBody" x="0" y="30">問い: 結果を採用するか、メッセージ付きで差し戻すか</text>
    <text class="contractBody" x="0" y="58">次: OKで完了、差し戻しで実行詳細へ戻る</text>
  </g>

  <path class="line" marker-end="url(#arrow)" d="M 960 510 C 998 510 1010 510 1048 510"/>
  <text class="small" x="950" y="480">次へ</text>
  <path class="line" marker-end="url(#arrow)" d="M 1948 510 C 1986 510 1998 510 2036 510"/>
  <text class="small" x="1928" y="480">保存して確認</text>
  <path class="line" marker-end="url(#arrow)" d="M 2936 510 C 2974 510 2986 510 3024 510"/>
  <text class="small" x="2918" y="480">結果で確認する</text>

  <!-- Modal 01 -->
  <g transform="translate(72 240)">
    <rect class="backdrop" width="860" height="600"/>
    <rect class="modal" x="90" y="70" width="680" height="460"/>
    <text class="h" x="130" y="122">プロジェクト設定</text>
    <text class="small" x="130" y="152">初回に必要な文脈だけを入力</text>

    <rect class="panelStrong" x="130" y="188" width="600" height="72"/>
    <text class="label" x="154" y="216">プロジェクト名</text>
    <text class="small" x="154" y="244">例: Nagare UI</text>

    <rect class="panelStrong" x="130" y="282" width="600" height="72"/>
    <text class="label" x="154" y="310">対象フォルダ</text>
    <text class="small" x="154" y="338">ファイルチューザーで選択</text>

    <rect class="panel" x="130" y="376" width="600" height="58"/>
    <text class="label" x="154" y="412">評価基準</text>
    <text class="small" x="502" y="412">編集時だけ展開</text>

    <rect class="panel" x="392" y="456" width="142" height="46"/>
    <text class="buttonTextDark" x="433" y="486">戻る</text>
    <rect x="552" y="456" width="178" height="46" rx="8" fill="#222"/>
    <text class="buttonText" x="624" y="486">次へ</text>
  </g>

  <!-- Modal 02 -->
  <g transform="translate(1060 240)">
    <rect class="backdrop" width="860" height="600"/>
    <rect class="modal" x="90" y="70" width="680" height="460"/>
    <text class="h" x="130" y="122">ランタイム設定</text>
    <text class="small" x="130" y="152">検出された実行環境から選ぶ</text>

    <rect class="panelStrong" x="130" y="188" width="600" height="86"/>
    <text class="label" x="154" y="218">ランタイム</text>
    <text class="body" x="154" y="252">Codex CLI</text>
    <text class="small" x="578" y="252">選択中</text>

    <rect class="panelStrong" x="130" y="296" width="600" height="86"/>
    <text class="label" x="154" y="326">モデル</text>
    <text class="body" x="154" y="360">既定モデルを使用</text>
    <text class="small" x="514" y="360">変更可能</text>

    <rect class="panel" x="130" y="404" width="600" height="42"/>
    <text class="small" x="154" y="431">未検出のランタイムは候補に表示しない</text>

    <rect class="panel" x="392" y="456" width="142" height="46"/>
    <text class="buttonTextDark" x="433" y="486">戻る</text>
    <rect x="552" y="456" width="178" height="46" rx="8" fill="#222"/>
    <text class="buttonText" x="586" y="486">保存して確認</text>
  </g>

  <!-- Modal 03 -->
  <g transform="translate(2048 240)">
    <rect class="backdrop" width="860" height="600"/>
    <rect class="modal" x="90" y="70" width="680" height="460"/>
    <text class="h" x="130" y="122">接続確認</text>
    <text class="small" x="130" y="152">ワーク実行前に最低限の通信を確認</text>

    <rect class="panelStrong" x="130" y="192" width="600" height="104"/>
    <text class="label" x="154" y="222">成功時</text>
    <text class="body" x="154" y="256">ワーク画面へ戻り、依頼欄を有効化</text>

    <rect class="panel" x="130" y="324" width="600" height="86"/>
    <text class="label" x="154" y="354">失敗時</text>
    <text class="small" x="154" y="382">原因と修正先だけを表示し、ランタイム設定へ戻す</text>

    <rect class="panel" x="330" y="456" width="188" height="46"/>
    <text class="buttonTextDark" x="366" y="486">設定へ戻る</text>
    <rect x="538" y="456" width="192" height="46" rx="8" fill="#222"/>
    <text class="buttonText" x="586" y="486">ワークへ戻る</text>
  </g>

  <!-- Modal 04 -->
  <g transform="translate(3036 240)">
    <rect class="backdrop" width="860" height="600"/>
    <rect class="modal" x="90" y="70" width="680" height="460"/>
    <text class="h" x="130" y="122">結果を確認</text>
    <text class="small" x="130" y="152">結果サマリーから開く一時的な判断画面</text>

    <rect class="panelStrong" x="130" y="188" width="600" height="98"/>
    <text class="label" x="154" y="218">確認対象</text>
    <text class="body" x="154" y="252">回答、生成ファイル、レビュー根拠を確認済み</text>

    <rect class="panel" x="130" y="310" width="600" height="92"/>
    <text class="label" x="154" y="340">差し戻しメッセージ</text>
    <text class="small" x="154" y="370">不足している点、直してほしい点を入力...</text>

    <rect class="panel" x="330" y="456" width="188" height="46"/>
    <text class="buttonTextDark" x="356" y="486">コメント差し戻し</text>
    <rect x="538" y="456" width="192" height="46" rx="8" fill="#222"/>
    <text class="buttonText" x="608" y="486">OK</text>
  </g>

  <path class="dash" marker-end="url(#arrow)" d="M 2290 850 C 2290 908 1480 908 1480 850"/>
  <text class="small" x="1800" y="920">接続失敗はランタイム設定へ戻す</text>
  <path class="dash" marker-end="url(#arrow)" d="M 3310 850 C 3310 908 2490 908 2490 850"/>
  <text class="small" x="2860" y="920">差し戻しは実行詳細へ戻る</text>
</svg>
